/ variables (non-secret)", "ja": "テストデータ / 変数（非機密）"}, "批量导入": {"en": "Batch import", "ja": "一括インポート"}, "固定请求头": {"en": "Fixed request headers", "ja": "固定リクエストヘッダー"}, "每次请求都会带上（用于过站点校验：自动化标识、鉴权头、绕过风控）。值可用 ${env.KEY} / ${secret.KEY}。": {"en": "Sent with every request (to pass your site's checks: automation flags, auth headers, bot bypass). Values may use ${env.KEY} / ${secret.KEY}.", "ja": "毎リクエストに付与（サイトのチェック通過用：自動化フラグ、認証ヘッダー、ボット回避）。値に ${env.KEY} / ${secret.KEY} 使用可。"}, "固定 Query 参数": {"en": "Fixed query params", "ja": "固定クエリパラメータ"}, "追加到每次页面导航（点击 / 跳转 / 表单）发往服务器的 URL —— 用于过服务端校验（如灰度 ?e2e=1）；入口页地址栏也会带上。值可用 ${env.KEY}。": {"en": "Added to every page navigation the server receives (clicks, redirects, forms) — for server-side checks (e.g. ?e2e=1); also in the entry-page URL. Values may use ${env.KEY}.", "ja": "各ページ遷移（クリック / リダイレクト / フォーム）でサーバーが受け取る URL に追加 —— サーバー側チェック用（例 ?e2e=1）。入口ページの URL にも付与。値に ${env.KEY} 使用可。"}, "登录态（缓存会话）": {"en": "Login state (cached session)", "ja": "ログイン状態（キャッシュセッション）"}, "跑一次登录流程，缓存 cookies + localStorage；之后每次运行直接注入并跳过登录，更快更稳。": {"en": "Runs the login flow once and caches cookies + localStorage; later runs inject it and skip login — faster & steadier.", "ja": "ログインフローを一度実行し cookies + localStorage をキャッシュ。以降の実行は注入してログインをスキップ — 高速で安定。"}, "已捕获会话": {"en": "Session captured", "ja": "セッション取得済み"}, "尚未捕获会话 —— 运行时会走登录流程。": {"en": "No session captured — runs will perform the login flow.", "ja": "セッション未取得 —— 実行時にログインフローを行います。"}, "捕获登录态": {"en": "Capture session", "ja": "セッションを取得"}, "重新捕获": {"en": "Re-capture", "ja": "再取得"}, "清除会话": {"en": "Clear session", "ja": "セッションを消去"}, "请先保存环境再捕获。": {"en": "Save the environment first, then capture.", "ja": "先に環境を保存してから取得してください。"}, "API 式登录（免 UI）": {"en": "API login (no UI)", "ja": "API ログイン（UI なし）"}, "直接打登录接口拿会话：从响应的 Set-Cookie 抓 cookie，或按 JSON 路径抓 token 注入到请求头。比跑 UI 登录更快更稳。账密用 ${env.KEY} / ${secret.KEY}。": {"en": "Hit the login endpoint directly: captures the session cookie from Set-Cookie, and/or a token from a JSON path (injected as a header). Faster & steadier than UI login. Credentials via ${env.KEY} / ${secret.KEY}.", "ja": "ログインエンドポイントを直接呼ぶ：Set-Cookie から cookie を取得、JSON パスから token を取得してヘッダーに注入。UI ログインより高速で安定。認証情報は ${env.KEY} / ${secret.KEY}。"}, "token 的 JSON 路径，如 accessToken（可选）": {"en": "token JSON path, e.g. accessToken (optional)", "ja": "token の JSON パス（例 accessToken、任意）"}, "通过 API 登录": {"en": "Log in via API", "ja": "API でログイン"}, "手贴会话（cookie / storageState）": {"en": "Paste session (cookie / storageState)", "ja": "セッションを貼り付け（cookie / storageState）"}, "从浏览器 DevTools 拷贝已登录的 cookie / storageState 直接用，无需跑登录。": {"en": "Use an already-logged-in cookie / storageState copied from browser DevTools — no login run needed.", "ja": "ブラウザの DevTools からコピーしたログイン済みの cookie / storageState をそのまま使用 — ログイン実行不要。"}, "应用会话": {"en": "Apply session", "ja": "セッションを適用"}, "需要登录态": {"en": "Requires login (登录态)", "ja": "ログインが必要（登录态）"}, "登录流程 — 每行一个自然语言步骤": {"en": "Login flow — one natural-language step per line", "ja": "ログインフロー — 1 行につき 1 つの自然言語ステップ"}, "默认环境": {"en": "Default environment", "ja": "デフォルト環境"}, "保存环境": {"en": "Save environment", "ja": "環境を保存"}, "后端离线 — 请启动服务器以管理环境。": {"en": "Backend offline — start the server to manage environments.", "ja": "バックエンドがオフラインです — サーバーを起動して環境を管理してください。"}, "静态加密且只写。值永不回显 — 在步骤中以 ${secret.KEY} 引用。": {"en": "Encrypted at rest and write-only. Values are never displayed back — reference them from steps as", "ja": "保存時に暗号化され、書き込み専用です。値は表示されません — ステップから次のように参照してください："}, "后端离线 — 请启动服务器以管理密钥。": {"en": "Backend offline — start the server to manage secrets.", "ja": "バックエンドがオフラインです — サーバーを起動してシークレットを管理してください。"}, "尚无密钥。": {"en": "No secrets yet.", "ja": "シークレットはまだありません。"}, "键": {"en": "Key", "ja": "キー"}, "值（只写）": {"en": "Value (write-only)", "ja": "値（書き込み専用）"}, "步骤可引用 ${env.KEY} 与 ${secret.KEY} 占位符。": {"en": "Steps may reference", "ja": "ステップは次のプレースホルダーを参照できます："}, "和": {"en": "and", "ja": "および"}, "占位符。": {"en": "placeholders.", "ja": "プレースホルダー。"}, "AI 全局设置": {"en": "AI settings", "ja": "AI 設定"}, "语言强制": {"en": "Language enforcement", "ja": "言語の強制"}, "AI 返回语言跟随界面语言": {"en": "Force AI output to match the UI language", "ja": "AI の出力を UI 言語に合わせる"}, "开启后，当前界面语言会随每个 AI 请求一并发送，模型返回的自然语言内容（用例标题、原因、步骤、断言、AI 修正说明）必须使用该语言。代码、占位符 ${env.KEY}、URL 不受影响。切换界面语言即切换目标语言。": {"en": "When on, the current UI language is sent with every AI request, and the model's natural-language output (case titles, reasons, steps, assertions, refine notes) must use that language. Code, ${env.KEY} placeholders, and URLs are unaffected. Switch the UI language to switch the target language.", "ja": "オンにすると、現在の UI 言語が各 AI リクエストと共に送信され、モデルの自然言語出力（ケースのタイトル、理由、ステップ、アサーション、修正メモ）はその言語で返されます。コード、${env.KEY} プレースホルダー、URL は影響を受けません。UI 言語を切り替えると対象言語も切り替わります。"}, "= 当前目标语言": {"en": "= current target language", "ja": "= 現在の対象言語"}, "调试模式 / LLM debug": {"en": "Debug mode / LLM debug", "ja": "デバッグモード / LLM debug"}, "记录所有 LLM 请求与响应": {"en": "Log all LLM requests & responses", "ja": "すべての LLM リクエストとレスポンスを記録"}, "开启后，发送给模型的每个请求（图像 + 文本）及其响应都会写入磁盘，用于调整提示词模板。会带来额外开销，日常使用请保持关闭。": {"en": "When on, every request sent to the model (images + text) and its response are logged to disk for prompt-template tuning. It adds overhead, so keep it off in normal use.", "ja": "オンにすると、モデルに送信される各リクエスト（画像 + テキスト）とそのレスポンスがプロンプトテンプレート調整用にディスクへ記録されます。オーバーヘッドが増えるため、通常は無効のままにしてください。"}, "最近的记录": {"en": "Recent captures", "ja": "最近のキャプチャ"}, "个记录": {"en": "captures", "ja": "件のキャプチャ"}, "尚无记录。": {"en": "No captures yet.", "ja": "キャプチャはまだありません。"}, "后端离线 — 请启动服务器以配置调试。": {"en": "Backend offline — start the server to configure debugging.", "ja": "バックエンドがオフラインです — サーバーを起動してデバッグを設定してください。"}, "提示词模板 / Prompt templates": {"en": "Prompt templates", "ja": "プロンプトテンプレート"}, "调整驱动探索规划与代码生成的提示词模板。修改后需保存。": {"en": "Tune the prompt templates that drive exploration planning and code generation. Save after editing.", "ja": "探索計画とコード生成を駆動するプロンプトテンプレートを調整します。編集後は保存してください。"}, "探索规划提示词": {"en": "Explore planning prompt", "ja": "探索計画プロンプト"}, "探索时用于从页面规划测试流程的主提示词。": {"en": "The main prompt used to plan test flows from a page during exploration.", "ja": "探索中にページからテストフローを計画するために使用されるメインプロンプト。"}, "提示词须指示模型返回带 title/type/priority/reason/steps/expected 的 flows 数组；${env.KEY} / ${secret.KEY} 为占位符 — 请勿删除凭据占位符相关说明。": {"en": "Must instruct the model to return a flows array with title/type/priority/reason/steps/expected; ${env.KEY} / ${secret.KEY} are placeholders — don't remove the credential-placeholder instruction.", "ja": "モデルに title/type/priority/reason/steps/expected を持つ flows 配列を返すよう指示する必要があります。${env.KEY} / ${secret.KEY} はプレースホルダーです — 認証情報プレースホルダーの指示を削除しないでください。"}, "深爬前缀": {"en": "Deep-crawl prefix", "ja": "ディープクロール接頭辞"}, "深度爬取时附加在探索提示词前的前缀。": {"en": "Prefix prepended to the explore prompt during a deep crawl.", "ja": "ディープクロール時に探索プロンプトの前に付加される接頭辞。"}, "Dapp 探索提示词": {"en": "Dapp explore prompt", "ja": "Dapp 探索プロンプト"}, "「Dapp 模式」探索时使用:按 Web3 方法学生成连接/交易/断言用例,并附带链上校验(chain 字段)。": {"en": "Used in 'Dapp mode' exploration: generates Web3-methodology connect/tx/assert cases with on-chain checks (the chain field).", "ja": "「Dapp モード」探索で使用：Web3 方法論の接続/取引/検証ケースをオンチェーン検証（chain フィールド）付きで生成。"}, "代码生成提示词": {"en": "Code-generation prompt", "ja": "コード生成プロンプト"}, "从某个测试用例的步骤生成可执行代码时使用的提示词。": {"en": "The prompt used to generate runnable code from a test case's steps.", "ja": "テストケースのステップから実行可能なコードを生成するために使用されるプロンプト。"}, "恢复默认": {"en": "Reset to default", "ja": "デフォルトに戻す"}, "已修改": {"en": "modified", "ja": "変更済み"}, "后端离线 — 请启动服务器以编辑提示词模板。": {"en": "Backend offline — start the server to edit prompt templates.", "ja": "バックエンドがオフラインです — サーバーを起動してプロンプトテンプレートを編集してください。"}, "深度爬取": {"en": "Deep crawl", "ja": "ディープクロール"}, "Dapp 模式": {"en": "Dapp mode", "ja": "Dapp モード"}, "把站点当 Web3 dapp 探索:注入钱包连接,按 dapp 方法学生成用例(连接/交易/断言),并附带链上校验。": {"en": "Explore the site as a Web3 dapp: inject + connect a wallet, generate dapp-methodology cases (connect/tx/assert) pre-wired with on-chain checks.", "ja": "サイトを Web3 dapp として探索：ウォレットを注入・接続し、dapp 方法論のケース（接続/取引/検証）をオンチェーン検証付きで生成。"}, "登录 / 前进一屏并重新规划，让登录后的流程基于真实 UI": {"en": "Log in / advance one screen and re-plan, so post-login flows are grounded in the real UI", "ja": "ログイン / 1 画面進めて再計画し、ログイン後のフローを実際の UI に基づかせます"}, "探索中…": {"en": "Exploring…", "ja": "探索中…"}, "智能体探索中…": {"en": "Agent exploring…", "ja": "エージェントが探索中…"}, "实时智能体视图": {"en": "Live agent view", "ja": "ライブエージェントビュー"}, "探索日志": {"en": "Exploration log", "ja": "探索ログ"}, "指定一个 URL 并开始探索。": {"en": "Point at a URL and start exploring.", "ja": "URL を指定して探索を開始してください。"}, "已发现的流程": {"en": "Discovered flows", "ja": "発見されたフロー"}, "已发现": {"en": "Discovered", "ja": "発見しました："}, "个用例 — 已保存到本项目。": {"en": "cases — saved to this project.", "ja": "件のケース — このプロジェクトに保存しました。"}, "在测试用例中查看": {"en": "View in Test cases", "ja": "テストケースで表示"}, "新建项目": {"en": "New project", "ja": "新規プロジェクト"}, "试试 dapp 示例": {"en": "Try dapp example", "ja": "dapp の例を試す"}, "删除项目「{name}」及其全部用例、运行、环境、密钥?此操作不可撤销。": {"en": "Delete project “{name}” and all its cases, runs, environments, and secrets? This cannot be undone.", "ja": "プロジェクト「{name}」とそのすべてのケース、実行、環境、シークレットを削除しますか？元に戻せません。"}, "让 TestPilot 指向一个网站，规划并管理其端到端测试套件。": {"en": "Point TestPilot at a website to plan and manage its E2E test suite.", "ja": "TestPilot をウェブサイトに向けて、E2E テストスイートを計画・管理します。"}, "（后端离线 — 显示本地数据）": {"en": "(backend offline — showing local data)", "ja": "（バックエンドがオフライン — ローカルデータを表示）"}, "目标 URL": {"en": "Target URL", "ja": "対象 URL"}, "目标端": {"en": "Platform", "ja": "対象プラットフォーム"}, "Web 项目可启用 Web3 与链上断言。": {"en": "Web projects can enable web3 and on-chain assertions.", "ja": "Web プロジェクトでは web3 とオンチェーン検証を有効化できます。"}, "原生端不提供 Web3 与链上配置，已保存的设置会保留。": {"en": "Native ends offer no web3 or chain settings; anything already saved is kept.", "ja": "ネイティブ端末では web3 とチェーン設定は提供されません（保存済みの設定は保持）。"}, "创建项目": {"en": "Create project", "ja": "プロジェクトを作成"}, "这台机器上已经有 {n} 次运行，它们照常可读。": {"en": "This machine already has {n} runs; they are still readable.", "ja": "このマシンには既に {n} 件の実行があり、引き続き閲覧できます。"}, "尚无项目。点击“新建项目”让 TestPilot 指向一个网站。": {"en": "No projects yet. Click “New project” to point TestPilot at a website.", "ja": "プロジェクトがまだありません。「新規プロジェクト」をクリックして TestPilot をウェブサイトに向けてください。"}, "导出的是已批准进套件的用例，现在一条都没有——最近一次运行有 {n} 条等着复核": {"en": "the export contains approved cases, and there are none yet — the latest run has {n} awaiting review", "ja": "エクスポートは承認済みケースのみ。まだ 0 件——最新実行に {n} 件がレビュー待ち"}, "导出的是已批准进套件的用例，现在一条都没有。先跑一次流水线": {"en": "the export contains approved cases, and there are none yet. Run the pipeline first", "ja": "エクスポートは承認済みケースのみ。まずパイプラインを実行してください"}, "规格材料（可选）": {"en": "Requirements (optional)", "ja": "仕様資料（任意）"}, "挂了 {n} 份文档——跑流水线时 source.spec 默认读它们": {"en": "{n} documents attached — source.spec reads them by default when the pipeline runs", "ja": "{n} 件の資料を添付——パイプライン実行時に source.spec が既定で読み込む"}, "没建成——后端没有应答。项目还不存在，改完再试一次。": {"en": "not created — the backend did not answer. The project does not exist yet; fix it and try again.", "ja": "作成できませんでした——バックエンドが応答しません。プロジェクトはまだ存在しません。修正して再試行してください。"}, "没有文档也能建。但那样规格只能从**观察**里来，由它推出的用例只可能发现「产品变了」，永远不可能发现「产品错了」——观察不可能反驳被观察者": {"en": "you can create it without documents. But then the specification can only come from observation, and cases derived from it can only find that the product changed — never that it is wrong. An observation cannot contradict the thing it observed", "ja": "資料なしでも作成できます。ただし仕様は観察からしか得られず、そこから導いたケースは「変わった」ことしか発見できません——観察は観察対象に反論できない"}, "挂了 {n} 份文档": {"en": "{n} documents attached", "ja": "資料 {n} 件"}, "文档表达的是意图，所以对着它写的用例挂了，可能意味着「产品错了」。注意：图上如果自己写死了材料路径，跑的是图上那份，不是这里挂的——起跑时会提示": {"en": "a document expresses intent, so a case written against it can fail because the product is wrong. Note: if the graph pins its own paths, the run reads those, not these — you are warned at start", "ja": "資料は意図を表すため、それに対して書いたケースの失敗は「製品が誤っている」ことを意味しうる。グラフ側でパスが固定されている場合はそちらが読まれます（起動時に警告）"}, "规格来自观察": {"en": "spec from observation", "ja": "仕様は観察から"}, "观察表达的是现状，所以对着它写的用例只可能发现「产品变了」，永远不可能发现「产品错了」——观察不可能反驳被观察者。给项目挂上文档才能改变这一点": {"en": "observation expresses the status quo, so cases written against it can only find that the product changed — never that it is wrong. Attaching documents to the project is what changes that", "ja": "観察は現状を表すため、そこから書いたケースは「変わった」ことしか発見できない。資料を添付して初めて変わる"}, "{n} 条已批准": {"en": "{n} approved", "ja": "{n} 件承認済み"}, "最近一次 {n} 条待复核 · 共 {runs} 次运行": {"en": "{n} awaiting review in the latest of {runs} runs", "ja": "最新実行で {n} 件レビュー待ち · 全 {runs} 実行"}, "工作流跑出来、还没人表过态的用例。它们挂在运行上，不在看板上——批准之后才进套件": {"en": "cases a workflow produced that nobody has judged yet. They live on the run, not the board — approving is what puts them in the suite", "ja": "ワークフローが生成し、まだ誰も判断していないケース。実行側にあり、ボードにはない——承認して初めてスイートに入る"}, "还没有用例": {"en": "no cases yet", "ja": "ケースなし"}, "打开测试用例": {"en": "Open test cases", "ja": "テストケースを開く"}, "活动": {"en": "Active", "ja": "アクティブ"}, "产品地图": {"en": "Product map", "ja": "プロダクトマップ"}, "{walked} 条路走过 · {unseen} 个入口没进去": {"en": "{walked} paths walked · {unseen} entrances never opened", "ja": "{walked} 経路を通過 · {unseen} 入口は未訪問"}, "{walked} 条路走过": {"en": "{walked} paths walked", "ja": "{walked} 経路を通過"}, "看地图": {"en": "Open the map", "ja": "マップを開く"}, "规格材料 · 探索得来": {"en": "Specification · from exploration", "ja": "仕様資料 · 探索から"}, "规格材料 · 由代码推得": {"en": "Specification · from the codebase", "ja": "仕様資料 · コードから"}, "描述现状而非意图：由它产出的用例只能发现「变了」": {"en": "Describes what is, not what was intended: cases from it can only catch “it changed”", "ja": "意図ではなく現状の記述：ここから出るケースは「変わった」しか検出できない"}, "读全文": {"en": "Read it", "ja": "全文を読む"}, "来自 {n} 份文档": {"en": "from {n} documents", "ja": "{n} 件の文書から"}, "故事树": {"en": "Story tree", "ja": "ストーリーツリー"}, "读故事": {"en": "Read the stories", "ja": "ストーリーを読む"}, "抽样 {n} 条": {"en": "{n} sampled", "ja": "{n} 件を抽出"}, "看这批用例": {"en": "See this batch", "ja": "このバッチを見る"}, "门禁①": {"en": "Gate ①", "ja": "ゲート①"}, "{n} 条 finding · 负例 {neg}%": {"en": "{n} findings · {neg}% negative", "ja": "{n} 件の指摘 · 異常系 {neg}%"}, "{n} 条 finding · 负例 {neg}% / 需 ≥{min}% {ok}": {"en": "{n} findings · {neg}% negative / needs ≥{min}% {ok}", "ja": "{n} 件の指摘 · 異常系 {neg}% / 必要 ≥{min}% {ok}"}, "去复核": {"en": "Go review", "ja": "レビューへ"}, "判据有据率": {"en": "Machine-backed oracles", "ja": "機械判定の割合"}, "声称 {claims}": {"en": "claims {claims}", "ja": "申告 {claims}"}, "用例代码": {"en": "Test code", "ja": "テストコード"}, "打开代码线": {"en": "Open the code line", "ja": "コードラインを開く"}, "门禁② {score}": {"en": "Gate ② {score}", "ja": "ゲート② {score}"}, "执行": {"en": "Execution", "ja": "実行"}, "看执行记录": {"en": "See the runs", "ja": "実行記録を見る"}, "loose {loose} · strict {strict} · 退化 {degraded}": {"en": "loose {loose} · strict {strict} · degraded {degraded}", "ja": "loose {loose} · strict {strict} · 劣化 {degraded}"}, "{graph} v{ver} · {n} 个节点": {"en": "{graph} v{ver} · {n} nodes", "ja": "{graph} v{ver} · {n} ノード"}, " · 消融 {list}": {"en": " · ablated {list}", "ja": " · アブレーション {list}"}, "进入 {type}": {"en": "entering {type}", "ja": "{type} に入る"}, "失败：{msg}": {"en": "failed: {msg}", "ja": "失敗：{msg}"}, "门禁 {gate} · {pct}%": {"en": "gate {gate} · {pct}%", "ja": "ゲート {gate} · {pct}%"}, "门禁 {gate} · {pct}% · {n} 条 finding": {"en": "gate {gate} · {pct}% · {n} findings", "ja": "ゲート {gate} · {pct}% · {n} 件の指摘"}, "{story} → {n} 条": {"en": "{story} → {n}", "ja": "{story} → {n} 件"}, "执行 {status}": {"en": "run {status}", "ja": "実行 {status}"}, "修复第 {n} 轮": {"en": "repair round {n}", "ja": "修復 {n} 回目"}, "修复第 {n} 轮 · {changes}": {"en": "repair round {n} · {changes}", "ja": "修復 {n} 回目 · {changes}"}, "停在断点前（{reason}）": {"en": "stopped before a breakpoint ({reason})", "ja": "ブレークポイント手前で停止（{reason}）"}, "工作流运行": {"en": "Workflow runs", "ja": "ワークフロー実行"}, "转到…（界面、运行、项目）": {"en": "Go to… (screen, run, project)", "ja": "移動…（画面・実行・プロジェクト）"}, "没有匹配的落点": {"en": "Nothing matches", "ja": "一致する項目がありません"}, "物料": {"en": "Artifacts", "ja": "成果物"}, "这次运行产出的全部东西，一份列表。加一类产物只是多一行——不再需要在画布上给它找一块地方摆。星标只存在本地：它是你此刻在盯什么，不是这次运行的属性。": {"en": "Everything this run produced, as one list. A new kind of artefact is one more row — not another card to place on the canvas. Pins are local: they are what you are watching, not a property of the run.", "ja": "この実行が生み出したものを一覧に。新しい種類は行が増えるだけです。ピンはローカル保存です。"}, "走位": {"en": "move", "ja": "移動"}, "选中": {"en": "select", "ja": "選択"}, "批准": {"en": "approve", "ja": "承認"}, "打回": {"en": "reject", "ja": "差戻し"}, "钉住": {"en": "Pin", "ja": "ピン留め"}, "取消钉住": {"en": "Unpin", "ja": "ピン解除"}, "选一次运行…": {"en": "Pick a run…", "ja": "実行を選択…"}, "先选一次运行。": {"en": "Pick a run first.", "ja": "まず実行を選んでください。"}, "这次运行还没有产出可读的东西。": {"en": "This run has produced nothing readable yet.", "ja": "この実行にはまだ成果物がありません。"}, "接入": {"en": "Set up", "ja": "セットアップ"}, "这个项目还没有环境。先在设置里建一个。": {"en": "This project has no environment yet.", "ja": "この プロジェクトにはまだ環境がありません。"}, "地址（必填）": {"en": "Base URL (required)", "ja": "アドレス（必須）"}, "地址不能为空。": {"en": "Base URL cannot be empty.", "ja": "アドレスは必須です。"}, "它是抓登录态的唯一目标地址，也是导出的 playwright.config 里 baseURL 的唯一来源。留空不会当场报错——会在二十分钟后的一次运行里，或者客户仓库的第一次 npm test 上暴露。": {"en": "It is the only target for capturing a session and the only source of the exported playwright.config baseURL. Leaving it empty fails later, not now.", "ja": "セッション取得と書き出し設定の唯一の source です。"}, "视口（留空 = 默认 1024×720）": {"en": "Viewport (blank = the default 1024×720)", "ja": "ビューポート（空欄＝既定 1024×720）"}, "默认那个尺寸是为压小视觉模型的图定的。一部分真实界面在那个宽度下会整块不渲染（比如交易页的下单面板）——探索器不会报错，它只是看不见半个产品。图变大每次模型调用都更贵，所以这是每个被测对象自己的设置，不是全局的。": {"en": "the default size exists to keep the vision-model image small. Some real interfaces simply do not render whole panels at that width — the explorer does not error, it just cannot see half the product. A bigger image costs more on every model call, so this is per target, not global.", "ja": "既定サイズは視覚モデルの画像を小さく保つためのものです。実際の画面では、その幅でパネルごと描画されないことがあります（探索側はエラーにならず、単に見えません）。画像が大きいほど毎回のモデル呼び出しが高くつくため、対象ごとの設定にしています。"}, "随请求带上什么": {"en": "Carried with each request", "ja": "リクエストに付与するもの"}, "三张长得一模一样的表，命运完全不同。这里合成一张，多一列「去向」——没真正实现的去向标红，而不是让人事后在客户仓库里发现。": {"en": "Three identical-looking tables with different fates. Merged here with a “destination” column; the one that is not actually implemented is marked red.", "ja": "同じ見た目の 3 つの表は行き先が違います。"}, "值": {"en": "Value", "ja": "値"}, "去向": {"en": "Destination", "ja": "行き先"}, "没有配置任何请求头、变量或查询参数。": {"en": "No headers, vars or query params configured.", "ja": "ヘッダー・変数・クエリは未設定です。"}, "extraHTTPHeaders": {"en": "extraHTTPHeaders", "ja": "extraHTTPHeaders"}, ".env + CI vars": {"en": ".env + CI vars", "ja": ".env + CI vars"}, "导出后失效": {"en": "dropped on export", "ja": "書き出し後に失われる"}, "录一遍登录步骤": {"en": "Recorded login steps", "ja": "ログイン手順を記録"}, "粘贴会话（storageState）": {"en": "Pasted session (storageState)", "ja": "貼り付けたセッション"}, "API 登录": {"en": "API login", "ja": "API ログイン"}, "导出后带走": {"en": "kept on export", "ja": "書き出しに含む"}, "导出后不带走": {"en": "dropped on export", "ja": "書き出しに含まない"}, "已保存。": {"en": "Saved.", "ja": "保存しました。"}, "验证接入": {"en": "Verify access", "ja": "接続を検証"}, "先录一遍登录步骤才能验证。": {"en": "Record login steps first.", "ja": "先にログイン手順を記録してください。"}, "拿到 {c} 个 cookie · {l} 个 localStorage 键。": {"en": "Captured {c} cookies · {l} localStorage keys.", "ja": "{c} 件の cookie・{l} 件の localStorage を取得。"}, "这里**不包含密钥**——界面拿不到它的明文。请自己在 server/.env 里加一行 MIDSCENE_MODEL_API_KEY=\u003c你的密钥>。此前这段会复制出四个星号，粘贴之后每一次模型调用都 401，而 401 读起来像模型服务坏了。": {"en": "The key is **not** included — the UI never holds its plaintext. Add MIDSCENE_MODEL_API_KEY=\u003cyour key> to server/.env yourself. This block used to copy four asterisks, and pasting it made every call 401 — which reads like a broken model service.", "ja": "キーは含まれません。server/.env に自分で追加してください。"}, "复制端点与模型名（不含密钥）": {"en": "Copy endpoint and model name (no key)", "ja": "エンドポイントとモデル名をコピー（キーなし）"}, "服务端此刻在用的": {"en": "What the gateway is using now", "ja": "ゲートウェイが現在使用中"}, "端点": {"en": "Endpoint", "ja": "エンドポイント"}, "模型名": {"en": "Model", "ja": "モデル"}, "开启思考": {"en": "Thinking on", "ja": "思考モード"}, "来自 env": {"en": "from env", "ja": "env から"}, "默认值": {"en": "default", "ja": "既定値"}, "已保存，网关立刻生效。": {"en": "Saved — the gateway picked it up immediately.", "ja": "保存しました。ゲートウェイには即時反映されます。"}, "清除，回到 env": {"en": "Clear, fall back to env", "ja": "クリアして env に戻す"}, "已清除，回落到环境变量。": {"en": "Cleared — falling back to environment variables.", "ja": "クリアしました。環境変数に戻ります。"}, "还没有保存过密钥": {"en": "no key saved", "ja": "キー未保存"}, "只写不读：保存之后界面永远读不回它，也永远不会把它显示出来。留空 = 不改动已保存的那一份。": {"en": "Write-only: once saved the UI can never read it back, and never shows it. Leave empty to keep the saved one.", "ja": "書き込み専用：保存後は読み戻せません。空欄なら変更しません。"}, "这是发给端点的请求参数，端点认不认是另一回事——实测当前这个出口关不掉思考。关掉它会改变执行行为，换端点之后那些实测依据也要重新验。": {"en": "This is a request parameter; whether the endpoint honours it is another matter — the current one measurably does not. Turning it off changes execution behaviour.", "ja": "これはリクエストパラメータで、エンドポイントが従うかは別問題です。"}, "注意：执行层（runner）里 Midscene 打的是代理 {url}，不是上面这个地址。": {"en": "Note: in the runner, Midscene talks to the proxy {url}, not the address above.", "ja": "注意：runner では Midscene はプロキシ {url} に接続します。"}, "存过一把密钥，但解不开（换过机器、清过 .data、或 secret.key 被删）。请重新填一次。": {"en": "A key was saved but cannot be decrypted (new machine, cleared .data, or secret.key removed). Please enter it again.", "ja": "保存されたキーを復号できません。再入力してください。"}, "网关已经生效。{who} 是在启动那一刻拿到配置快照的，要它们也生效需要重启——**不自动重启**，因为那会中断正在跑的运行。": {"en": "The gateway picked it up. {who} snapshot the config at spawn time and need a restart — not done automatically, because it would abort a run in flight.", "ja": "ゲートウェイには反映済み。{who} は再起動が必要です（実行中のランを中断するため自動では行いません）。"}, "还没有选中项目": {"en": "No project selected", "ja": "プロジェクト未選択"}, "用例、环境、运行记录都属于某个项目。选一个或建一个，这一屏才有内容可读。": {"en": "Cases, environments and runs all belong to a project. Pick or create one and this screen will have something to show.", "ja": "ケース・環境・実行はプロジェクトに属します。選択または作成してください。"}, "{what}属于某个项目。选一个或建一个，这一屏才有内容可读。": {"en": "{what} belongs to a project. Pick or create one to see anything here.", "ja": "{what} はプロジェクトに属します。"}, "去接入": {"en": "Go to set up", "ja": "セットアップへ"}, "就绪清单": {"en": "Readiness", "ja": "準備状況"}, "已验证 {k} / 共 {n}": {"en": "{k} of {n} verified", "ja": "{n} 件中 {k} 件検証済み"}, "重新检查": {"en": "Re-check", "ja": "再チェック"}, "去配置": {"en": "Go configure", "ja": "設定へ"}, "已配未验证": {"en": "unverified", "ja": "未検証"}, "已验证": {"en": "verified", "ja": "検証済み"}, "坏了": {"en": "broken", "ja": "不具合"}, "被测对象": {"en": "System under test", "ja": "テスト対象"}, "模型": {"en": "Model", "ja": "モデル"}, "运行时": {"en": "Runtime", "ja": "ランタイム"}, "守卫白名单": {"en": "Guard allowlist", "ja": "ガード許可リスト"}, "本次上限": {"en": "Budget", "ja": "上限"}, "项目是这一切挂靠的对象：用例、环境、运行记录都属于某个项目。没有它，复核队列没有内容可读。": {"en": "Everything hangs off a project: cases, environments, runs. Without one the review queue has nothing to show.", "ja": "すべてはプロジェクトに紐づきます。"}, "地址是抓登录态的唯一目标，也是导出 playwright.config 里 baseURL 的唯一来源。它为空时不会当场报错——会在二十分钟后的一次运行里，或者客户仓库的第一次 npm test 上暴露。": {"en": "The base URL is the only target for capturing a session and the only source of the exported playwright.config baseURL. Empty, it fails twenty minutes later — or in the customer's repo.", "ja": "baseURL はセッション取得と書き出し設定の唯一の source です。"}, "「配了端点」和「它真的通」是两件事。绿色只给验证过的——一个从没验证过的端点会让一整场运行失败，而失败信息读起来像模型服务坏了。": {"en": "Configured is not verified. Green is reserved for what has actually answered.", "ja": "設定済みと検証済みは別物です。"}, "绿色只留给健康检查通过。`spawning` 不算就绪——就绪超时只写 lastError 不改状态，于是一个健康检查从没通过的服务看起来是健康的。": {"en": "Green is only for a passed health check. `spawning` is not ready — the readiness timeout writes lastError without changing state.", "ja": "緑はヘルスチェック通過のみ。"}, "白名单外不拦运行，但这个域名下命中删除 / 支付 / 结账等词的步骤会被一律拒绝。不在跑之前说出来，人会在执行报告里看到一堆没有理由的失败。": {"en": "Outside the allowlist runs still start, but steps matching delete / pay / checkout are refused — say it before the run, not in the report.", "ja": "許可リスト外では削除・支払い等の手順が拒否されます。"}, "上限是事先的决定，不是撞墙之后才发现的一堵墙。每次起跑可以单独覆盖它。": {"en": "A cap is a decision made in advance, not a wall discovered on impact. Each run can override it.", "ja": "上限は事前の決定です。実行ごとに上書きできます。"}, "调用上限": {"en": "call cap", "ja": "呼び出し上限"}, "花费上限": {"en": "cost cap", "ja": "コスト上限"}, "时长上限(秒)": {"en": "time cap (s)", "ja": "時間上限(秒)"}, "还没有选中一次运行": {"en": "No run selected", "ja": "実行が選択されていません"}, "这次运行还没有产出": {"en": "This run has produced nothing yet", "ja": "まだ成果物がありません"}, "打哪里": {"en": "Target", "ja": "対象"}, "地址": {"en": "Base URL", "ja": "アドレス"}, "地址出处": {"en": "URL from", "ja": "URL の出所"}, "这次填的一次性地址": {"en": "one-off URL for this run", "ja": "今回指定した URL"}, "环境的 baseUrl": {"en": "the environment’s baseUrl", "ja": "環境の baseUrl"}, "项目的目标地址": {"en": "the project’s target URL", "ja": "プロジェクトの対象 URL"}, "环境变量 WF_TARGET_URL": {"en": "the WF_TARGET_URL env var", "ja": "環境変数 WF_TARGET_URL"}, "这次点名要的": {"en": "named by this run", "ja": "今回指定"}, "没人选，拿的默认": {"en": "nobody chose — took the default", "ja": "未選択のためデフォルト"}, "没有环境": {"en": "no environment", "ja": "環境なし"}, "登录态": {"en": "login", "ja": "ログイン"}, "带了": {"en": "carried", "ja": "あり"}, "没带": {"en": "none", "ja": "なし"}, "图": {"en": "Graph", "ja": "グラフ"}, "读了什么": {"en": "Materials read", "ja": "読んだ資料"}, "（图上写死的那份）": {"en": "(whatever the graph pins)", "ja": "（グラフに固定されたもの）"}, "消融": {"en": "Ablated", "ja": "アブレーション"}, "提示词": {"en": "Prompts", "ja": "プロンプト"}, "{node} 这一步读的是图上写死的 {said}，项目挂的材料这次没被读。": {"en": "{node} read {said} pinned on the graph — the project's own materials were not read.", "ja": "{node} はグラフに固定された {said} を読みました。プロジェクトの資料は読まれていません。"}, "审计": {"en": "Audit", "ja": "監査"}, "项目设置": {"en": "Project", "ja": "プロジェクト"}, "素材与质量": {"en": "Material & quality", "ja": "素材と品質"}, "校准": {"en": "Calibrate", "ja": "校正"}, "审计报告": {"en": "Scan report", "ja": "監査レポート"}, "变化": {"en": "Changes", "ja": "差分"}, "30 条分层抽样，一半留出。人标的这几条是 judge 的锚，不是这一批的验收": {"en": "a stratified sample of 30, half held out — these anchor the judge, they are not this batch's sign-off", "ja": "層化抽出 30 件（半分はホールドアウト）。judge の基準点であり、このバッチの承認ではありません"}, "Scanner 自己觉得可疑的那些。没被标出来的默认放行——人不是评分员": {"en": "what the scanner itself flagged; anything unflagged passes by default — a person is not a grader", "ja": "スキャナが疑わしいと判断したもの。未指摘は既定で通過——人は採点者ではありません"}, "相对上次批准集的差：新增 function localizeUI(root=document){

<script id="run-bench-script">
/* Run-scoped workflow review and deterministic, local-only breakpoint simulation. */
function benchRun(){return R.benchRunId?workflowRecords().find(r=>r.id===R.benchRunId):null;}
function benchNodeState(run,id){return run?.nodeStates?.[id]||{status:run?'skipped':'pending',attempted:false};}
function benchStateLabel(status){return ({pending:'未执行',running:'执行中',done:'已完成',paused:'已暂停',failed:'失败',skipped:'不在本次范围'})[status]||'未记录';}
function benchRunLabel(run){return run.kind==='archive'?'归档完成':({ready:'待启动',running:'模拟执行中',paused:'模拟已暂停',failed:'模拟失败',completed:'模拟完成'})[run.status]||'仅模拟范围';}
function canSetBenchBreakpoint(run,id){
  const graph=run?.graph||graphSnapshot(),state=benchNodeState(run,id);
  return graph.nodes.some(n=>n.id===id)&&(!run||run.kind==='simulation'&&run.status!=='completed'&&run.nodes.includes(id))&&!state.attempted&&['pending','paused'].includes(state.status);
}
function toggleBenchBreakpoint(id){
  const run=benchRun();if(R.benchRunId&&!run)return false;
  if(!canSetBenchBreakpoint(run,id)){toast('只能在本次 run 尚未执行的节点设置断点');return false;}
  if(run){const points=new Set(run.breakpoints);points.has(id)?points.delete(id):points.add(id);run.breakpoints=[...points];run.events.push({type:'breakpoint.changed',node:id,enabled:points.has(id),at:new Date().toISOString()});}
  else S.bp.has(id)?S.bp.delete(id):S.bp.add(id);
  render();return true;
}
function selectBenchRun(id){
  if(id&&!workflowRecords().some(r=>r.id===id)){toast('这条运行记录不属于当前项目或已不可用');return;}
  if(id){const selected=workflowRecords().find(r=>r.id===id);R.module=selected.scope?.module||null;R.story=selected.scope?.story||null;R.productNode=selected.scope?.productNode||null;}
  closeSheet(false);R.benchRunId=id||null;R.runId=id||null;R.runTab='nodes';R.caseId=null;S.ctx=null;S.view='ws';R.workView='workflow';render();
}
function prepareBenchRun(){S.bp.clear();R.productNode=null;selectBenchRun(null);}
function initializeBenchAttempt(attempt){
  attempt.status='ready';attempt.breakpoints=[...S.bp].filter(id=>attempt.nodes.includes(id));
  attempt.nodeStates=Object.fromEntries(attempt.graph.nodes.map(n=>[n.id,{status:attempt.nodes.includes(n.id)?'pending':'skipped',attempted:false}]));
  attempt.artifacts=[];attempt.events=[{type:'run.created',at:attempt.createdAt}];attempt.pauseNode=null;attempt.pauseReason=null;
  return attempt;
}
function benchEvent(run,type,node){run.events.push({type,node,at:new Date().toISOString()});}
function simulateNodeArtifact(run,node){
  const contract=KINDS[node.type]?.out||'node.result',id=run.id+'/'+node.id+'/output';
  if(run.artifacts.some(a=>a.id===id))return;
  run.artifacts.push({id,runId:run.id,nodeId:node.id,version:run.graph.version,kind:'simulation',name:(NODE_NAMES[node.type]||node.id)+' · 模拟物料',count:'1 份占位',
    payload:{simulation:true,runId:run.id,nodeId:node.id,workflowVersion:run.graph.version,outputContract:contract,scope:copy(run.scope),params:copy(node.params||{}),note:'仅用于演示产物关联与暂停续跑，未生成真实故事、用例、代码或执行证据。'}});enrichSimulatedArtifact(run,node,run.artifacts.at(-1));
}
function executeBenchRun(id){
  const run=workflowRecords().find(r=>r.id===id);if(!run||run.kind!=='simulation'||!['ready','paused','failed'].includes(run.status))return false;
  const resuming=run.status==='paused'||run.status==='failed',resumeNode=resuming?run.pauseNode:null;
  run.status='running';benchEvent(run,resuming?'run.resumed':'run.started',resumeNode);run.pauseNode=null;run.pauseReason=null;
  for(const id of run.nodes){
    const state=run.nodeStates[id],node=run.graph.nodes.find(n=>n.id===id);if(state.status==='done')continue;
    if(run.breakpoints.includes(id)&&id!==resumeNode&&!state.attempted){state.status='paused';run.status='paused';run.pauseNode=id;run.pauseReason='breakpoint';benchEvent(run,'run.paused.before',id);break;}
    state.status='running';state.attempted=true;state.attempts=(state.attempts||0)+1;delete state.error;benchEvent(run,'node.started',id);
    try{simulateNodeArtifact(run,node);state.status='done';state.completedAt=new Date().toISOString();benchEvent(run,'node.completed',id);}
    catch(error){state.status='failed';state.error=String(error.message||error);run.status='failed';run.pauseNode=id;run.pauseReason='error';benchEvent(run,'node.failed',id);run.events.at(-1).error=state.error;break;}
  }
  if(run.status==='running'){run.status='completed';run.completedAt=new Date().toISOString();benchEvent(run,'run.completed');}
  selectBenchRun(run.id);return true;
}
function openBenchRunPicker(){
  if(S.view!=='ws'||R.workView!=='workflow'){S.view='ws';R.workView='workflow';R.caseId=null;render();}
  sheet('选择运行记录',b=>{
    const search=el('input');search.type='search';search.placeholder='搜索运行 ID、节点或入口';search.setAttribute('aria-label','搜索工作流记录');search.value=R.runQuery;
    const kind=el('select');kind.setAttribute('aria-label','工作流记录来源');[['all','全部记录'],['simulation','本次模拟'],['archive','归档样例']].forEach(([v,l])=>kind.append(new Option(l,v)));kind.value=R.runKind;
    const filters=el('div','record-filters'),list=el('div','record-list');filters.append(search,kind);b.append(filters,list);

      if(!records.length){list.append(empty('尚无匹配的运行记录','可调整筛选，或新建 run。'));return;}
      list.append(table(['运行','版本 / 范围','状态','产物'],records.map(r=>[button(r.id,()=>selectBenchRun(r.id)), 'v'+r.graph.version+' · '+runModeLabel(r.mode),benchRunLabel(r),(r.artifacts||[]).length+' 份'+(r.kind==='simulation'?'模拟物料':'归档物料')])));localizeUI(list);};
    search.oninput=()=>{R.runQuery=search.value;draw();};kind.onchange=()=>{R.runKind=kind.value;draw();};draw();
    b.append(el('p','records-note','选择记录后，工作台展示该 run 的节点与物料。模拟 run 仅保留在当前页面会话。'),button('新建 run',prepareBenchRun,''));
  });
}
function benchRunSelector(){
  const select=el('select','bench-run-selector');select.id='bench-run-selector';select.setAttribute('aria-label','当前运行记录');select.append(new Option(tShell('待启动的新 run'),'new'));
  for(const run of workflowRecords())select.append(new Option(run.id+' · '+tShell(benchRunLabel(run))+' · v'+run.graph.version,run.id));
  if(R.benchRunId&&!benchRun()){const missing=new Option(tShell('运行记录不可用'),'missing');select.append(missing);select.value='missing';}else select.value=R.benchRunId||'new';
  select.onchange=()=>select.value==='new'?prepareBenchRun():selectBenchRun(select.value);return select;

function openBenchArtifact(run,artifact){if(run.project!==R.project||!run.artifacts.some(a=>a.id===artifact.id))return;sheet(artifact.name+' · '+run.id,b=>b.append(artifactContent(run,artifact)));}
function openBenchNode(run,id){
  const node=run.graph.nodes.find(n=>n.id===id),state=benchNodeState(run,id);if(!node)return;
  sheet((NODE_NAMES[node.type]||id)+' · '+run.id,b=>{
    b.append(row(pill(benchStateLabel(state.status)),pill('执行版本 v'+run.graph.version)),el('p',null,id+' · '+node.type));
    if(run.kind==='archive'){const stats=run.nodes.find(n=>n.id===id);b.append(el('p','records-note',fmtMs(stats.ms)+' · '+stats.calls+' calls · '+stats.tokens+' tokens'));}
    const bp=button(run.breakpoints.includes(id)?'取消断点':'设置断点',()=>{toggleBenchBreakpoint(id);openBenchNode(run,id);},'');bp.disabled=!canSetBenchBreakpoint(run,id);bp.title=bp.disabled?'已执行的节点不能添加断点':'在该节点开始之前暂停';b.append(bp);
    if(state.status==='paused')b.append(note(run.pauseReason==='breakpoint'?'停在此节点之前，节点尚未执行。继续时从此节点开始。':'此节点执行中断，可继续此 run。'));
    if(state.error)b.append(note(state.error));if(node.context)b.append(disclosure('本次 Role / Skill 与知识',renderContextSummary(node.context)));
    const items=run.artifacts.filter(a=>a.nodeId===id);b.append(detailSection('本次节点物料',items.length?row(...items.map(a=>button(a.name,()=>openBenchArtifact(run,a)))):note(run.kind==='archive'?'此归档未嵌入该节点的物料。':'该节点在此 run 中尚无产物。')));
    b.append(disclosure('冻结参数与运行信息',el('pre',null,JSON.stringify(node,null,2)),note(run.kind==='archive'?'未记录的历史参数保持为空。':'此 run 沿用创建时的定义，后续修改工作副本不会改变它。')));
  });

function productMergePlan(base,candidates,decisions={}){
  const result=copy(base),conflicts=[],changes=[];const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b),uniq=items=>[...new Map(items.map(x=>[JSON.stringify(x),x])).values()];
  for(const candidate of candidates){if(candidate.project!==base.project)throw Error('不能融合其他项目物料');
    for(const collection of ['nodes','stories'])for(const incoming of candidate[collection]){const old=result[collection].find(x=>x.id===incoming.id);if(!old){result[collection].push(copy(incoming));changes.push({type:'add',collection,id:incoming.id});continue;}
      for(const field of collection==='nodes'?['parentId','kind','name']:['title','text','primaryModuleId'])if(!same(old[field],incoming[field])){const key=candidate.id+':'+collection+':'+incoming.id+':'+field,choice=decisions[key];conflicts.push({key,collection,id:incoming.id,field,before:old[field],after:incoming[field],resolved:choice==='current'||choice==='incoming'});if(choice==='incoming')old[field]=copy(incoming[field]);}
      if(collection==='stories'){old.provenance=uniq([...(old.provenance||[]),...(incoming.provenance||[])]);old.relatedModuleIds=uniq([...(old.relatedModuleIds||[]),...(incoming.relatedModuleIds||[])]);old.featureIds=uniq([...old.featureIds,...incoming.featureIds]);}
    }
    result.provenance=uniq([...(result.provenance||[]),...(candidate.provenance||[])]);
  }
  const ids=new Set(result.nodes.map(n=>n.id));for(const n of result.nodes){if(n.parentId&&!ids.has(n.parentId))throw Error('模块缺少父节点：'+n.id);const visited=new Set([n.id]);let p=n.parentId;while(p){if(visited.has(p))throw Error('模块层级存在环');visited.add(p);p=result.nodes.find(x=>x.id===p)?.parentId;}}
  for(const s of result.stories)if(!ids.has(s.primaryModuleId)||s.featureIds.some(id=>!ids.has(id))||(s.relatedModuleIds||[]).some(id=>!ids.has(id)))throw Error('故事存在无效模块或功能关联：'+s.id);
  return {result,conflicts,changes,unresolved:conflicts.filter(c=>!c.resolved).length};
}

    const draw=()=>{preview.replaceChildren();try{plan=productMergePlan(projectProductModel(),candidates.filter(c=>selected.has(c.model.id)).map(c=>c.model),decisions);status.textContent=selected.size+' 份候选 · '+plan.changes.length+' 项新增 · '+plan.conflicts.length+' 项冲突 · '+plan.unresolved+' 项待决定';preview.append(table(['对象 / 字段','当前版本','候选值','处理'],plan.conflicts.map(c=>{const pick=el('select');pick.setAttribute('aria-label','融合决策 '+c.key);[['','请选择'],['current','保留当前'],['incoming','采用候选']].forEach(([v,l])=>pick.append(new Option(l,v)));pick.value=decisions[c.key]||'';pick.onchange=()=>{decisions[c.key]=pick.value;draw();};return[c.id+' / '+c.field,c.before,c.after,pick];})));save.disabled=!selected.size||!!plan.unresolved;}catch(e){plan=null;status.textContent=e.message;save.disabled=true;}};

diffVersions=function(a,b){
  const left=R.graphSnapshots.get(a),right=R.graphSnapshots.get(b);if(!left||!right)return BASE_UI.diffVersions(a,b);
  if(a===b)return ['两个版本相同'];const changes=[];
  for(const n of left.nodes){const other=right.nodes.find(x=>x.id===n.id);if(!other)changes.push('- 节点 '+n.id);else for(const key of ['type','params','skill','skillVersion'])if(JSON.stringify(n[key])!==JSON.stringify(other[key]))changes.push('~ '+n.id+'.'+key+': '+JSON.stringify(n[key])+' → '+JSON.stringify(other[key]));}
  for(const n of right.nodes)if(!left.nodes.some(x=>x.id===n.id))changes.push('+ 节点 '+n.id);
  const wire=e=>e.from+' → '+e.to;left.edges.forEach(e=>{if(!right.edges.some(x=>wire(x)===wire(e)))changes.push('- 连线 '+wire(e));});right.edges.forEach(e=>{if(!left.edges.some(x=>wire(x)===wire(e)))changes.push('+ 连线 '+wire(e));});
  return changes.length?changes:['节点与连线定义相同；检查模型配置版本与运行设置。'];
};

function graphErrors() {
  const errors=[], ids=new Set(RUN.nodes.map(n=>n.id));
  for(const n of RUN.nodes){const kind=KINDS[n.type];if(!kind){errors.push(n.id+' 类型未知');continue;}if(kind.in!==null&&!EDGES.some(e=>e.to===n.id))errors.push(n.id+' 缺少上游连线');}
  for(const e of EDGES){const a=RUN.nodes.find(n=>n.id===e.from),b=RUN.nodes.find(n=>n.id===e.to);if(!a||!b)errors.push('存在悬空连线');else if(KINDS[a.type]?.out!==KINDS[b.type]?.in)errors.push(e.from+' → '+e.to+' 输入输出不兼容');}
  const visit=(id,path=new Set())=>{if(path.has(id)){errors.push('检测到环：'+id);return;}const next=new Set(path).add(id);EDGES.filter(e=>e.from===id&&ids.has(e.to)).forEach(e=>visit(e.to,next));};RUN.nodes.forEach(n=>visit(n.id));
  return [...new Set(errors)];
}
function scopePlan(mode,chosen, reuse=true) {
  let ids=new Set(mode==='full'?RUN.nodes.map(n=>n.id):chosen);
  if(mode==='from'){const expand=id=>EDGES.filter(e=>e.from===id).forEach(e=>{if(!ids.has(e.to)){ids.add(e.to);expand(e.to);}});[...ids].forEach(expand);}
  const errors=graphErrors(), reused=[];
  if(!ids.size)errors.push('请选择至少一个节点');
  for(const id of ids)if(!RUN.nodes.some(n=>n.id===id))errors.push('节点不存在：'+id);
  EDGES.filter(e=>ids.has(e.to)&&!ids.has(e.from)).forEach(e=>{
    const frozen=R.frozen.get(e.from), upstream=RUN.nodes.find(n=>n.id===e.from);
    if(!reuse||!frozen||frozen.revision!==R.graphVersion||frozen.type!==KINDS[upstream?.type]?.out)errors.push(e.to+' 缺少匹配当前版本的 '+e.from+' 输入');
    else reused.push(e.from+' → '+e.to+' · v'+frozen.revision);
  });
  const ordered=[], remaining=new Set(ids);
  while(remaining.size){const ready=[...remaining].find(id=>!EDGES.some(e=>e.to===id&&remaining.has(e.from)));if(!ready){errors.push('所选节点不能拓扑排序');break;}ordered.push(ready);remaining.delete(ready);}
  return {mode,nodes:ordered,reused,errors:[...new Set(errors)]};
}

}
