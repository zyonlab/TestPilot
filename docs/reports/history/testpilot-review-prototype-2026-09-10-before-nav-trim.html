rom a screenshot: slow, and a re-run can disagree with itself", "ja": "少なくとも一つの検証はモデルが画面から判定：低速で、再実行時に結論が変わりうる"}, "重试过——一次要靠重试才绿的通过，值得少信一点": {"en": "it was retried — a pass that needed a retry is worth less than one that did not", "ja": "リトライあり——再試行で初めて成功した合格は、その分だけ信頼度が下がります"}, "这次运行没有留下截图": {"en": "this run left no screenshots", "ja": "この実行はスクリーンショットを残していない"}, "这条执行记录里没有截图。它多半跑在「工作流执行把截图路径记下来」这个改动之前——那之前执行器虽然落了盘，产物类型里却没有承载它的字段，记录时只能存一个空数组。重跑一次就有了": {"en": "this execution has no screenshots. It most likely ran before workflow executions started recording screenshot paths — until then the executor wrote them to disk but the outcome type had no field to carry them. Re-run the case and they will be there", "ja": "この実行にスクリーンショットはありません。ワークフロー実行がパスを記録するようになる前の実行と思われます——それ以前は実行器が保存しても成果物の型に該当フィールドがなく、空配列として記録されていました。再実行すれば取得されます"}, "返回列表": {"en": "back to list", "ja": "一覧に戻る"}, "搜用例名 / 失败原因…": {"en": "search case or failure…", "ja": "ケース名・失敗理由を検索…"}, "{n} 轮": {"en": "{n} rounds", "ja": "{n} 回"}, "第 {n} 轮": {"en": "attempt {n}", "ja": "第 {n} 回"}, "同一条用例跑了多次——多半是修复循环改完之后又跑了一遍。主行是最终结论，展开看每一轮": {"en": "the same case ran more than once — usually the repair loop re-running it after a fix. The top row is the final verdict; expand for each attempt", "ja": "同一ケースが複数回実行——多くは修復ループによる再実行。上段が最終結論、展開で各回を表示"}, "程序判定": {"en": "settled by a program", "ja": "プログラム判定"}, "模型看截图判定": {"en": "judged from a screenshot", "ja": "モデルが画面から判定"}, "判定硬度": {"en": "oracle tier", "ja": "判定強度"}, "设计方法": {"en": "design method", "ja": "設計手法"}, "故事": {"en": "stories", "ja": "ストーリー"}, "门禁分": {"en": "gate score", "ja": "ゲート点"}, "只看已退化": {"en": "degraded only", "ja": "劣化のみ"}, "清除筛选": {"en": "clear", "ja": "クリア"}, "断言被改松过": {"en": "assertion was weakened", "ja": "アサーションが緩められた"}, "这条的判据程序能判——执行时不问模型": {"en": "a program settles this one — no model is asked at run time", "ja": "プログラムが判定（実行時にモデル不要）"}, "只是标了 tier，没有机器可判的判据——执行时仍由模型看截图决定": {"en": "the tier is only a label: with no machine-checkable oracle a model still decides at run time", "ja": "tier はラベルのみ。機械判定の判拠がないため実行時はモデルが判断"}, "点一下回到默认网关（localhost:5301）": {"en": "click to go back to the default gateway (localhost:5301)", "ja": "クリックで既定のゲートウェイ（localhost:5301）に戻る"}, "执行轨迹": {"en": "Trace", "ja": "実行トレース"}, "这个项目还没有用例": {"en": "No cases in this project yet", "ja": "このプロジェクトにはまだケースがありません"}, "去复核队列": {"en": "open the review queue", "ja": "レビューキューへ"}, "去运行列表跑一次": {"en": "Start a run", "ja": "実行を開始"}, "这次运行没有产出故事——它可能停在了规格这一步。": {"en": "This run produced no stories — it may have stopped at the specification step.", "ja": "この実行はストーリーを生成していません——仕様の段で止まった可能性があります。"}, "{n} 条没有验收标准": {"en": "{n} without acceptance criteria", "ja": "{n} 件に受入基準なし"}, "没有验收标准——下游用例的断言就没有可以对上的东西": {"en": "no acceptance criteria — a case written from this has nothing to write its assertion against", "ja": "受入基準がありません——ここから書くケースは検証の根拠を持てません"}, "出处未知": {"en": "source unknown", "ja": "出典不明"}, "定位出来的：这条故事的验收标准，在这份材料里逐字查得到。": {"en": "Located: this story's acceptance criteria are found verbatim in that document.", "ja": "特定済み：この受入基準は該当資料に逐語的に存在します。"}, "模型声称的：只核对过这份文档确实参与了这次运行，没能在里面查到这条故事的原话。": {"en": "Claimed by the model: the document was part of this run, but the story's wording was not found in it.", "ja": "モデルの主張：この資料は実行に含まれていますが、記述自体は見つかりませんでした。"}, "定位不到，模型也没给出可信的说法——这条故事在「每份材料都覆盖到了吗」里不算进任何一份。": {"en": "Neither located nor credibly claimed — this story counts towards no document's coverage.", "ja": "特定も主張もできません——このストーリーはどの資料のカバレッジにも数えられません。"}, "规格材料": {"en": "Requirements", "ja": "仕様資料"}, "已作为 source.spec 输入": {"en": "used as source.spec input", "ja": "source.spec の入力として使用"}, "这次运行没有留下规格材料——它可能是从探索开始的，或者产物已过保留期。": {"en": "This run captured no specification — it may have started from exploration, or its products have been retained out.", "ja": "この実行には仕様資料がありません——探索から始まったか、成果物が保持期間を過ぎています。"}, "这里是那次运行真正拿到的文本，不是磁盘上现在的文件。文件后来改过是常有的事，而运行是拿当时那份跑的——拿今天的文件解释昨天的产物，正是追溯最容易骗人的地方。": {"en": "This is the text that run actually received, not today's file on disk. Files change; the run used the version it was given, and explaining yesterday's output with today's file is where traceability most easily lies.", "ja": "これは実行が実際に受け取ったテキストであり、現在のディスク上のファイルではありません。ファイルは変わりますが、実行は当時の版で走りました——今日のファイルで昨日の成果を説明することこそ、トレースが最も欺きやすい点です。"}, "量的是这一版 harness 自己，不是被测产品": {"en": "measures this version of the harness itself, not the product under test", "ja": "評価対象はこのバージョンの harness 自身であり、テスト対象製品ではありません"}, "流水线本身：它有版本，改参数或改拓扑保存都会立一版新的": {"en": "the pipeline itself: it is versioned, and saving a parameter or a rewiring makes a new version", "ja": "パイプライン本体：版管理され、パラメータや配線を保存するたびに新しい版になります"}, "拖动": {"en": "Pan", "ja": "移動"}, "拖动画布看图。默认是它——看图的次数远多于改图": {"en": "drag to move the canvas. The default, because looking at the pipeline happens far more often than changing it", "ja": "ドラッグでキャンバスを移動。既定値です——図を見る回数の方が編集より遥かに多いため"}, "框选": {"en": "Select", "ja": "選択"}, "拖出一个框选中若干步。一个手势只能有一种含义，所以选它的时候画布不跟着走": {"en": "drag a box to select steps. One gesture can only mean one thing, so the canvas stays put while this is on", "ja": "ドラッグで矩形選択。一つの操作に意味は一つ——選択中はキャンバスは動きません"}, "选中了 {n} 步": {"en": "{n} steps selected", "ja": "{n} 段を選択"}, "可以一起做的": {"en": "can be done to all of them", "ja": "まとめてできること"}, "都设断点": {"en": "Break on all", "ja": "全てにブレーク"}, "都清掉": {"en": "Clear all", "ja": "全て解除"}, "只能对一步做的": {"en": "one step at a time", "ja": "一段ずつしかできないこと"}, "打开 {node}": {"en": "Open {node}", "ja": "{node} を開く"}, "只重跑这一步，用它上游已有的产物作输入——改完参数验证一下，不必从头再来": {"en": "re-run just this step against the output its upstream already produced — check a parameter change without starting over", "ja": "この段だけ再実行（上流の既存成果を入力に）——パラメータ変更の確認に、最初からやり直す必要はありません"}, "从这一步开始，把后面的都重跑一遍": {"en": "start here and re-run everything downstream", "ja": "この段から下流をすべて再実行"}, "{node} 还没有产出，这一步重跑不了——先跑 {node}": {"en": "{node} has no output yet, so this step cannot rerun — run {node} first", "ja": "{node} の出力がないため再実行できません — 先に {node} を実行"}, "已完成 {done} 步，从 {from} 接上": {"en": "{done} steps done — resume at {from}", "ja": "{done} ステップ完了 — {from} から再開"}, "接着跑": {"en": "Resume", "ja": "再開"}, "读的是图上写死的材料，不是项目挂的": {"en": "reads the graph’s pinned material, not the project’s", "ja": "プロジェクトの資料ではなくグラフ固定の資料を読みます"}, "图上的 source.spec 自己写着 {said}——项目挂的文档这次不会被读到。想用项目材料，把节点上的路径清掉。": {"en": "the graph’s source.spec says {said}, so the project’s documents will not be read this run. Clear the node’s path to use them.", "ja": "グラフの source.spec に {said} と書かれているため、プロジェクトの資料は読まれません。ノードのパスを消してください。"}, "让运行停在这一步之前——停下来正是最想看已经产出了什么的时候": {"en": "stop the run before this step — stopping is when you most want to see what has been produced so far", "ja": "この段の手前で実行を止める——止まった時こそ、そこまでの成果を見たい時です"}, "设断点": {"en": "Break here", "ja": "ブレーク設定"}, "清断点": {"en": "Clear break", "ja": "ブレーク解除"}, "先跑一次，才有产物可以接着改": {"en": "run once first — there is no output yet to re-run against", "ja": "まず一度実行してください——続きから走らせる成果がまだありません"}, "接着跑 {graph}": {"en": "Continue into {graph}", "ja": "{graph} へ続行"}, "把这次运行 {from} 的产物喂给 {into}，起一次新运行——阶段一与阶段二是两张图，各自迭代、各自评测": {"en": "feed this run's {from} output into {into} as a new run — stage one and stage two are separate graphs so each can be iterated and evaluated on its own", "ja": "この実行の {from} の成果を {into} に渡して新しい実行を開始します——第一段と第二段は別グラフで、各々独立に反復・評価できます"}, "未绑定项目": {"en": "no project", "ja": "プロジェクト未紐付"}, "带覆盖": {"en": "overridden", "ja": "上書きあり"}, "关了 {list}": {"en": "{list} off", "ja": "{list} 無効"}, "一次执行：产物（规格、故事、用例、门禁结果）都属于它，不属于图也不属于项目": {"en": "one execution: its products — material, stories, cases, gate results — belong to it, not to the graph or the project", "ja": "一回の実行：成果物（資料・ストーリー・ケース・ゲート結果）はこれに属し、グラフやプロジェクトには属しません"}, "产物挂在项目下面：用例、运行、基线都属于它": {"en": "artefacts hang off the project: cases, runs and baselines all belong to it", "ja": "成果物はプロジェクトに属します：ケース・実行・ベースラインすべて"}, "这一步的提示词该怎么改": {"en": "how should this step's prompt change", "ja": "このステップのプロンプトをどう直すべきか"}, "这一步为什么这么慢": {"en": "why is this step so slow", "ja": "なぜこのステップは遅いのか"}, "它产出的东西哪里不对": {"en": "what is wrong with what it produced", "ja": "生成物のどこが問題か"}, "门禁给的分，具体是被哪几条用例拖下来的": {"en": "which cases actually pulled the gate's score down", "ja": "ゲートのスコアを実際に下げたのはどのケースか"}, "为什么它停在这里": {"en": "why did it stop here", "ja": "なぜここで止まったのか"}, "下一步该改什么": {"en": "what should change next", "ja": "次に何を変えるべきか"}, "harness 运行时": {"en": "Harness runtime", "ja": "harness ランタイム"}, "机器正在对这次运行做什么": {"en": "what the machinery is doing to this run", "ja": "この実行に機構が何をしているか"}, "事件流已连接": {"en": "event stream connected", "ja": "イベントストリーム接続中"}, "事件流连接中…": {"en": "connecting to event stream…", "ja": "イベントストリーム接続中…"}, "事件流已断开,正在重连…": {"en": "event stream offline, reconnecting…", "ja": "イベントストリーム切断、再接続中…"}, "展开": {"en": "Expand", "ja": "展開"}, "模型闸": {"en": "Model gate", "ja": "モデルゲート"}, "模型调用全局串行：并发只会让本地模型更慢，还会让每一步的耗时失去意义": {"en": "Model calls are globally serial: concurrency only slows the local model and makes per-step timings meaningless", "ja": "モデル呼び出しは全体で直列：並行はローカルモデルを遅くし、各ステップの所要時間の意味を失わせる"}, "预算 · calls": {"en": "Budget · calls", "ja": "予算 · calls"}, "预算 · tokens": {"en": "Budget · tokens", "ja": "予算 · tokens"}, "预算 · 时长": {"en": "Budget · time", "ja": "予算 · 時間"}, "消融开关": {"en": "Ablation", "ja": "アブレーション"}, "全开": {"en": "all on", "ja": "全て有効"}, "关掉任一组件跑一遍，用来证明这个组件有没有用": {"en": "Switch one component off and run again — that is how a component proves it earns its place", "ja": "任意の構成要素を切って再実行し、その要素が効いているかを示す"}, "停在上限上": {"en": "stopped at its cap", "ja": "上限で停止"}, "这次运行的上限": {"en": "This run's cap", "ja": "この実行の上限"}, "调用次数": {"en": "calls", "ja": "呼び出し回数"}, "金额": {"en": "spend", "ja": "金額"}, "时间": {"en": "When", "ja": "日時"}, "到顶了": {"en": "reached", "ja": "到達"}, "上限是硬的：撞上了就停，续跑也不会把它撤掉。所以要继续，得先明确地改上限或撤掉它——让「继续」顺手把上限提上去，等于让上限在最容易被忽略的那一刻失效。": {"en": "The cap is hard: reaching it stops the run, and resuming does not quietly lift it. To continue you must change or clear it deliberately — letting a Continue button raise the cap is letting the cap fail at exactly the moment it matters.", "ja": "上限は厳格です：到達すれば停止し、再開しても解除されません。続けるには上限を明示的に変更または解除してください——「続行」が上限を引き上げるなら、最も重要な瞬間に上限は機能しません。"}, "已经跑出来的产物都还在：改完上限之后是从停住的那一步接着往下走，不是从头再来。花费也接着算——它是整次运行的上限，不是每续一次给一份。": {"en": "Everything already produced is kept: after changing the cap the run continues from where it stopped, not from the beginning. Spend carries over too — the cap is for the whole run, not one per resume.", "ja": "既存の成果物は保持されます：上限変更後は停止地点から続行し、最初からではありません。消費も引き継がれます——上限は実行全体に対するもので、再開ごとではありません。"}, "不限": {"en": "none", "ja": "無制限"}, "留空表示这一项不限。三项各自独立，任意一项到顶都会停。": {"en": "Leave blank for no cap on that item. The three are independent; reaching any one stops the run.", "ja": "空欄はその項目の無制限を意味します。三項目は独立し、いずれかに到達すると停止します。"}, "改上限并继续": {"en": "Change cap and continue", "ja": "上限を変更して続行"}, "撤掉上限并继续": {"en": "Clear cap and continue", "ja": "上限を解除して続行"}, "撤掉上限是一个正当的选择——但它要被说成「撤掉」，不能伪装成「继续」。": {"en": "Clearing the cap is a legitimate choice — but it has to be called clearing, not disguised as continuing.", "ja": "上限の解除は正当な選択です——ただし「続行」に偽装せず「解除」と呼ぶ必要があります。"}, "读哪几份材料": {"en": "Which material to read", "ja": "読み込む資料"}, "已选 {n} 份": {"en": "{n} chosen", "ja": "{n} 件選択"}, "不在列表里": {"en": "not listed", "ja": "一覧にありません"}, "多份文档会按勾选顺序拼在一起，每份保留自己的文件名。先读到的那份会主导拆出来的故事——预算不够时，它拿走的份额最大。": {"en": "Several documents are concatenated in the order you tick them, each keeping its own filename. The first one read dominates the stories that come out — when the budget is tight it takes the largest share.", "ja": "複数資料は選択順に連結され、各々のファイル名を保持します。先に読まれた資料が抽出されるストーリーを支配し、予算が逼迫すると最大の割合を占めます。"}, "最贵的一步": {"en": "priciest step", "ja": "最も高コストな段"}, "这次运行里花掉 token 最多的那一步。和最慢的一步常常不是同一个：一次视觉判断耗时八九十秒，token 却很少。": {"en": "The step that spent the most tokens in this run. Often not the slowest one — a single visual judgement takes eighty seconds and few tokens.", "ja": "この実行で最もトークンを消費した段。最も遅い段とは一致しないことが多く、視覚判断は 80 秒かかってもトークンは少数です。"}, "最慢的一步": {"en": "slowest step", "ja": "最も遅い段"}, "耗时最久的那一步。只在它和最贵的一步不是同一个时才显示——两者相同时说两遍没有意义。": {"en": "The step that took longest. Shown only when it differs from the priciest — saying the same thing twice adds nothing.", "ja": "最も時間がかかった段。最も高コストな段と異なる場合のみ表示します。"}, "提示词指纹": {"en": "Prompt digest", "ja": "プロンプト指紋"}, "改任意一条提示词它就会变；配对评测据此判断两臂是否可比": {"en": "Any prompt edit changes it; a paired evaluation uses it to tell whether two arms are comparable", "ja": "プロンプトを一つでも変えると変化する；ペア評価はこれで二つの群が比較可能かを判断する"}, "失败归因": {"en": "Failure attribution", "ja": "失敗の帰属"}, "infra 是环境问题，不计入产品缺陷": {"en": "infra means the environment broke, and does not count as a product defect", "ja": "infra は環境の問題であり、製品欠陥には数えない"}, "判定来源": {"en": "Decided by", "ja": "判定元"}, "machine 是程序判的，judge 是模型看截图判的；全靠 judge 说明 tier1 的标签没有兑现": {"en": "machine means a program settled it, judge means the model read a screenshot; all-judge means the tier-1 label was not honoured", "ja": "machine はプログラムが判定、judge はモデルが画面を見て判定。全て judge なら tier1 の主張は果たされていない"}, "全部": {"en": "All", "ja": "すべて"}, "模型调用": {"en": "Model calls", "ja": "モデル呼出"}, "节点": {"en": "nodes", "ja": "ノード"}, "门禁": {"en": "gate", "ja": "ゲート"}, "这次运行还没有留下轨迹": {"en": "this run has left no trace yet", "ja": "まだトレースがありません"}, "▾ 收起": {"en": "▾ collapse", "ja": "▾ 折りたたむ"}, "诊断": {"en": "diagnose", "ja": "診断"}, "问一个需要同时读规格、故事、用例和 finding 才能回答的问题。已经在界面上显示的数字不必问。": {"en": "Ask something that needs the spec, the stories, the cases and the findings read together. Anything the interface already shows is not worth asking.", "ja": "仕様・ストーリー・ケース・指摘を横断しないと答えられない問いに使います。画面に出ている数値を尋ねる必要はありません。"}, "只回答，不改动，也不启动运行。跑什么、什么时候跑，由画布上的按钮决定——一句话不是启动一条二十分钟流水线的可重复方式，而每次启动方式都不同的流水线没法和自己比较。": {"en": "It answers; it changes nothing and starts nothing. What runs and when is decided by the buttons on the canvas — a sentence is not a repeatable way to launch a twenty-minute pipeline, and a pipeline that starts differently each time cannot be compared with itself.", "ja": "答えるだけで、変更も実行もしません。何をいつ実行するかはキャンバスのボタンが決めます——一文は 20 分のパイプラインを再現可能に起動する手段ではなく、毎回起動が異なるパイプラインは自分自身と比較できません。"}, "问一个关于眼前这个东西的问题。可以追问——上文会带着。": {"en": "Ask about the thing in front of you. Follow-ups keep the context.", "ja": "目の前の対象について尋ねてください。追加質問は文脈を保ちます。"}, "⌘/Ctrl+Enter 发送": {"en": "⌘/Ctrl+Enter to send", "ja": "⌘/Ctrl+Enter で送信"}, "发送": {"en": "Send", "ja": "送信"}, "生成中": {"en": "thinking", "ja": "生成中"}, "工作台": {"en": "Workbench", "ja": "ワークベンチ"}, "资产": {"en": "Assets", "ja": "アセット"}, "运行": {"en": "Run", "ja": "実行"}, "设置": {"en": "Settings", "ja": "設定"}, "从规格到可运行用例的这条流水线，以及每一步产出的物料": {"en": "the pipeline from specification to runnable cases, and what each step produced", "ja": "仕様から実行可能なケースまでのパイプラインと各ステップの産物"}, "阶段产物与测试代码是两条各自迭代的线；交付决定它们能不能低磨损地进到你们现有的流程里。": {"en": "stage artefacts and test code iterate separately; delivery decides whether either can enter your existing process.", "ja": "段階産物とテストコードは別々に反復します。デリバリーはそれらが既存の流れに入れるかを決めます。"}, "产物线": {"en": "artefacts", "ja": "産物"}, "可运行": {"en": "runnable", "ja": "実行可能"}, "门禁②均分": {"en": "Gate ② avg", "ja": "ゲート② 平均"}, "公共片段": {"en": "Fragments", "ja": "共通フラグメント"}, "已偏离": {"en": "Drifted", "ja": "乖離あり"}, "被改松的断言": {"en": "Weakened", "ja": "緩められた検証"}, "用例": {"en": "Case", "ja": "ケース"}, "状态": {"en": "State", "ja": "状態"}, "门禁②": {"en": "Gate ②", "ja": "ゲート②"}, "修复": {"en": "Repair", "ja": "修復"}, "上次执行": {"en": "Last run", "ja": "前回実行"}, "无代码": {"en": "No code", "ja": "コードなし"}, "已偏离生成版": {"en": "drifted", "ja": "生成版と乖離"}, "断言被改松": {"en": "assertion weakened", "ja": "アサーション緩和"}, "修复轮次": {"en": "Repair rounds", "ja": "修復ラウンド"}, "修复停在这里：": {"en": "Repair stopped:", "ja": "修復停止:"}, "判为产品缺陷": {"en": "product defect", "ja": "製品欠陥と判定"}, "模型拒绝继续改——它认为这是产品的问题，不是测试的问题。这一句比任何一次「修好了」都值得看。": {"en": "the model refused to keep patching: it judged this a product fault, not a test fault. That sentence is worth more than any green run.", "ja": "モデルが修正を拒否——テストではなく製品の問題と判断。"}, "这一轮没有留下代码（旧运行）": {"en": "this round stored no code (older run)", "ja": "この回のコードは保存されていません"}, "退回到第 {n} 轮之前": {"en": "revert to before round {n}", "ja": "第 {n} 回の前に戻す"}, "把用例的代码换回第 {n} 轮动手之前的那一段。用的是当时存下来的代码，不重新生成。": {"en": "put back exactly the code this case had before round {n} — the stored copy, not a regeneration.", "ja": "第 {n} 回の前のコードに戻します（保存済みのもの、再生成ではありません）。"}, "最终可用": {"en": "Runnable", "ja": "実行版"}, "生成的": {"en": "Generated", "ja": "生成版"}, "差异": {"en": "diff", "ja": "差分"}, "这条用例还没有可运行的代码。": {"en": "This case has no runnable code yet.", "ja": "このケースにはまだ実行可能なコードがありません。"}, "没有对应的生成版本：这条用例不是从某次运行批准过来的，或那次运行的产物已经过期清理。": {"en": "No generated version: this case did not come through a run, or that run's products have been retained out.", "ja": "生成版がありません：このケースは実行から承認されたものではないか、その成果物が保持期間を過ぎています。"}, "与生成版逐字相同——批准之后没有人改过它。": {"en": "Identical to the generated version — nobody has touched it since approval.", "ja": "生成版と完全に一致——承認後に変更されていません。"}, "这个项目还没有一条用例带代码。阶段二的产物目前只存在于工作流运行里——去「复核队列」批准一个 g2 批次，代码才会跟着用例进到看板。": {"en": "No case in this project carries code yet. Stage-two products still live only inside workflow runs — approve a g2 batch in the review queue and the code arrives with the cases.", "ja": "このプロジェクトにはコード付きのケースがまだありません。第二段階の成果物は実行の中にだけ存在します——レビューキューで g2 バッチを承認すると、コードがケースと共にボードへ入ります。"}, "这次运行生成的 {n} 段（候选）": {"en": "{n} generated in this run (candidates)", "ja": "この実行で生成された {n} 件（候補）"}, "属于这次运行，不在看板上——批准之后才跟着用例进来，届时才可编辑、才计入上面的数": {"en": "these belong to the run, not the board — approving is what brings them in, and only then are they editable and counted above", "ja": "これらは実行に属し、ボードにはない——承認して初めてケースと共に入り、編集可能かつ上の集計に含まれる"}, "导出按 cases / actions / flows 三层生成：至少两条用例共用的前置进 flows，重复的单步进 actions，其余留在用例里。抽取只改组织不改语义——展开之后与原步骤逐字相同。复用率受措辞一致性限制：同一个目标写成两种话，就收敛不成一个动作（门禁②的 wording-drift 管这件事）。": {"en": "The export is generated in three layers — cases / actions / flows: a prologue shared by at least two cases becomes a flow, a repeated single step becomes an action, the rest stays inline. Extraction changes organisation, not meaning: expanding it back yields the original steps verbatim. Reuse is capped by wording consistency — one target worded two ways cannot converge into one action (that is what gate ②'s wording-drift is for).", "ja": "エクスポートは cases / actions / flows の三層で生成：2 件以上で共有される前提は flow、繰り返す単一手順は action、残りはインライン。抽出は構成のみを変え意味は変えない——展開すれば元の手順と逐語一致。再利用率は表現の一貫性に制限される（ゲート②の wording-drift が扱う）。"}, "重生成不是覆盖：产物留着，改动是一条记录，两版并排可比。": {"en": "Regeneration is not an overwrite: the product stays, the change is a record, and the two versions sit side by side.", "ja": "再生成は上書きではありません：成果物は残り、変更は記録として並べて比較できます。"}, "还没有任何改动记录：这个项目的用例既没有在复核里被改写过，代码也没有在批准后被动过。": {"en": "No changes recorded: nothing in this project was rewritten in review, and no code has been touched since approval.", "ja": "変更記録はありません：レビューでの書き換えも、承認後のコード変更もありません。"}, "改了什么": {"en": "What changed", "ja": "変更内容"}, "谁改的": {"en": "By", "ja": "変更者"}, "模型重写": {"en": "regenerated", "ja": "モデル再生成"}, "人改的": {"en": "by hand", "ja": "手作業"}, "批准后被改过": {"en": "edited after approval", "ja": "承認後に編集"}, "环境": {"en": "Environment", "ja": "環境"}, "同一批用例跑在不同环境上": {"en": "the same cases run against different environments", "ja": "同じケースを異なる環境で実行する"}, "危险操作": {"en": "Danger zone", "ja": "危険な操作"}, "不可逆，且级联": {"en": "irreversible, and it cascades", "ja": "取り消し不可、連鎖削除"}, "语言与调试": {"en": "Language & debug", "ja": "言語とデバッグ"}, "只影响你自己这一端": {"en": "affects only your own end", "ja": "自分の環境のみに影響"}, "删除这个项目": {"en": "Delete this project", "ja": "このプロジェクトを削除"}, "会一并删掉它下面的用例、运行记录、视觉与性能基线、环境与密钥。删掉之后没有撤销。": {"en": "This also removes its cases, run records, visual and performance baselines, environments and secrets. There is no undo.", "ja": "ケース、実行記録、視覚・性能ベースライン、環境、シークレットも併せて削除されます。取り消しはできません。"}, "确认请照抄项目名：{name}": {"en": "To confirm, type the project name: {name}", "ja": "確認のためプロジェクト名を入力してください：{name}"}, "永久删除": {"en": "Delete permanently", "ja": "完全に削除"}, "待审批基线": {"en": "Baselines to approve", "ja": "承認待ちベースライン"}, "视觉与性能的差异，要人看过才算数": {"en": "visual and performance differences only count once a person has looked", "ja": "視覚・性能の差分は人が見て初めて確定します"}, "这是整套系统里唯一还需要人点头的地方：门禁能打分，但「界面变了 8.5% 是改版还是回归」没有程序能替人回答。": {"en": "The one thing here that still needs a person: a gate can score, but nothing can decide for you whether an 8.5% visual change is a redesign or a regression.", "ja": "ここだけは人の判断が要ります：ゲートは採点できても、8.5% の画面差が改修か退行かは機械には決められません。"}, "没有等着看的差异：每条用例最近一次运行的视觉与性能基线都对得上，或者已经批过了。": {"en": "Nothing waiting: every case's latest run matches its baselines, or they have already been accepted.", "ja": "待機中の差分はありません：各ケースの最新実行はベースラインと一致、または既に承認済みです。"}, "视觉差异": {"en": "Visual differences", "ja": "視覚差分"}, "性能回归": {"en": "Performance regressions", "ja": "性能退行"}, "还没有基线": {"en": "no baseline yet", "ja": "ベースライン未設定"}, "看图": {"en": "Compare", "ja": "画像を見る"}, "收起": {"en": "Hide", "ja": "隠す"}, "接受为新基线": {"en": "Accept as baseline", "ja": "新ベースラインとして承認"}, "判为回归": {"en": "It’s a regression", "ja": "リグレッションと判定"}, "产品错了，不是改版。基线不动，这条用例继续红着——那正是它该做的事": {"en": "the product is wrong, not redesigned. The baseline stays put and this case keeps failing — which is exactly its job", "ja": "製品側の誤りです。ベースラインは変えず、このケースは赤のまま保ちます"}, "判为回归——写一句为什么。这条用例会一直红着，后面的人得知道在等什么修好。": {"en": "Marking this a regression — say why. The case keeps failing, and whoever picks it up needs to know what they are waiting on.", "ja": "リグレッションと判定します。理由を書いてください（このケースは赤のまま）。"}, "环境噪声": {"en": "Environmental noise", "ja": "環境ノイズ"}, "这次的数字不算数（机器忙、网络抖）。基线不动，这一条从待办里划掉——只适用于性能": {"en": "this run’s numbers do not count (busy machine, flaky network). The baseline stays put and this item leaves the queue — performance only", "ja": "今回の数値は無効（負荷・ネットワーク）。ベースラインは変えず、この項目のみ除外（性能限定）"}, "承认是环境噪声——写一句是什么噪声（可留空）。": {"en": "Calling this environmental noise — say what kind (optional).", "ja": "環境ノイズとして扱います。内容を書いてください（任意）。"}, "接受为新性能基线": {"en": "Accept as perf baseline", "ja": "新性能ベースラインとして承認"}, "基线": {"en": "Baselines", "ja": "ベースライン"}, "本次": {"en": "current", "ja": "今回"}, "只看每条用例最近一次运行：三周前的一次差异如果后来跑绿了，那是历史，不是待办。批准写的是基线的时间戳，没有另一张「已读」表——多一张表就多一处会和事实不一致的地方。": {"en": "Only each case's latest run is considered: a difference from three weeks ago that has since gone green is history, not a to-do. Approval writes the baseline's timestamp; there is no separate \"seen\" table, because a second table is a second place that can disagree with the facts.", "ja": "各ケースの最新実行のみを対象とします：三週間前の差分がその後緑になったなら、それは履歴であり未処理ではありません。承認はベースラインの時刻を更新するだけで、別途「既読」表は持ちません。"}, "需求追溯": {"en": "Traceability", "ja": "トレーサビリティ"}, "每条用例指回哪一句规格，断言凭什么这么写": {"en": "which line of the spec each case points back to, and what backs its assertion", "ja": "各ケースが仕様のどの行に対応し、その検証は何を根拠にしているか"}, "孤儿用例": {"en": "Orphans", "ja": "孤立ケース"}, "有用例的故事": {"en": "Stories with cases", "ja": "ケースのあるストーリー"}, "查不到依据的引文": {"en": "Unbacked quotes", "ja": "根拠不明の引用"}, "用例 → 故事": {"en": "Case → story", "ja": "ケース → ストーリー"}, "故事 → 用例": {"en": "Story → cases", "ja": "ストーリー → ケース"}, "指不回任何故事的用例，是没人能复核的用例——门禁①在算这个数。": {"en": "A case that points back at no story is a case nobody can review — gate ① counts these.", "ja": "どのストーリーにも紐づかないケースは誰もレビューできない——ゲート①がこれを数えます。"}, "一条用例都没有的故事，就是覆盖率那个数的下界来源；它是一份清单，不是一个百分比。": {"en": "Stories with no case at all are where the coverage number's lower bound comes from — a list, not a percentage.", "ja": "ケースが一つもないストーリーが、カバレッジ下限の出どころです——割合ではなく一覧で示します。"}, "指回": {"en": "Points back at", "ja": "対応先"}, "锚点": {"en": "Anchors", "ja": "アンカー"}, "没有指向任何故事": {"en": "points at no story", "ja": "対応ストーリーなし"}, "指向 {id}，但这次运行没有产出这条故事": {"en": "points at {id}, which this run never produced", "ja": "{id} を指すが、この実行では生成されていない"}, "断言没有引用界面文案——无从查起，不等于通过": {"en": "the assertion quotes no interface text — nothing to check, which is not a pass", "ja": "検証が画面文言を引用していない——照合対象がなく、合格とは異なる"}, "这串字在喂给那次运行的材料里查得到": {"en": "this string is present in the material the run was given", "ja": "この文字列は実行に与えられた資料内に存在します"}, "查不到出处": {"en": "unfound quotes", "ja": "出典不明の引用"}, "断言引用的界面文案，在喂给这次运行的材料和整理后的规格里都查不到。可能是编的，也可能产品确实这么显示、只是没人写下来——两者都要改，但改的东西不一样。": {"en": "The interface text this assertion quotes appears neither in the material fed to the run nor in the composed specification. It may be invented, or the product may really say it and nobody wrote it down — both need fixing, but not the same fix.", "ja": "この検証が引用する画面文言は、投入資料にも整理済み仕様にも見つかりません。捏造かもしれず、実際に表示されるが未記載かもしれません——どちらも対処が必要ですが、対処内容は異なります。"}, "没有引文": {"en": "nothing quoted", "ja": "引用なし"}, "断言里没有任何带引号的界面文案，所以没有可查的东西。这不等于通过——它是自己的一档。": {"en": "The assertion quotes no interface text at all, so there is nothing to check. That is not the same as passing; it is its own state.", "ja": "検証が画面文言を一切引用していないため、確認対象がありません。合格とは異なる独立した状態です。"}, "孤儿": {"en": "orphans", "ja": "孤立"}, "指不回任何故事，或指向一个这次运行没产出过的故事。两种情况对复核的人是同一件事：没有可以对照的东西。": {"en": "Points at no story, or at one this run never produced. To a reviewer both are the same problem: there is nothing to check it against.", "ja": "どのストーリーも指していないか、この実行が生成しなかったものを指しています。レビュアーにとっては同じ問題です。"}, "只在整理后的规格里查到，材料里没有这句话。不是编造——是整理者写下了它。要么材料该补，要么这句话该去掉。": {"en": "Found only in the composed specification, not in the material. Not invented — the composer wrote it. Either the material is missing it, or the line should go.", "ja": "整理済み仕様にのみ存在し、元資料にはありません。捏造ではなく整理者が書いたものです。資料を補うか、この記述を削るかです。"}, "材料里查不到这串字。可能是模型编的，也可能是产品确实这么显示、只是规格没写——前者改用例，后者补规格": {"en": "the material does not contain this string: either the model invented it, or the product really says it and the spec never wrote it down — the first means fix the case, the second means fix the spec", "ja": "資料にこの文字列がありません。モデルの捏造か、製品は実際にそう表示するが仕様に記載がないか——前者はケースを、後者は仕様を直します"}, "锚点检查是确定性的字符串比对，不是再问一次模型：用模型判自己有没有编造，量的是它的自评。代价是引号以外的编造抓不到。": {"en": "The anchor check is a deterministic string comparison, not another model call: asking a model whether it invented something measures its self-assessment. The cost is that fabrication outside quotes goes unseen.", "ja": "アンカー検査は決定的な文字列比較であり、再度モデルに問うものではありません。捏造の有無をモデルに聞けば測れるのは自己評価だけです。代償として引用外の捏造は検出できません。"}, "代码线": {"en": "code", "ja": "コード"}, "测试代码": {"en": "Test code", "ja": "テストコード"}, "生成的那份，和今晚真正要跑的那份": {"en": "what was generated, and what actually runs tonight", "ja": "生成されたコードと、今夜実際に走るコード"}, "变更": {"en": "Changes", "ja": "変更"}, "谁改了什么，改动过没过门禁": {"en": "who changed what, and whether the gate saw it", "ja": "誰が何を変え、ゲートを通ったか"}, "交付": {"en": "Delivery", "ja": "デリバリー"}, "交付与接入": {"en": "Delivery", "ja": "デリバリー"}, "端无关：换 iOS/Android 不用重写": {"en": "end-agnostic: no rewrite for iOS/Android", "ja": "端末非依存"}, "生成的用例先到这里，批准才进看板": {"en": "generated cases wait here; approving is what puts one on the board", "ja": "生成物はここで承認待ち"}, "进你们的仓库与流水线": {"en": "into your repository and pipeline", "ja": "あなたのリポジトリと CI へ"}, "先在顶栏选一个项目——用例、运行与基线都挂在项目下面": {"en": "pick a project in the top bar first — cases, runs and baselines all hang off one", "ja": "先に上部バーでプロジェクトを選択してください——ケース・実行・ベースラインはその配下にあります"}, "导出为可独立运行的工程": {"en": "Export a standalone project", "ja": "独立実行できる形で書き出す"}, "产出 Playwright + Midscene 的完整工程：用例、公共片段、.env.example、README。你们可以直接放进自己的仓库跑。": {"en": "a complete Playwright + Midscene project: cases, shared fragments, .env.example, README — drop it into your repository and run it.", "ja": "Playwright + Midscene の完全なプロジェクトを出力します。"}, "条用例": {"en": "cases", "ja": "ケース"}, "条已生成代码": {"en": "with code", "ja": "コード生成済み"}, "个文件": {"en": "files", "ja": "ファイル"}, "下载 .zip": {"en": "Download .zip", "ja": ".zip をダウンロード"}, "下载之前查过的几件事": {"en": "Checked before you download", "ja": "ダウンロード前の確認結果"}, "隔离的用例 {n} 条": {"en": "{n} quarantined cases", "ja": "隔離ケース {n} 件"}, "靠改松断言才变绿的 {n} 条": {"en": "{n} cases that only went green after their assertion was weakened", "ja": "アサーション緩和で通った {n} 件"}, "还没有代码的 {n} 条（它们导出后跑不起来）": {"en": "{n} cases with no code (they cannot run once exported)", "ja": "コード未生成 {n} 件（出力後も実行不可）"}, "登录环节": {"en": "Login step", "ja": "ログイン処理"}, "环境的 query 参数": {"en": "Environment query params", "ja": "環境のクエリパラメータ"}, "（默认不导出）": {"en": "(excluded by default)", "ja": "（既定で除外）"}, "连隔离的和改松断言的一起导出": {"en": "include quarantined and weakened cases too", "ja": "隔離・緩和されたケースも含める"}, "未实现": {"en": "not built yet", "ja": "未実装"}, "生成 PR 到你们的仓库": {"en": "Open a PR against your repository", "ja": "リポジトリへ PR"}, "按你们的目录结构（如 e2e/{flows,actions,cases}/）落文件并开 PR，走你们自己的 review，而不是我们这边的批准。目前只有上面的 zip 导出是实的。": {"en": "write files into your own layout and open a PR, so review happens in your process, not ours. Only the zip export above exists today.", "ja": "あなたの構成に合わせて PR を作成します（現状は zip のみ実装済み）。"}, "接你们的 CI": {"en": "Run in your CI", "ja": "CI に組み込む"}, "在你们的流水线里跑这批用例并回传结果（含失败归因与判定来源）。CLI 尚未提供。": {"en": "run this suite inside your pipeline and send results back, with failure attribution and who settled each verdict. The CLI does not exist yet.", "ja": "あなたのパイプラインで実行し結果を返します（CLI は未提供）。"}, "覆盖回传": {"en": "Write coverage back", "ja": "カバレッジの書き戻し"}, "把「哪些需求有用例、哪些没有」写回需求系统，而不是只留在我们这边一个数字里。尚未接入。": {"en": "write which requirements are covered back into your tracker instead of leaving it as a number on our side. Not connected yet.", "ja": "どの要件がカバーされたかを課題管理側へ書き戻します（未接続）。"}, "接管建议分档推进：先只补充用例，等它证明自己不制造假信号，再让它跑回归，最后才谈接管回归门禁。误报比漏报致命——一份没人信的报告，红了也不会有人看。": {"en": "adopt in stages: supplement cases first, let it prove it does not manufacture false signals, then let it run regression, and only then talk about owning the gate.", "ja": "段階的に導入してください（まずケース補完、次に回帰実行、最後にゲート）。"}, "被测产品的结果：执行记录、套件批次、趋势。「迭代」量的是 harness 的版本，这里量的是产品。": {"en": "the product's own results. 迭代 measures a harness version; this measures the product.", "ja": "被テスト製品の結果です。"}, "每一次跑了什么、结果与归因": {"en": "what each execution did, and how it failed", "ja": "各実行の結果と原因"}, "成套跑的门禁结论与抖动统计": {"en": "the suite-level gate verdict and flakiness", "ja": "スイートのゲート結論"}, "一段时间的通过率、抖动、MTTR": {"en": "pass rate, flakiness and MTTR over a window", "ja": "期間内の推移"}, "项目配置与运行时。它们跨一次工作存在，所以不进工作台。": {"en": "project configuration and runtime. They outlive any single piece of work, so they stay out of the workspace.", "ja": "プロジェクト設定とランタイム。"}, "目标端与入口，产物挂在它下面": {"en": "target and entry point; artefacts hang off it", "ja": "対象と入口"}, "注入钱包与链上断言": {"en": "injected wallet and on-chain assertions", "ja": "ウォレット注入と検証"}, "工作流生成的用例先到这里。批准才进看板——看板是「我认可的用例集」,这层含义值得保住。拒绝会被记住,不会再问第二遍。": {"en": "Generated cases wait here. Approving is what puts one on the board — the board means 'the suite I stand behind', and that meaning is worth keeping. Rejections are remembered.", "ja": "生成されたケースはここで待機します。承認するとボードに入ります。却下は記憶されます。"}, "{n} 次运行": {"en": "{n} runs", "ja": "{n} 件の実行"}, "{n} 条用例": {"en": "{n} cases", "ja": "{n} 件のケース"}, "{n} 次执行": {"en": "{n} executions", "ja": "{n} 件の実行結果"}, "队列": {"en": "Queue", "ja": "キュー"}, "已决定": {"en": "decided", "ja": "決定済み"}, "进度": {"en": "Progress", "ja": "進捗"}, "产物": {"en": "Artifacts", "ja": "成果物"}, "这次它看得到什么": {"en": "What this run could see", "ja": "この実行が見えていたもの"}, "已打回": {"en": "rejected", "ja": "却下"}, "门禁 finding": {"en": "Gate findings", "ja": "ゲート指摘"}, "缺口": {"en": "Gaps", "ja": "ギャップ"}, "批次": {"en": "Batches", "ja": "バッチ"}, "门禁算式": {"en": "Gate formula", "ja": "ゲート式"}, "（无）": {"en": "(none)", "ja": "（なし）"}, "已选": {"en": "Selected", "ja": "選択中"}, "清除": {"en": "Clear", "ja": "クリア"}, "批量调整": {"en": "Batch", "ja": "一括調整"}, "待复核": {"en": "pending", "ja": "未レビュー"}, "批准入库": {"en": "Approve", "ja": "承認"}, "地图": {"en": "Map", "ja": "マップ"}, "列表": {"en": "List", "ja": "リスト"}, "这个筛选下没有条目": {"en": "nothing matches this filter", "ja": "この条件に一致する項目はありません"}, "队列+详情": {"en": "Queue + detail", "ja": "キュー＋詳細"}, "选中这条故事的全部待复核用例": {"en": "Select this story's pending cases", "ja": "このストーリーの未処理ケースを選択"}, "没有骨架位置": {"en": "No activity", "ja": "アクティビティなし"}, "挂不到已知故事": {"en": "No known story", "ja": "既知のストーリーなし"}, "没测到": {"en": "not tested", "ja": "未テスト"}, "没看到": {"en": "not seen", "ja": "未探索"}, "看见了、走过了，但没有用例验它 —— 现在就能补": {"en": "Seen and walked, but no case checks it — you can add one now", "ja": "到達したがケースがない — 今すぐ追加できる"}, "探索没进去 —— 补用例没用，要让探索再走一次": {"en": "Exploration never got there — a case won't help; explore again", "ja": "探索が到達していない — 再探索が必要"}, "验不住": {"en": "not caught", "ja": "検出できない"}, "测了，但那条断言拦不住这个变更 —— 现有用例不够严，要改断言": {"en": "Tested, but the assertion does not catch this change — the case is too loose", "ja": "テストはあるが、この変更を検出できない — アサーションが緩い"}, "变异得分": {"en": "Mutation score", "ja": "ミューテーションスコア"}, "未跑变异测试 —— 这套用例验不验得住，目前不知道": {"en": "No mutation run — whether these cases actually catch faults is unknown", "ja": "ミューテーション未実行"}, "这一列没有发现缺口": {"en": "No gaps found here", "ja": "ギャップなし"}, "在地图上看它": {"en": "Find it on the map", "ja": "マップで見る"}, "补一条用例": {"en": "Write a case for it", "ja": "ケースを補う"}, "补着…": {"en": "writing…", "ja": "作成中…"}, "照这条缺口写一条用例，过一遍门禁①，放进这一批等你复核。它不会直接进看板——和别的候选一样，等的是同一个决定。": {"en": "write one case aimed at this gap, run it through gate ①, and queue it here for review. It does not land on the board — it waits on the same decision as every other candidate.", "ja": "このギャップ向けのケースを 1 件作成し、ゲート① を通してレビュー待ちに入れます（ボードには直接入りません）。"}, "门禁① 没有意见": {"en": "gate ① raised nothing", "ja": "ゲート① の指摘なし"}, "已进这一批的复核队列": {"en": "queued in this batch for review", "ja": "このバッチのレビュー待ちに追加"}, "看缺口": {"en": "Show gaps", "ja": "ギャップを表示"}, "这个产品有、而这批用例没有的": {"en": "In the product, missing from this batch", "ja": "製品にあってこのバッチにないもの"}, "不属于任何模块": {"en": "Not in any module", "ja": "モジュール外"}, "探索停止原因": {"en": "Exploration stopped because", "ja": "探索の停止理由"}, "这一块没有任何故事": {"en": "No stories in this module", "ja": "このモジュールにストーリーなし"}, "没有流程可挂 —— 它可能只是一条界面事实": {"en": "No flow behind it — may just be a fact about a screen", "ja": "背後にフローがない"}, "这条故事没有用例": {"en": "No cases for this story", "ja": "ケースなし"}, "拒绝": {"en": "Reject", "ja": "却下"}, "全选待复核": {"en": "select all pending", "ja": "未処理を全選択"}, "{n} 条不是用户故事，是界面事实": {"en": "{n} are facts about a screen, not user stories", "ja": "{n} 件はユーザーストーリーではなく画面の事実"}, "测试数据": {"en": "Test data", "ja": "テストデータ"}, "测试数据集": {"en": "Test datasets", "ja": "テストデータセット"}, "一张有名字的表，绑给用例之后一行跑一次。此前数据只有两个去处：写死在步骤里（换个环境跑不了，跑第二遍撞唯一约束，而且进了版本库），或者塞进环境变量的数组（能跑，但没有名字、没有列、没有界面）。": {"en": "A named table: bind it to a case and the case runs once per row. Until now data had two homes, both wrong — hard-coded into steps (breaks in another environment, collides with unique constraints on the ne; a case that writes and does not clean up poisons every later run of itself", "ja": "後片付けなし。読み取り専用なら不要だが、書き込むケースが片付けないと、以後の実行すべてを汚染する"}, "需求": {"en": "Requirement", "ja": "要求"}, "程序可判": {"en": "machine", "ja": "機械判定"}, "关系可判": {"en": "relation", "ja": "関係判定"}, "模型判屏": {"en": "judged", "ja": "モデル判定"}, "声称 t{claimed}，但判据只能给到 t{delivered}": {"en": "claims t{claimed}, but the oracle only delivers t{delivered}", "ja": "t{claimed} を主張、判定は t{delivered} まで"}, "候选用例还没有看板优先级——批准入库时才定": {"en": "a candidate has no board priority yet; it is set when the case is approved", "ja": "候補にはまだ優先度なし——承認時に決まる"}, "代码门禁拦下": {"en": "blocked by code gate", "ja": "コードゲートで却下"}, "等价类": {"en": "equivalence", "ja": "同値分割"}, "每个有效/无效输入类取一个代表值": {"en": "one representative per valid/invalid input class", "ja": "有効・無効クラスごとに代表値を一つ"}, "边界值": {"en": "boundary", "ja": "境界値"}, "空、最小、最大、刚越界": {"en": "empty, minimum, maximum, just over the limit", "ja": "空・最小・最大・境界超え"}, "状态迁移": {"en": "state transition", "ja": "状態遷移"}, "一次状态改变，以及改变之后必须成立的东西": {"en": "a state change and what must hold after it", "ja": "状態変化と、その後に成立すべきこと"}, "判定表": {"en": "decision table", "ja": "デシジョンテーブル"}, "多个条件的组合": {"en": "a combination of conditions", "ja": "複数条件の組み合わせ"}, "负例": {"en": "negative", "ja": "異常系"}, "错误路径：产品必须拒绝，并且说出来": {"en": "an error path — the product must refuse, and say so", "ja": "エラー経路：製品は拒否し、それを伝えねばならない"}, "未标方法": {"en": "no method", "ja": "手法未指定"}, "没有点名测试设计方法": {"en": "no design method was named", "ja": "設計手法が指定されていない"}, "作为{role}，我要{what}，以便{benefit}": {"en": "As {role}, I want {what}, so that {benefit}", "ja": "{role}として、{what}したい。{benefit}のために"}, "（没说是谁）": {"en": "(no role)", "ja": "（役割不明）"}, "（没说为了什么）": {"en": "(no benefit)", "ja": "（目的不明）"}, "既没说谁在用，也没说为了什么——这不是一条用户故事，是一条界面事实": {"en": "names neither a user nor a benefit — this is a fact about a screen, not a user story", "ja": "利用者も目的も示されていない——これはユーザーストーリーではなく画面の事実"}, "没说谁在用": {"en": "no role named", "ja": "利用者が不明"}, "没说为了什么——判断不了这条值不值得测": {"en": "no benefit n it runs", "ja": "失敗しえないケースは何度実行しても情報を生まない"}, "写一句具体的、可观测的结果：一段文案、一个数、一个位置": {"en": "name one concrete observable outcome: a literal, a number, a location", "ja": "具体的で観測可能な結果を一つ書く：文言・数値・位置"}, "断言没有指向任何可观测的现象：「{expected}」": {"en": "the assertion names no observable phenomenon: “{expected}”", "ja": "検証が観測可能な現象を指していない：「{expected}」"}, "「正常展示」「工作正常」这类话，判定权在读的人手里，不在产品的输出里——两个人会判出两个结果": {"en": "“works correctly”, “displays normally” put the verdict in the reader’s hands rather than in the product’s output", "ja": "「正常に動作」等は判定が読み手に委ねられ、製品の出力に基づかない"}, "换成产品真的会显示的一段文案、一个数字、一个元素的出现或消失、或者一个地址": {"en": "replace it with a literal the product shows, a number, an element appearing or disappearing, or a location", "ja": "製品が実際に表示する文言・数値・要素の出現消失・URL に置き換える"}, "由模型看截图判定——tier 3 留给别的办法都判不了的情况": {"en": "judged by a model — reserve tier 3 for what nothing else can decide", "ja": "モデル判定——tier 3 は他に手段がない場合に限る"}, "模型判屏慢，而且同一次重跑可能给出不同结论": {"en": "a model judging a screenshot is slow, and a re-run can disagree with itself", "ja": "モデルの画面判定は遅く、再実行で結論が変わりうる"}, "如果结果能写成一段文案、一个计数或一个地址，就降到 tier 1 并补上 oracle": {"en": "if the outcome can be a literal, a count or a location, drop to tier 1 and give an oracle", "ja": "文言・件数・URL で書けるなら tier 1 に下げて oracle を付ける"}, "凭证被写进了步骤，而不是用占位符：「{step}」": {"en": "a credential is written into a step instead of a placeholder: “{step}”", "ja": "認証情報が手順に直書きされている：「{step}」"}, "写死的凭证会随用例进版本库，也让这条用例换个环境就跑不了": {"en": "a hard-coded credential goes into version control and pins the case to one environment", "ja": "直書きの認証情報はリポジトリに入り、環境を変えると動かない"}, "改成 ${env.NAME} / ${secret.NAME}": {"en": "use ${env.NAME} / ${secret.NAME}", "ja": "${env.NAME} / ${secret.NAME} を使う"}, "和「{other}」验的是同一件事（key {key}）": {"en": "same coverage as “{other}” (key {key})", "ja": "「{other}」と同一の検証（key {key}）"}, "重复的用例让套件更慢，但不让它更强": {"en": "a duplicate makes the suite slower without making it stronger", "ja": "重複はスイートを遅くするだけで強くしない"}, "删掉一条，或者把其中一条改成验另一个输入类/边界": {"en": "drop one, or change it to cover a different class or boundary", "ja": "片方を削除するか、別のクラス・境界を検証するよう変更する"}, "故事 {storyId} 一条用例都没有": {"en": "story {storyId} has no cases", "ja": "ストーリー {storyId} にケースがない"}, "它是覆盖率下界的直接来源": {"en": "it is where the coverage lower bound comes from", "ja": "カバレッジ下限の直接の出所"}, "补用例，或者说明这条故事为什么不测": {"en": "add cases, or say why this story is not tested", "ja": "ケースを追加するか、テストしない理由を書く"}, "声称覆盖 {transition}，但规格里没有这条转移": {"en": "claims to cover {transition}, which the specification does not contain", "ja": "{transition} をカバーと主張するが、仕様に該当遷移がない"}, "自己编出来的转移 id 覆盖不了任何东西，却会让结构覆盖率虚高": {"en": "a transition id you composed yourself covers nothing, but inflates the structural coverage", "ja": "自作の遷移 ID は何もカバーせず、構造カバレッジだけを水増しする"}, "从规格的流程步骤里逐字抄一个，或者留空": {"en": "copy one verbatim from the spec’s flow steps, or leave it empty", "ja": "仕様のフロー手順から逐語コピーするか、空にする"}, "会新增或改动数据，却没有把它放回去的步骤": {"en": "creates or changes something and never puts it back", "ja": "データを作成・変更するが、元に戻す手順がない"}, "一条留下记录的用例会毒化它自己以后的每一次运行：第二次跑面对的产品和第一次不同，而这个差别一直看不见，直到某个计数断言毫无道理地挂掉，然后被当成产品缺陷去查。实测踩过：一批「新增主人」的用例把基准库从 10 个 owner 跑成了 13 个": {"en": "a case that leaves a record behind poisons every later run of itself: the second run starts from a different product than the first, and the difference stays invisible until a count assertion fails for no reason and gets investigated as a product defect. Measured: a batch of add-owner cases grew the benchmark from 10 owners to 13", "ja": "レコードを残すケースは以後の自身の実行すべてを汚染する：二回目は一回目と異なる製品から始まり、その差は件数検証が理由なく失敗するまで見えず、製品不具合として調査される。実測：主人追加のケース群がベンチマークを 10 件から 13 件に増やした"}, "补上清理步骤：把新增的删掉、把改过的改回去。只读的用例不需要": {"en": "add cleanup steps: delete what was added, restore what was changed. A read-only case needs none", "ja": "後片付けの手順を追加：追加したものを削除し、変更したものを戻す。読み取り専用なら不要"}, "标成「{method}」，但内容里看不出这个方法的痕迹": {"en": "labelled “{method}”, but nothing in the case shows that method at work", "ja": "「{method}」と表示されているが、内容にその手法の痕跡がない"}, "方法标签是模型自己填的。一条错标会让评审者放弃相信其余每一条": {"en": "the method label is the model’s own claim; one wrong label costs the reader trust in all the others", "ja": "手法ラベルはモデルの自己申告。一つの誤りが他すべての信頼を損なう"}, "改成实际用的方法，或者把用例改成真的在做那个方法该做的事": {"en": "change the label to the method actually used, or change the case to actually do it", "ja": "実際の手法に修正するか、その手法通りの内容に修正する"}, "什么都没断言：这条用例永远不会失败": {"en": "nothing is asserted: this case can never fail", "ja": "何も検証していない：このケースは決して失敗しない"}, "一条不会失败的用例，在套件里只贡献时间": {"en": "a case that cannot fail contributes only run time", "ja": "失敗しないケースは実行時間しか消費しない"}, "补一句 aiAssert，或者给用例补上机器判据让程序去判": {"en": "add an aiAssert, or give the case a machine oracle so a program settles it", "ja": "aiAssert を追加するか、機械判定を与える"}, "这是一个目标，不是一个动作：「{action}」": {"en": "this is a goal, not an action: “{action}”", "ja": "これは目標であり動作ではない：「{action}」"}, "驱动界面的模型会把目标自己拆成动作，拆不动就放弃——于是这条用例因为措辞失败，却被报成产品坏了": {"en": "the driver plans a goal into actions and gives up when it cannot; the run then fails for the wording and is reported as if the product were broken", "ja": "ドライバは目標を動作に分解し、できなければ諦める。結果、文言のせいの失敗が製品不具合として報告される"}, "换成一个人一秒钟能做完的具体交互：点这个、输那个、选另一个": {"en": "replace it with one concrete interaction a person could do in a second: click this, type that, choose the other", "ja": "人が一秒でできる具体的操作に置き換える：これをクリック、それを入力"}, "同一个动作在这个模块里出现了 {n} 种写法：{samples}": {"en": "the same action is worded {n} different ways in this module: {samples}", "ja": "同一動作がこのモジュール内で {n} 通りの書き方：{samples}"}, "措辞不统一的动作没法收敛成一个公共片段，也让缓存命中率下降": {"en": "actions worded differently cannot converge into a shared fragment, and they lower the cache hit rate", "ja": "表現が揺れる動作は共通化できず、キャッシュ命中率も下がる"}, "在这个模块里统一成一种写法": {"en": "settle on one wording within the module", "ja": "モジュール内で一つの表現に統一する"}, "在等一个计时器，而不是在等一个条件": {"en": "waits on a timer instead of on a condition", "ja": "条件ではなくタイマーを待っている"}, "定时等待在慢机器上不够、在快机器上浪费，是抖动的头号来源": {"en": "a fixed wait is too short on a slow machine and wasted on a fast one — the top source of flakiness", "ja": "固定待機は遅い環境で不足し速い環境で無駄。フレーキーの最大要因"}, "把等待写进动作里：等到某个东西出现为止": {"en": "put the wait inside an action: wait until something appears", "ja": "待機を動作に含める：何かが現れるまで待つ"}, "凭证被写进了源码，而不是 ${secret.*}": {"en": "a credential is written into the source instead of ${secret.*}", "ja": "認証情報がソースに直書き（${secret.*} でない）"}, "写死的凭证会进版本库": {"en": "a hard-coded credential goes into version control", "ja": "直書きの認証情報はリポジトリに入る"}, "改成 ${secret.NAME}": {"en": "use ${secret.NAME}", "ja": "${secret.NAME} を使う"}, "只有 {pct}% 的步骤来自公共片段": {"en": "only {pct}% of steps come from shared fragments", "ja": "共通フラグメント由来の手順は {pct}% のみ"}, "复用低意味着同一段前置在几十条用例里各写一遍，改一次要改几十处": {"en": "low reuse means the same setup is written out in dozens of cases; changing it means changing all of them", "ja": "再利用が低い＝同じ前提を何十ケースにも書き、変更時に全て直すことになる"}, "把重复的动作序列提成具名片段": {"en": "lift the repeated action sequences into named fragments", "ja": "繰り返す操作列を名前付きフラグメントに抽出する"}, "还有 {n} 段步骤序列在多条用例里重复": {"en": "{n} step sequences are still repeated across cases", "ja": "{n} 個の手順列が複数ケースで重複"}, "同 reuse": {"en": "same as reuse", "ja": "reuse と同じ"}, "提成公共片段": {"en": "lift them into fragments", "ja": "共通フラグメントに抽出する"}, "这段代码不执行任何动作": {"en": "the code performs no action", "ja": "このコードは何の操作も行わない"}, "空用例既不验证也不覆盖": {"en": "an empty case neither verifies nor covers anything", "ja": "空のケースは検証もカバーもしない"}, "重新生成，或者把这条用例从批次里去掉": {"en": "regenerate it, or drop the case from the batch", "ja": "再生成するか、バッチから除外する"}, "没能生成代码：{reason}": {"en": "no code was produced: {reason}", "ja": "コード生成に失敗：{reason}"}, "多半是这条用例的步骤太模糊，模型拆不成动作": {"en": "usually the steps are too vague for the model to turn into actions", "ja": "多くは手順が曖昧で動作に分解できない"}, "把步骤改具体，再重跑这一条": {"en": "make the steps concrete and re-run just this case", "ja": "手順を具体化して当該ケースのみ再実行する"}, "用了不允许的调用：{call}": {"en": "uses a call that is not allowed: {call}", "ja": "許可されていない呼び出し：{call}"}, "只有 aiAction / aiInput / aiAssert 三个调用是运行器认识的": {"en": "only aiAction / aiInput / aiAssert are calls the runner knows", "ja": "ランナーが解するのは aiAction / aiInput / aiAssert のみ"}, "重跑这一条": {"en": "Rerun this case", "ja": "このケースを再実行"}, " 示します："}, "文本用例": {"en": "Test cases", "ja": "テストケース"}, "门禁意见": {"en": "Gate finding", "ja": "ゲート指摘"}, "{name}（{n} 行）": {"en": "{name} ({n} rows)", "ja": "{name}（{n} 行）"}, "退回到第 {round} 轮修复之前": {"en": "reverted to before repair round {round}", "ja": "修復ラウンド {round} の前に戻しました"}, "隔离": {"en": "quarantine", "ja": "隔離"}, "解除": {"en": "released", "ja": "解除"}, "当时门禁 {v} · ": {"en": "gate then {v} · ", "ja": "当時のゲート {v} · "}, "停不下来：{why}": {"en": "could not stop: {why}", "ja": "停止できません：{why}"}, "（图上直接写了正文）": {"en": " (body written on the graph)", "ja": "（グラフに本文あり）"}, "覆盖了 {what} 的参数": {"en": "overrode parameters for {what}", "ja": "{what} のパラメータを上書き"}, "正在停 · 当前这一步{step}跑完就停": {"en": "stopping · will halt after the current step{step}", "ja": "停止中 · 現在のステップ{step}の完了後に停止"}, "agent 进程已经不在了，这次运行标记为已取消": {"en": "the agent process is gone — this run is marked cancelled", "ja": "agent プロセスが存在しないため、この実行はキャンセル扱いです"}, "快捷键": {"en": "Keyboard shortcuts", "ja": "キーボードショートカット"}, "任何一屏": {"en": "Anywhere", "ja": "どの画面でも"}, "复核队列": {"en": "Review queue", "ja": "レビューキュー"}, "页头的 tab": {"en": "Header tabs", "ja": "ヘッダータブ"}, "转到某一屏 / 运行 / 项目": {"en": "Go to a screen, run, or project", "ja": "画面・実行・プロジェクトへ移動"}, "打开这张表": {"en": "Open this sheet", "ja": "この一覧を開く"}, "关掉当前的浮层": {"en": "Dismiss the current overlay", "ja": "現在のオーバーレイを閉じる"}, "下一条": {"en": "Next item", "ja": "次の項目"}, "上一条": {"en": "Previous item", "ja": "前の項目"}, "选中 / 取消这一条": {"en": "Select or deselect this item", "ja": "この項目を選択・解除"}, "全选还没决定的": {"en": "Select everything still pending", "ja": "未処理をすべて選択"}, "批准（没选中时就批准光标这一条）": {"en": "Approve (the item at the cursor when nothing is selected)", "ja": "承認（未選択時はカーソル位置の項目）"}, "打回（同上）": {"en": "Reject (same rule)", "ja": "差戻し（同上）"}, "在页头的几个镜头之间切换": {"en": "Move between the header tabs", "ja": "ヘッダータブ間を移動"}, "复核那一组只在复核队列那一屏上有效。在输入框里打字时，所有单键快捷键都让位。": {"en": "The review keys only work on the review queue. While typing in a field, every single-key shortcut steps aside.", "ja": "レビュー用のキーはレビューキュー画面のみで有効です。入力中は単一キーのショートカットは無効になります。"}, "覆盖矩阵": {"en": "Coverage matrix", "ja": "カバレッジ行列"}, "拿人写的 gold checklist 和这次拆出来的用例对拍。三种颜色对应三种处置：命中不用管；遗漏要补一条用例或改拆解提示词；多余是拆出来了而清单里没有——它要么说明清单不全，要么说明拆过头了，是唯一能反过来修正清单的信号。": {"en": "Checks the cases this run produced against the hand-written gold checklist. The three colours are three different things to do: a hit needs nothing; a miss needs a case added or the planning prompt changed; an extra was produced but is not on the checklist — either the checklist is incomplete or the planner over-split, and it is the only signal that can correct the checklist itself.", "ja": "この実行が生成したケースを、人が書いた gold checklist と突き合わせます。三色は三種類の対処に対応します：命中は対応不要、欠落はケース追加かプロンプト修正、余剰は生成されたがリストにないもので、リスト自体を修正できる唯一の手がかりです。"}, "选一次工作流运行…": {"en": "pick a workflow run…", "ja": "ワークフロー実行を選択…"}, "对拍": {"en": "Score", "ja": "採点"}, "对拍中…": {"en": "scoring…", "ja": "採点中…"}, "覆盖率": {"en": "Coverage", "ja": "カバレッジ"}, "留出集": {"en": "held-out", "ja": "ホールドアウト"}, "留出集从不参与调优。一个跟着改提示词就能涨的数说明不了什么，所以它单独算。": {"en": "The held-out slice never informs tuning. A number that rises whenever the prompt is edited proves nothing, so it is scored separately.", "ja": "ホールドアウトは調整に一切使いません。プロンプトを変えるたびに上がる数値は何も証明しないため、別に採点します。"}, "命中 {n}": {"en": "{n} hit", "ja": "命中 {n}"}, "遗漏 {n}": {"en": "{n} missed", "ja": "欠落 {n}"}, "多余 {n}": {"en": "{n} extra", "ja": "余剰 {n}"}, "这次拆出 {n} 条": {"en": "{n} cases this run", "ja": "今回 {n} 件生成"}, "清单项": {"en": "checklist", "ja": "リスト項目"}, "它要求测什么": {"en": "what it asks for", "ja": "要求内容"}, "被哪几条覆盖": {"en": "covered by", "ja": "カバーしたケース"}, "没有用例覆盖它": {"en": "no case covers it", "ja": "カバーするケースなし"}, "多余": {"en": "extra", "ja": "余剰"}, "对不上清单里任何一条": {"en": "matches nothing on the checklist", "ja": "リストのどれとも一致しません"}, "还没有对拍过": {"en": "Nothing scored yet", "ja": "まだ採点していません"}, "选一次工作流运行再点「对拍」。这不会重跑任何东西——它读那次运行已经落盘的用例，和清单逐条比对。": {"en": "Pick a workflow run and press Score. Nothing is re-run: it reads the cases that run already wrote to disk and compares them item by item.", "ja": "ワークフロー実行を選んで「採点」を押してください。再実行はしません。保存済みのケースをリストと逐一比較するだけです。"}, "待跑": {"en": "idle", "ja": "待機"}, "跳过": {"en": "skipped", "ja": "スキップ"}, "停在这儿": {"en": "paused here", "ja": "ここで停止"}, "怎么读这张图": {"en": "How to read this", "ja": "この図の読み方"}, "节点的颜色和它上面那个词说的是同一件事——颜色是给扫的，词是给认的。「停在这儿」是断点，不是失败：它在等你。": {"en": "A node’s colour and the word on it say the same thing: the colour is for scanning, the word is for reading. “Paused here” is a breakpoint, not a failure — it is waiting for you.", "ja": "ノードの色とその上の語は同じことを示します。色は走査用、語は判読用です。「ここで停止」は失敗ではなくブレークポイント——あなたを待っています。"}, "改到了第 {n} 轮上限": {"en": "hit the {n}-round limit", "ja": "{n} ラウンド上限に到達"}, "连续 {n} 轮什么都没改动": {"en": "{n} rounds changed nothing", "ja": "{n} ラウンド連続で変化なし"}, "失败出在环境上，不是这条用例": {"en": "the failure was environmental, not the test’s", "ja": "失敗は環境側で、テスト側ではありません"}, "判定为产品缺陷，拒绝再改": {"en": "reported as a product defect — refused to keep editing", "ja": "製品欠陥と判定し、修正を中止"}, "性能预算（毫秒）：": {"en": "Performance budget (ms):", "ja": "パフォーマンス予算（ミリ秒）："}, "超预算 {cap}": {"en": "over budget {cap}", "ja": "予算 {cap} 超過"}, "预算 {cap} 内": {"en": "within budget {cap}", "ja": "予算 {cap} 内"}, "基线保「别变得更慢」，预算保「本来就不该这么慢」。只跟基线比会漏掉一种情况：基线本身就慢。": {"en": "The baseline guards against getting slower; the budget guards against being slow in the first place. Comparing only to the baseline misses the case where the baseline is already slow.", "ja": "ベースラインは「これ以上遅くしない」、予算は「そもそもこんなに遅くない」を守ります。ベースライン比較だけでは、ベースライン自体が遅い場合を見逃します。"}, "这个项目还没有故事": {"en": "No stories in this project yet", "ja": "このプロジェクトにはまだストーリーがありません"}, "故事是在复核队列里批准用例时一起入库的。批准过之后，这里会长出一棵树：故事 → 用例 → 测试点，一眼看得出哪条需求根本没被测到。": {"en": "Stories are written when cases are approved in the review queue. Once something is approved, this becomes a tree — story, case, test point — where a requirement nothing tests stands out at a glance.", "ja": "ストーリーはレビューキューでケースを承認したときに保存されます。承認後、ここはストーリー → ケース → テスト観点のツリーになり、テストされていない要件が一目で分かります。"}, "重试": {"en": "Retry", "ja": "再試行"}, "界面语言与主题": {"en": "Language & theme", "ja": "言語とテーマ"}, "只影响你这一端。语言同时决定 harness 产出物料时用哪种语言写。": {"en": "affects only your own end. The language also decides which language the harness writes its materials in.", "ja": "この端末にのみ影響します。harness が生成する成果物の言語もこれに従います。"}, "批准到哪个项目…": {"en": "approve into which project…", "ja": "どのプロジェクトへ…"}, "这次运行还没绑项目，先在上面选一个要批准进哪里": {"en": "this run is not bound to a project — pick one above before approving", "ja": "この実行はプロジェクト未割当です。上で承認先を選んでください"}, "起跑单": {"en": "Start sheet", "ja": "実行設定"}, "这一次怎么跑": {"en": "How this run goes", "ja": "今回の実行設定"}, "换环境、给上限、关掉某个组件、改这一次的参数——全都只影响这一次，图和它的版本号一个字都不动": {"en": "pick an environment, set caps, switch a component off, override parameters — all for this run only. The graph and its version stay untouched", "ja": "環境・上限・アブレーション・パラメータを今回だけ変更します。グラフとバージョンは変わりません"}, "打哪个环境": {"en": "Environment", "ja": "環境"}, "不选（拿默认环境，记录里会写明）": {"en": "leave unset (takes the default; the record says so)", "ja": "未選択（既定環境。記録に残ります）"}, "一次性地址": {"en": "One-off URL", "ja": "今回だけの URL"}, "填了就盖过环境的 baseUrl，只这一次": {"en": "overrides the environment baseUrl, for this run only", "ja": "環境の baseUrl を今回だけ上書き"}, "上限（留空 = 不设，不是设成 0）": {"en": "Caps (blank = none, not zero)", "ja": "上限（空欄＝未設定。0 ではありません）"}, "分钟": {"en": "minutes", "ja": "分"}, "这次关掉": {"en": "Switch off for this run", "ja": "今回無効にする"}, "参数覆盖": {"en": "Parameter overrides", "ja": "パラメータ上書き"}, "只作用于这一次。图不动、版本号不动；改了什么会记进这次运行，列表上也会标出来——一次带覆盖的运行不是这张图的基线成绩。": {"en": "for this run only. The graph and its version do not change; what you changed is recorded on the run and flagged in the list — a run with overrides is not this graph’s baseline result.", "ja": "今回のみ有効。グラフとバージョンは不変で、変更内容は実行記録に残り一覧にも表示されます。"}, "还原": {"en": "reset", "ja": "戻す"}, "只影响这一次": {"en": "this run only", "ja": "今回のみ"}, "按这些跑": {"en": "Run with these", "ja": "この設定で実行"}, "取消": {"en": "Cancel", "ja": "キャンセル"}, "只跑此节点": {"en": "Run this node", "ja": "このノードのみ実行"}, "从此节点续跑": {"en": "Continue from this node", "ja": "このノードから続行"}, "新运行": {"en": "New run", "ja": "新規実行"}, "继续": {"en": "Continue", "ja": "続行"}, "断点": {"en": "breakpoints", "ja": "ブレークポイント"}, "点一个节点看它的产物": {"en": "Pick a node to see what it produced", "ja": "ノードを選ぶと産物が見えます"}, "这个节点在本次运行还没有产物": {"en": "no output from this node on this run", "ja": "この実行での産物はまだありません"}, "暂无事件": {"en": "no events yet", "ja": "イベントはまだありません"}, "节点参数": {"en": "Node params", "ja": "ノードパラメータ"}, "保存": {"en": "Save", "ja": "保存"}, "搜键名或值…": {"en": "search keys or values…", "ja": "キー・値を検索…"}, "可留空": {"en": "optional", "ja": "任意"}, "没设": {"en": "unset", "ja": "未設定"}, "逗号分隔": {"en": "comma separated", "ja": "カンマ区切り"}, "另有 {n} 个参数这个表单认不出形状，只能在下面的 JSON 里改": {"en": "{n} more parameters have a shape this form does not recognise — edit them in the JSON below", "ja": "他に {n} 個のパラメータはこのフォームが形を認識できません——下の JSON で編集してください"}, "保存会产生新版本;已完成的运行仍指向它当时用的版本。改完可直接「只跑此节点」。": {"en": "Saving creates a new version; finished runs keep pointing at the version they used. After saving, 'Run this node' re-runs it alone.", "ja": "保存すると新しいバージョンになります。完了済みの実行は当時のバージョンを指したままです。"}, "环境/模型故障,不是产品缺陷:": {"en": "environment/model failure, not a product defect:", "ja": "環境・モデル障害（製品の不具合ではありません）:"}, "这次没有判决，别改任何东西——环境的问题，重跑就是了": {"en": "no verdict this time. Change nothing — it was the environment; just run it again", "ja": "判定なし。何も変えず再実行してください（環境の問題）"}, "已经重新排上了": {"en": "queued again", "ja": "再度キューに入れました"}, "没排上——网关那边可能不在": {"en": "could not queue it — the gateway may be down", "ja": "キューに入りませんでした（ゲートウェイ停止の可能性）"}, "去改这一句措辞": {"en": "Fix the wording", "ja": "文言を直す"}, "模型没能把这句话落到页面上。多半是写成了目标而不是动作——改措辞，别改断言": {"en": "the model could not ground this sentence in the page — usually a goal written where an action belongs. Fix the wording, not the assertion", "ja": "この文をページ上に落とせませんでした。多くは動作ではなく目標として書かれています——文言を直してください"}, "看断言与实际": {"en": "Compare assertion and reality", "ja": "アサーションと実際を見る"}, "这是一个判决，重跑只会得到同一个。要么产品错了，要么断言错了": {"en": "this is a verdict; rerunning returns the same one. Either the product is wrong or the assertion is", "ja": "これは判定です。再実行しても同じ結果。製品かアサーションのどちらかが誤りです"}, "链上 / Dapp 测试配置": {"en": "Web3 / dapp testing", "ja": "Web3 / dapp テスト"}, "配置测试链、RPC 与钱包,用于测试 Web3 dapp(连接钱包、签名、发交易)。": {"en": "Configure the test chain, RPC, and wallet used to test Web3 dapps (connect, sign, send transactions).", "ja": "Web3 dapp テスト（接続・署名・送信）に使うテストチェーン、RPC、ウォレットを設定します。"}, "测试钱包": {"en": "Test wallet", "ja": "テストウォレット"}, "如何测试一个 dapp": {"en": "How to test a dapp", "ja": "dapp のテスト方法"}, "TestPilot 不部署 dapp/链。你提供 dapp 地址 + 一条链 RPC(你的 fork / Tenderly 虚拟测试网 / 公共测试网),平台自动注入一个受控钱包连上去。": {"en": "TestPilot does NOT deploy the dapp/chain. You bring the dapp URL + one chain RPC (your fork / Tenderly Virtual TestNet / a public testnet); the platform injects a controllable wallet against it.", "ja": "TestPilot は dapp/チェーンをデプロイしません。dapp URL + チェーン RPC（自分の fork / Tenderly 仮想 TestNet / 公開テストネット）を用意すれば、制御可能なウォレットを注入します。"}, "新建项目,目标 URL 填你的 dapp(生产 / staging / 你自己的部署)。": {"en": "Create a project with your dapp's URL (prod / staging / your own deployment).", "ja": "プロジェクトを作成し、目標 URL に dapp を設定（本番 / staging / 自分のデプロイ）。"}, "在下方「链 / RPC」配置你的链 —— 本地 fork、Tenderly、或测试网。": {"en": "Configure your chain in Chain / RPC below — a local fork, Tenderly, or a testnet.", "ja": "下の「チェーン / RPC」でチェーンを設定 —— ローカル fork、Tenderly、テストネット。"}, "在用例上选钱包模式(注入式虚拟钱包,无头推荐);钱包自动确认连接/签名/交易。": {"en": "On a case, pick a wallet mode (injected virtual wallet, headless); it auto-confirms connect/sign/tx.", "ja": "ケースでウォレットモードを選択（インジェクト仮想ウォレット推奨）。接続/署名/取引を自動承認。"}, "探索页开「Dapp 模式」→ AI 生成 web3 用例(连接 / 交易 / 断言,含链上校验)。": {"en": "On Explore, toggle 'Dapp mode' → the AI generates web3 cases (connect / tx / assert) with on-chain checks.", "ja": "探索で「Dapp モード」→ AI が web3 ケース（接続 / 取引 / 検証）をオンチェーン検証付きで生成。"}, "运行 → UI 断言 + 链上断言(余额/回执)双重校验;进套件、门禁、趋势。": {"en": "Run → verified by both the UI assertion and on-chain assertions (balance/receipt); feeds suites, gate, trends.", "ja": "実行 → UI アサーション + オンチェーンアサーション（残高/receipt）で二重検証。スイート・ゲート・トレンドに連動。"}, "注意:你的 dapp UI 需从注入的钱包 provider 读取余额/状态。像 Uniswap 生产版从自家后端读余额,在 fork 上 UI 交易会显示「资金不足」—— 这类请用链上断言(校验合约结果),或指向你自己的部署 / 能读 provider 的界面。": {"en": "Note: your dapp UI must read balances/state from the injected wallet provider. Some apps (e.g. Uniswap prod) read balances from their own backend, so on a fork the UI swap shows 'insufficient funds' — for those, rely on on-chain assertions, or point at your own deployment / a provider-reading UI.", "ja": "注意：dapp UI は注入されたウォレット provider から残高/状態を読む必要があります。Uniswap 本番など一部は自社バックエンドから残高を読むため、fork では UI 取引が「残高不足」になります。その場合はオンチェーンアサーション、または自分のデプロイ / provider を読む UI を使用してください。"}, "加载 Uniswap 示例": {"en": "Load Uniswap example", "ja": "Uniswap の例を読み込む"}, "已创建示例项目 + 用例": {"en": "Example project + cases created", "ja": "例のプロジェクト + ケースを作成しました"}, "示例项目已存在,已进入": {"en": "Example already exists — opened it", "ja": "例は既に存在 — 開きました"}, "注入式虚拟钱包": {"en": "Injected virtual wallet", "ja": "インジェクト仮想ウォレット"}, "默认": {"en": "default", "ja": "デフォルト"}, "无需扩展、可无头运行:向页面注入 window.ethereum,由受控私钥自动确认连接 / 签名 / 交易,指向上面配置的 RPC。点下面按钮做一次真实验证(连接 → 发一笔真交易 → 校验链上回执)。": {"en": "No extension, headless-friendly: injects window.ethereum backed by a controllable key that auto-confirms connect / sign / tx, pointed at the RPC above. The button below runs a real proof (connect → send a real tx → verify the on-chain receipt).", "ja": "拡張不要・ヘッドレス対応：window.ethereum を注入し、制御可能な鍵で接続 / 署名 / 送信を自動承認、上記の RPC を使用。下のボタンで実証（接続 → 実トランザクション送信 → オンチェーン receipt 検証）。"}, "验证(发一笔真实交易)": {"en": "Verify (send a real tx)", "ja": "検証（実トランザクション送信）"}, "启动浏览器 + 虚拟钱包,发交易中…": {"en": "Launching browser + virtual wallet, sending tx…", "ja": "ブラウザ + 仮想ウォレット起動、送信中…"}, "交易已上链 ✓": {"en": "Transaction mined ✓", "ja": "トランザクション採掘 ✓"}, "账户": {"en": "Account", "ja": "アカウント"}, "连接": {"en": "Connect", "ja": "接続"}, "交易": {"en": "Tx", "ja": "Tx"}, "上链": {"en": "Mined", "ja": "採掘"}, "MetaMask 扩展": {"en": "MetaMask extension", "ja": "MetaMask 拡張"}, "有头模式加载真实 MetaMask,用于必须走扩展 UI 的流程。需先安装并 onboard 测试钱包。点下面按钮验证扩展是否加载。": {"en": "Loads the real MetaMask (headed) for flows that require the extension UI. Requires the wallet installed + onboarded. The button below checks that the extension loads.", "ja": "拡張 UI が必要なフロー用に実際の MetaMask をヘッド付きで読み込み。ウォレットのインストールと onboard が必要。下のボタンで読み込みを確認。"}, "验证 MetaMask": {"en": "Check MetaMask", "ja": "MetaMask を確認"}, "已加载": {"en": "Loaded", "ja": "読み込み済み"}, "未安装": {"en": "not installed", "ja": "未インストール"}, "所有项目": {"en": "All projects", "ja": "すべてのプロジェクト"}, "切换项目": {"en": "Switch project", "ja": "プロジェクトを切り替え"}, "进入": {"en": "Enter", "ja": "開く"}, "Qwen-VL 未测试": {"en": "Qwen-VL not tested", "ja": "Qwen-VL 未テスト"}, "正在测试连接…": {"en": "Testing connection…", "ja": "接続テスト中…"}, "Qwen-VL 已连接": {"en": "Qwen-VL connected", "ja": "Qwen-VL 接続済み"}, "连接失败": {"en": "Connection failed", "ja": "接続失敗"}, "非多模态": {"en": "Not multimodal", "ja": "マルチモーダル非対応"}, "未运行": {"en": "Not run", "ja": "未実行"}, "有代码": {"en": "Code", "ja": "コード"}, "开始探索": {"en": "Start explore", "ja": "探索を開始"}, "导出测试": {"en": "Export tests", "ja": "テストを書き出す"}, "运行全部 P0": {"en": "Run all P0", "ja": "P0 を全実行"}, "运行套件": {"en": "Run suite", "ja": "スイートを実行"}, "生成": {"en": "Generate", "ja": "生成"}, "重新生成": {"en": "Regenerate", "ja": "再生成"}, "删除": {"en": "Delete", "ja": "削除"}, "接受": {"en": "Accept", "ja": "適用"}, "问 AI": {"en": "Ask AI", "ja": "AI に依頼"}, "复制": {"en": "Copy", "ja": "コピー"}, "浅色": {"en": "Light theme", "ja": "ライトテーマ"}, "深色": {"en": "Dark theme", "ja": "ダークテーマ"}, "语言": {"en": "Language", "ja": "言語"}, "主题": {"en": "Theme", "ja": "テーマ"}, "停止": {"en": "Stop", "ja": "停止"}, "添加": {"en": "Add", "ja": "追加"}, "生成中…": {"en": "Generating…", "ja": "生成中…"}, "加载中…": {"en": "Loading…", "ja": "読み込み中…"}, "未选择项目": {"en": "No project selected", "ja": "プロジェクト未選択"}, "复制代码": {"en": "Copy code", "ja": "コードをコピー"}, "已隔离": {"en": "quarantined", "ja": "隔離済み"}, "已隔离的用例仍会运行，但不会阻断 CI 门禁。": {"en": "Quarantined cases run but don't block the CI gate.", "ja": "隔離されたケースは実行されますが、CI ゲートをブロックしません。"}, "预期（断言）": {"en": "Expected (oracle)", "ja": "期待値（オラクル）"}, "生成的代码": {"en": "Generated code", "ja": "生成されたコード"}, "尚未定义断言。": {"en": "No assertion defined yet.", "ja": "アサーションはまだ定義されていません。"}, "（尚无断言）": {"en": "(no assertion yet)", "ja": "（アサーションなし）"}, "尚无代码，可从步骤生成。": {"en": "No code yet. Generate from steps.", "ja": "コードはまだありません。ステップから生成してください。"}, "最近一次运行": {"en": "Last run", "ja": "最新の実行"}, "环境变量": {"en": "Environment variables", "ja": "環境変数"}, "密钥": {"en": "API key", "ja": "APIキー"}, "绑定环境": {"en": "Environment", "ja": "環境"}, "尚无测试数据。用下方「问 AI · 数据」按需添加账号 / 取值 / 参数。": {"en": "No test data. Use “Ask AI · Data” below to add accounts / values / parameters.", "ja": "テストデータなし。下部の「AI に依頼 · データ」でアカウント/値/パラメータを追加できます。"}, "尚无步骤 —— 该用例仅做断言（如复用登录态直接校验页面）。": {"en": "No steps — this case only asserts (e.g. reuses a session and checks the page directly).", "ja": "ステップなし —— このケースはアサーションのみ（セッション再利用でページを直接検証など）。"}, "Web3 运行": {"en": "Web3 run", "ja": "Web3 実行"}, "不使用钱包（普通网页）": {"en": "No wallet (normal web)", "ja": "ウォレットなし（通常）"}, "注入式虚拟钱包（无头,推荐）": {"en": "Injected virtual wallet (headless)", "ja": "インジェクト仮想ウォレット（ヘッドレス）"}, "MetaMask 扩展（有头）": {"en": "MetaMask extension (headed)", "ja": "MetaMask 拡張（ヘッド付き）"}, "选钱包后,运行会注入该钱包(链/RPC 取自「链上测试」全局配置)并等待 dapp 就绪。链/RPC 在链上测试页配置。": {"en": "With a wallet selected, the run injects it (chain/RPC from the global Web3 config) and waits for the dapp to settle. Configure chain/RPC on the Web3 page.", "ja": "ウォレットを選ぶと、実行時に注入（チェーン/RPC はグローバル Web3 設定から）し dapp の準備を待ちます。チェーン/RPC は Web3 ページで設定。"}, "链上断言（步骤后校验真实链状态）": {"en": "On-chain assertions (verify real chain state after the steps)", "ja": "オンチェーンアサーション（ステップ後に実状態を検証）"}, "ERC-20 余额": {"en": "ERC-20 balance", "ja": "ERC-20 残高"}, "原生余额 (ETH)": {"en": "Native balance (ETH)", "ja": "ネイティブ残高 (ETH)"}, "账户 0x…（留空=测试钱包）": {"en": "account 0x… (blank = test wallet)", "ja": "アカウント 0x…（空=テストウォレット）"}, "钱包发出成功交易": {"en": "Wallet sent a successful tx", "ja": "ウォレットが成功トランザクションを送信"}, "断言本次 UI 操作让测试钱包发出 ≥N 笔已上链成功的交易（最终真值，不依赖读 dapp 成功提示）。": {"en": "Assert the UI interaction made the test wallet send ≥N mined, successful txs — the ground truth, no need to read the dapp's success UI.", "ja": "UI操作でテストウォレットが≥N件のマイニング成功トランザクションを送信したことを検証（dappの成功表示に依存しない最終真値）。"}, "数据驱动": {"en": "Data-driven", "ja": "データ駆動"}, "绑一个数据集：每行跑一次。步骤 / 断言里用 ${row.列名} 取值，导出后会变成真的取值表达式。标了唯一的列每次运行自动加后缀，所以跑第二遍不会撞已存在。": {"en": "Bind a dataset: one run per row. Use ${row.col} in steps/assertions — the export turns it into a real value lookup. Columns marked unique get a per-run suffix, so a second run does not collide with the first.", "ja": "データセットをバインド：1 行につき 1 回実行。ステップ / アサーションでは ${row.col} を使用し、エクスポート時に実際の値の参照になります。ユニーク指定した列には実行ごとの接尾辞が付くため、2 回目の実行でも衝突しません。"}, "AI 优化失败 — 请换个说法重试。": {"en": "AI refine failed — try rephrasing.", "ja": "AI の調整に失敗しました — 表現を変えて再試行してください。"}, "告诉 AI 如何修改这些步骤…": {"en": "Tell AI how to change these steps…", "ja": "これらのステップの変更方法を AI に伝えてください…"}, "告诉 AI 如何修改这条断言…": {"en": "Tell AI how to change this assertion…", "ja": "このアサーションの変更方法を AI に伝えてください…"}, "增加一个等待": {"en": "Add a wait", "ja": "待機を追加"}, "让定位更稳健": {"en": "Make locators more robust", "ja": "ロケーターをより堅牢に"}, "拆分为两步": {"en": "Split into two steps", "ja": "2 つのステップに分割"}, "更具体一些": {"en": "Make it more specific", "ja": "より具体的に"}, "断言可见文本": {"en": "Assert on visible text", "ja": "表示テキストを検証"}, "检查错误提示": {"en": "Check for an error toast", "ja": "エラートーストを確認"}, "用锁定用户账号": {"en": "Use a locked-out account", "ja": "ロックされたアカウントを使用"}, "用空邮箱": {"en": "Empty email", "ja": "空のメールアドレス"}, "参数化邮箱": {"en": "Parametrize the email", "ja": "メールアドレスをパラメータ化"}, "断言": {"en": "Assertion", "ja": "アサーション"}, "告诉 AI 如何调整测试数据 / 输入…": {"en": "Tell AI how to adjust the test data / inputs…", "ja": "テストデータ / 入力の調整方法を AI に伝えてください…"}, "调试": {"en": "Debug", "ja": "デバッグ"}, "实时调试": {"en": "Live debug", "ja": "ライブデバッグ"}, "调试中…": {"en": "Debugging…", "ja": "デバッグ中…"}, "执行计划": {"en": "Plan", "ja": "プラン"}, "登录": {"en": "Login", "ja": "ログイン"}, "等待调试流…": {"en": "Waiting for the debug stream…", "ja": "デバッグストリームを待機中…"}, "暂无截图": {"en": "No screenshot yet", "ja": "スクリーンショットなし"}, "调试通过": {"en": "Debug passed", "ja": "デバッグ成功"}, "调试失败": {"en": "Debug failed", "ja": "デバッグ失敗"}, "模型 / 基础设施错误": {"en": "Model / infra error", "ja": "モデル / インフラエラー"}, "调试流已结束 / 连接丢失": {"en": "Debug stream ended / connection lost", "ja": "デバッグストリームが終了 / 接続が失われました"}, "带提示重跑": {"en": "Retry with hint", "ja": "ヒント付きで再実行"}, "输入提示词，如：登录按钮在右上角，先滚动到它…": {"en": "Type a prompt, e.g. the login button is top-right, scroll to it first…", "ja": "プロンプトを入力（例：ログインボタンは右上、まずスクロール）…"}, "「带提示重跑」= 把提示作为引导临时重跑;「用 AI 修正」= 让 AI 据此改写失败节点并存回用例。": {"en": "“Retry with hint” re-runs once with the prompt as guidance. “Fix with AI” rewrites the failing node from the prompt and saves it to the case.", "ja": "「ヒント付きで再実行」はヒントを手掛かりに一度だけ再実行。「AI で修正」は失敗ノードを書き換えてケースに保存します。"}, "用 AI 修正这一步": {"en": "Fix this step with AI", "ja": "このステップを AI で修正"}, "用 AI 修正断言": {"en": "Fix the assertion with AI", "ja": "アサーションを AI で修正"}, "该失败在登录流程步骤上(属于环境登录态),无法就地改写;可用「带提示重跑」引导。": {"en": "This failed on a login-flow step (the environment's login state) — it can't be rewritten here; use “Retry with hint”.", "ja": "この失敗はログインフロー(環境のログイン状態)で発生したため、ここでは書き換えできません。「ヒント付きで再実行」をご利用ください。"}, "接受并重跑": {"en": "Accept & re-run", "ja": "適用して再実行"}, "失败节点": {"en": "Failed at", "ja": "失敗ノード"}, "直接重试": {"en": "Retry", "ja": "再試行"}, "让 AI 改什么？": {"en": "What should AI change?", "ja": "AI に何を変更させますか？"}, "仅重试": {"en": "Retry only", "ja": "再実行のみ"}, "用 AI 改写步骤": {"en": "Rewrite steps with AI", "ja": "AI でステップを書き換え"}, "用 AI 改写断言": {"en": "Rewrite assertion with AI", "ja": "AI でアサーションを書き換え"}, "把提示作为实时引导跑一次 —— 不改用例、不保存。适合断言失败其实是环境或前面步骤没到位时。": {"en": "Runs once with your prompt as live guidance — nothing is saved. Best when the assertion failed because of the environment or an earlier step.", "ja": "プロンプトをライブガイドとして1回実行 —— 保存しません。環境や前のステップが原因でアサーションが失敗した場合に最適。"}, "根据提示改写步骤并存回用例(例如：改用逐字符键盘输入、换更稳的定位)。": {"en": "Rewrites the steps from your prompt and saves them to the case (e.g. type character-by-character, use a sturdier locator).", "ja": "プロンプトからステップを書き換えてケースに保存します(例：一文字ずつ入力、より堅牢なロケーター)。"}, "根据提示改写断言并存回用例 —— 仅当断言本身写错时才用(会改变用例验证的内容)。": {"en": "Rewrites the assertion and saves it — use only if the assertion itself is wrong (this changes what the test verifies).", "ja": "アサーションを書き換えて保存 —— アサーション自体が誤っている場合のみ(検証内容が変わります)。"}, "修正并重跑": {"en": "Correct & re-run", "ja": "修正して再実行"}, "临时": {"en": "Transient", "ja": "一時的"}, "存回用例": {"en": "Saved to case", "ja": "ケースに保存"}, "运行总数": {"en": "Total runs", "ja": "実行回数"}, "通过率": {"en": "Pass", "ja": "合格率"}, "P0 通过率": {"en": "P0 pass rate", "ja": "P0 成功率"}, "平均耗时": {"en": "Avg duration", "ja": "平均所要時間"}, "暂无运行记录": {"en": "No runs yet", "ja": "実行履歴なし"}, "运行一些用例即可在此查看结果和报告。": {"en": "Run some cases to see results and reports here.", "ja": "ケースを実行すると、ここに結果とレポートが表示されます。"}, "这次失败是环境造成的——模型不可达、浏览器崩了、网络断了。它说明不了产品的任何事，所以不算进通过率。": {"en": "This failure was environmental — the model was unreachable, the browser died, the network dropped. It says nothing about the product, so it is left out of the pass rate.", "ja": "この失敗は環境要因です——モデル到達不可、ブラウザ異常終了、ネットワーク断。製品については何も語らないため、合格率から除外されます。"}, "已排除 {n} 次环境失败": {"en": "{n} environmental failures excluded", "ja": "環境要因 {n} 件を除外"}, "全部来源": {"en": "any origin", "ja": "すべての由来"}, "单跑": {"en": "single", "ja": "単発"}, "作为套件批次的一部分跑的——看板已认可的用例。": {"en": "Ran as part of a suite batch — a case the board had accepted.", "ja": "スイートバッチの一部として実行——ボードが承認済みのケース。"}, "单独跑的一条看板用例。": {"en": "A single board case, run on its own.", "ja": "ボードのケースを単独で実行。"}, "生成过程中跑的候选用例，当时还没有人批准它。修复环每修一次就会再跑一次，所以同一条会出现多行。": {"en": "A candidate run during generation, before anyone approved it. The repair loop runs it again after each fix, so one case appears on several rows.", "ja": "生成中に実行された候補ケース（未承認）。修復ループは修正ごとに再実行するため、同一ケースが複数行に現れる。"}, "没有符合此筛选的运行。": {"en": "No runs match this filter.", "ja": "このフィルターに一致する実行はありません。"}, "功能断言": {"en": "Functional oracle", "ja": "機能オラクル"}, "性能": {"en": "Performance", "ja": "パフォーマンス"}, "视觉基线": {"en": "Visual baseline", "ja": "ビジュアルベ
