<style>

x 0 4px 18px;margin:16px 0}.mono,code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;overflow-wrap:anywhere}code{background:var(--soft);padding:2px 5px;border-radius:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.old{border-top:3px solid #b56556}.new{border-top:3px solid var(--green)}label{display:block;margin:14px 0 6px;font-size:13px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);padding:10px}input[readonly]{background:#f5f6f3}textarea{min-height:105px;resize:vertical}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:13px 9px;vertical-align:top}th{color:var(--muted);font-weight:500}ul{padding-left:22px}li{margin:7px 0}.nodegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.node{padding:15px;min-width:0;border:1px solid var(--line);border-radius:7px;background:white}.node.selected{border:2px solid var(--green);padding:14px;background:var(--soft)}.node label{margin:0;display:flex;align-items:center;gap:8px}.node button{display:block;text-align:left;width:100%;padding:8px 0;border:0;background:none}.node strong{display:block}.node small{color:var(--muted);display:block}.node em{font-size:11px;font-style:normal}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:15px}.notice{font-size:12px;padding:12px 0;color:var(--muted)}.empty{text-align:center;border:1px dashed var(--line);padding:48px 20px}.statline{display:flex;gap:25px;flex-wrap:wrap;color:var(--muted);font-size:13px}.statline strong{color:var(--ink)}#live{position:fixed;bottom:20px;right:24px;background:var(--ink);color:white;border-radius:6px;padding:12px 20px;max-width:480px;z-index:5}#live:empty{display:none}.tablewrap{overflow:auto}.tip{font-size:13px;color:var(--muted);margin-top:20px}@media(max-width:1100px){.grid{grid-template-columns:1fr}.grid>.stack{display:grid;grid-template-columns:1fr 1fr}}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{height:auto;position:static;padding:16px}.project,aside footer{display:none}nav{flex-direction:row;overflow-x:auto;margin-top:12px}nav button{white-space:nowrap}main{padding:22px 18px}.top{padding:12px 18px}.modulegrid,.split,.fieldrow,.grid>.stack{grid-template-columns:1fr}.nodegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:flex-start;flex-direction:column}h1{font-size:27px}}@media print{aside,.top,#live{display:none}.shell{display:block}main{padding:0}.panel{break-inside:avoid}}
</style></head><body><div class="shell"><aside><div class="brand">TestPilot<small>TEST GENERATION HARNESS</small></div><div class="project"><strong>衍生品演示项目</strong><small>本地 fixture · 产品快照 v2</small></div><nav aria-label="原型功能"><button data-nav="structure">产品与测试结构</button><button data-nav="workflow">Workflow 调试</button><button data-nav="assets">Role 与 Skill</button><button data-nav="domain">领域知识</button><button data-nav="research">研究与进化</button><button data-nav="settings">设置与宿主接入</button></nav><footer>研究目标<br>可信用例 · 独立判据 · 受控适应<br><a href="testpilot-ui-research-review-2026-09-09.html">返回评审报告 ↗</a></footer></aside><div><header class="top"><span>项目工作区 / 衍生品演示项目</span><span class="badge amber">交互原型 · 全部结构数据为演示</span></header><main id="main"></main></div></div><div id="live" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modules=[{id:'orders',name:'订单',desc:'下单、精度与订单生命周期',stories:['quantity','price']},{id:'risk',name:'持仓与风险',desc:'杠杆、保证金与只减仓',stories:[]},{id:'assets',name:'账户资产',desc:'可用余额、资产与结算',stories:[]},{id:'market',name:'市场数据',desc:'行情时效与价格来源',stories:[]}];
const stories={quantity:{title:'按正确步长提交订单数量',actor:'交易用户',goal:'提交符合产品规则的数量',benefit:'避免非预期的持仓敞口',rule:'D-QTY-01',accept:'输入 0.0016，步长 0.001 时，本 fixture 按规则向下截断为 0.001。',cases:['truncate','boundary']},price:{title:'拒绝超出价格保护范围的订单',actor:'交易用户',goal:'得到清楚的拒单原因',benefit:'避免错误价格订单进入撮合',rule:'D-PRICE-01',accept:'边界及超边界行为须按冻结的产品规则分别验证。',cases:[]}};
const cases={truncate:{title:'超出步长的数量按规则截断',method:'边界值',input:'0.0016',expected:'0.001',status:'需重审'},boundary:{title:'恰好一个步长的数量保持不变',method:'等价类边界',input:'0.001',expected:'0.001',status:'待审'}};
const nodes=[['materials','材料冻结','程序','材料快照'],['domain','领域理解','规划模型','领域包 · v2'],['stories','用户故事','规划模型','testpilot-stories · v1'],['cases','用例设计','规划模型','testpilot-design · v1'],['gate','设计门禁','程序','规则校验'],['review','人工审核','人类','不可跳过'],['compile','执行编译','程序','g2 · v1'],['execute','执行与判据','执行模型 / 程序','Midscene + oracle'],['report','报告','程序','结构投影']];
let tab='structure',level='project',moduleId='orders',storyId='quantity',caseId='truncate',showEvidence=false,editing=false,draft='',savedDraft='',host=false,nodeFocus='cases',selection=new Set(['cases']),mode='only',reuse=true,preview=false;
function ping(t){$('#live').textContent=t;setTimeout(()=>$('#live').textContent='',4500)}
function heading(k,t,p,actions=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="lede">${p}</p></div>${actions}</div>`}
function crumb(){let a='<button data-level="project">产品全貌</button>';if(level!=='project')a+=`<span>›</span><button data-level="module">${modules.find(m=>m.id===moduleId).name}</button>`;if(['story','case'].includes(level))a+=`<span>›</span><button data-level="story">${esc(stories[storyId].title)}</button>`;if(level==='case')a+='<span>› 用例详情</span>';return '<div class="crumb" aria-label="层级导航">'+a+'</div>'}
function structure(){const m=modules.find(x=>x.id===moduleId),s=stories[storyId],c=cases[caseId];let content='';if(level==='project')content=heading('PRODUCT STRUCTURE','先看全貌，再看每条依据','模块 → 用户故事 → 验收条件 → 用例 → 判据与执行证据。点击“订单”开始。')+`<div class="grid"><section class="panel"><div class="row"><h2 style="margin:0">产品模块</h2><span class="badge green">演示快照 v2</span></div><div class="modulegrid">${modules.map((m,i)=>`<button class="module" data-module="${m.id}"><span class="eyebrow">MODULE 0${i+1}</span><span class="arrow">↗</span><strong>${m.name}</strong><small>${m.desc}</small><div class="counts"><span><b>${m.stories.length}</b>故事</span><span><b>${m.id==='orders'?2:0}</b>演示用例</span><span><b>${m.id==='orders'?'待审':'—'}</b>${m.id==='orders'?'当前状态':'尚未整理'}</span></div></button>`).join('')}</div><p class="tip">这些是原型示例计数，不是当前项目质量或完成度。未建立关系的模块保持未知。</p></section><div class="stack"><section class="panel"><h2>从待办进入</h2><button class="item" data-case="truncate"><strong>数量规则变更，需重审</strong><small>查看差异与受影响判据 →</small></button><button class="item" data-story="price"><strong>价格保护缺少用例</strong><small>从验收条件定位缺口 →</small></button></section><section class="panel"><h2>同一份事实</h2><p>Web 与宿主共享项目、运行和修订。每个批准与结论都引用明确版本。</p><button data-nav="workflow">查看节点如何生成它 →</button></section></div></div>`;
else if(level==='module')content=heading('MODULE',m.name,m.desc)+`<div class="grid"><section class="panel"><h2>关键用户流程</h2><div class="journey"><div>选择产品</div><span>→</span><div>输入订单</div><span>→</span><div>规则校验</div><span>→</span><div>订单反馈</div></div><h2>用户故事</h2>${m.stories.length?m.stories.map(id=>`<button class="item" data-story="${id}"><strong>${stories[id].title} ↗</strong><small>${stories[id].cases.length} 条演示用例 · ${stories[id].rule} · ${stories[id].cases.length?'等待审阅':'覆盖缺口'}</small></button>`).join(''):'<div class="empty">尚未整理本模块的故事。<br>实现后可导入材料或建立关联。</div>'}</section><div class="stack"><section class="panel"><h2>材料与适用范围</h2><div class="evidence">演示产品规范 v2<br><small>本地 fixture，非交易所通用规则</small></div><button data-nav="domain">领域规则与来源 ↗</button></section><section class="panel"><h2>审阅次序</h2><p>先核对产品范围，再核对故事的用户目标，最后检查用例与判据。</p></section></div></div>`;
else if(level==='story')content=heading('USER STORY',s.title,`作为${s.actor}，我要${s.goal}，以便${s.benefit}。`)+`<div class="grid"><section class="panel"><h2>验收条件</h2><div class="evidence">${s.accept}</div><div class="row"><span class="badge">来源：演示规范 v2 §2</span><button data-nav="domain">${s.rule} ↗</button></div><h2 style="margin-top:28px">用例与覆盖</h2>${s.cases.length?s.cases.map(id=>`<button class="item" data-case="${id}"><strong>${cases[id].title} ↗</strong><small>${cases[id].method} · 程序判据 · ${cases[id].status}</small></button>`).join(''):'<div class="empty">当前没有关联用例。<br>零用例不等于该规则已被测试。</div>'}</section><div class="stack"><section class="panel"><h2>这条故事如何产生</h2><p>订单模块 → 领域规则 → 用户故事节点 → 当前故事修订。</p><button data-nav="workflow">查看 role / skill 与输入 →</button></section><section class="panel"><h2>修订影响</h2><p>修改验收条件会使下游用例进入需重审；历史执行保持原版本。</p></section></div></div>`;
else content=heading('TEST CASE',c.title,'用例身份、来源、版本与运行依据放在同一处。',`<span class="badge amber">${savedDraft?'本地草稿 · 未提交':c.status} · 演示</span>`)+`<div class="grid"><section class="panel"><div class="statline"><span>来源故事 <strong>${s.title}</strong></span><span>用例修订 <strong>v2</strong></span></div><div class="journey"><div>输入 ${c.input}</div><span>→</span><div>提交订单</div><span>→</span><div>读取订单数量</div></div><h2>原始预期与判据</h2><p>API 返回的数量应为 <code>${c.expected}</code>，单位 BTC；使用精确十进制比较。接口数据缺失时返回缺证，不作为通过。</p><div class="row"><button id="edit-case">${editing?'关闭修订':'修订与影响预览'}</button><button id="show-evidence">${showEvidence?'收起证据':'查看执行证据'}</button></div>${editing?`<div class="split" style="margin-top:20px"><section class="panel old"><h3>冻结原版 v2</h3><p>期望数量 ${c.expected} BTC</p><small>旧判据和结果保留</small></section><section class="panel new"><h3>本地草稿</h3><label for="draft">修订说明 / 预期</label><textarea id="draft">${esc(draft||`期望数量 ${c.expected} BTC；补充订单 ID 一致性校验。`)}</textarea><button id="save-draft">保存原型草稿</button></section></div><div class="note" style="margin-top:16px">影响预览（演示）：当前用例 → 执行编译 → 下一次执行。新草稿需要重新审核；历史证据继续引用 v2。这里不会写服务或作人工批准。</div>`:''}${savedDraft?`<div class="evidence"><strong>草稿内容</strong><p>${esc(savedDraft)}</p></div>`:''}${showEvidence?`<section class="panel" style="margin-top:20px"><h2>执行证据 · 示意记录</h2><table><tr><th>输入</th><td>${c.input}</td></tr><tr><th>观察值</th><td>${caseId==='truncate'?'0.002':'0.001'} BTC</td></tr><tr><th>期望</th><td>${c.expected} BTC</td></tr><tr><th>结论</th><td>${caseId==='truncate'?'不一致：取整方向错误':'一致'}</td></tr><tr><th>绑定</th><td>演示 run / attempt 1 / case v2 / SUT buggy-v1</td></tr></table><p class="tip">本表用于解释交互。实际项目证据请查看评审报告及原始 N 系列记录。</p></section>`:''}</section><div class="stack"><section class="panel"><h2>追溯链</h2><div class="evidence">演示规范 v2 §2</div><div class="evidence">D-QTY-01 数量步长</div><div class="evidence">故事 → 验收条件 → 用例 v2</div><button data-nav="domain">查看领域依据 →</button></section><section class="panel"><h2>下一步</h2><p>判据问题回到设计节点；定位问题查看执行节点；产品缺陷另建修复任务后按原判据复测。</p><button data-nav="workflow">定位到节点调试 →</button></section></div></div>`;return crumb()+content}
function workflow(){const n=nodes.find(n=>n[0]===nodeFocus),ids=[...selection];return heading('WORKFLOW STUDIO','默认模板可以重组','此处模拟节点选择与调试范围。正式实现将冻结定义、输入、权限和每次尝试。',`<span class="badge">衍生品测试模板 · 草稿 v3</span>`)+`<div class="grid"><section><div class="panel"><div class="fieldrow"><div><label for="mode">调试范围</label><select id="mode"><option value="only" ${mode==='only'?'selected':''}>单节点</option><option value="selected" ${mode==='selected'?'selected':''}>选中多个节点</option><option value="full" ${mode==='full'?'selected':''}>全流程</option></select></div><div><label>输入策略</label><label><input type="checkbox" id="reuse" ${reuse?'checked':''}> 复用匹配的冻结上游</label></div></div><div class="nodegrid">${nodes.map((n,i)=>`<div class="node ${selection.has(n[0])?'selected':''}"><label><input type="checkbox" data-check="${n[0]}" ${selection.has(n[0])?'checked':''} ${mode==='full'?'disabled':''}> <span class="mono">${String(i+1).padStart(2,'0')}</span></label><button data-node="${n[0]}"><strong>${n[1]} ↗</strong><small>${n[2]}</small><em>${n[3]}</em></button></div>`).join('')}</div><p class="tip">依赖示意：材料 → 领域 → 故事 → 用例 → 门禁 → 人审 → 编译 → 执行 → 报告。模板编辑由版本目录进入，不能删除强制门禁。</p><button class="primary" id="preview-run">预览调试计划</button>${preview?`<div class="note" style="margin-top:18px"><strong>${!ids.length?'没有选择节点':ids.includes('review')?'包含人工审核：运行将在此等待真实决定':!reuse&&ids.some(x=>nodes.findIndex(n=>n[0]===x)>0&&!selection.has(nodes[nodes.findIndex(n=>n[0]===x)-1][0]))?'阻塞：缺少上游输入':'可以创建新的调试尝试（演示）'}</strong><p>选中 ${ids.length} 个节点：${ids.map(x=>nodes.find(n=>n[0]===x)[1]).join('、')||'—'}。${reuse?'复用冻结快照，仍须校验版本与审批。':'不复用；必须满足全部上游依赖。'}</p>本原型没有执行按钮，不发送模型请求，不产生费用。</div>`:''}</div></section><section class="panel"><span class="eyebrow">NODE INSPECTOR</span><h2>${n[1]}</h2><div class="evidence">Role：${n[2]}<br>Skill / 能力：${n[3]}<br>来源：模板草稿 v3</div><h3>输入与输出</h3><p>冻结上游 revision → 当前节点 → 新产物 revision。</p><h3>尝试记录</h3><p>attempt 1 与 attempt 2 分开留痕；成本累计，失败不删。</p><button data-nav="assets">管理 role / skill →</button><p class="tip">正式实现的面板将提供输入、输出、差异、日志、预算和恢复条件。</p></section></div>`}
function assets(){return heading('CAPABILITY REGISTRY','Role 与 Skill 各司其职','角色定义责任；技能定义可复用方法；模型绑定说明由谁计算。这里展示拟议管理信息。')+`<div class="split"><section class="panel"><h2>角色目录 · 演示</h2><table><tr><th>角色</th><th>职责 / 计算来源</th></tr><tr><td>领域测试设计者</td><td>解析需求、构造边界；宿主或 Web planner</td></tr><tr><td>执行者</td><td>视觉定位与动作；Midscene executor</td></tr><tr><td>判据校验者</td><td>确定性代码</td></tr><tr><td>审阅者</td><td>实际人类，批准具体 revision</td></tr></table></section><section class="panel"><h2>技能目录 · 演示版本</h2><label for="skill-pick">选择技能</label><select id="skill-pick"><option>testpilot-design</option><option>testpilot-stories</option><option>derivatives-domain-pack</option></select><div id="skill-detail" class="evidence">testpilot-design · v1<br>输入：故事和领域规则<br>输出：用例 bundle<br>引用：用例设计节点</div><button id="skill-draft">建立本地版本草稿</button><p id="skill-status" class="notice">生产运行保留旧技能版本；草稿需验证后发布。</p></section></div>`}
function domain(){return heading('DOMAIN KNOWLEDGE','专业性必须能追到规则','示例规则仅适用于原型的本地 fixture。真实领域包要记录场所、版本、生效时间和出处。')+`<div class="grid"><section class="panel"><h2>规则 → 判据 → 测试</h2><div class="journey"><div>数量单位 BTC</div><span>→</span><div>步长 0.001</div><span>→</span><div>向下截断</div><span>→</span><div>订单 API 精确比较</div></div><h3>D-QTY-01 · 数量规则</h3><p>来源：演示规范 v2 §2；状态：示例，非正式领域金标。输入/输出使用十进制字符串。</p><button data-case="truncate">下钻到关联用例 →</button><h3 style="margin-top:25px">D-PRICE-01 · 价格保护</h3><p>规则阈值尚待产品来源确认，不能用行业常识自动填成事实。</p><button data-story="price">查看覆盖缺口 →</button></section><div class="stack"><section class="panel"><h2>版本管理</h2><p>更新规则前列出影响的故事、用例和判据；旧运行保持旧来源。</p></section><section class="panel"><h2>知识与答案分离</h2><p>公开领域知识可以用于生成；隐藏缺陷与测试 gold 只交给独立 evaluator。</p><button data-nav="research">查看研究路线 →</button></section></div></div>`}
function research(){return heading('RESEARCH & EVOLUTION','从运行成功，走向可验证的方法','这里引用已有证据的限制；研究准备情况不能由原型或工程完成率推算。')+`<div class="grid"><section class="panel"><h2>实际证据摘要</h2><table><tr><th>证据</th><th>可支持的结论</th></tr><tr><td>三宿主各一次</td><td>兼容路径；不能比较宿主质量</td></tr><tr><td>领域开/关 n=3/臂</td><td>探索性对照；尚未显示领域参考提升</td></tr><tr><td>真实进化候选</td><td>无严格改进，被拒绝；不是成功进化</td></tr><tr><td>正式研究</td><td>待独立金标、强基线、更多缺陷家族与冻结实验</td></tr></table><div class="note" style="margin-top:20px">自进化在 Penguin 配套 UI 管理。Web 只展示版本和研究证据，不创建第二个优化器。</div><p><a href="testpilot-ui-research-review-2026-09-09.html#research">完整论文路线与文献 →</a></p></section><div class="stack"><section class="panel"><h2>候选如何变成版本</h2><p>开发集反馈 → 验证选优 → 一次留出 → 真人决定 → CAS 激活 → 回滚。</p></section><section class="panel"><h2>主指标</h2><p>独立缺陷检出与健康误报；同时报告有效率、成本、覆盖和失败。</p></section></div></div>`}
function settings(){return heading('PROJECT SETTINGS','配置来源要一眼看清','交互只改变本页示例，不保存项目设置、不读取密钥。')+`<div class="grid"><section class="panel"><label for="entry">使用入口</label><select id="entry"><option value="web" ${!host?'selected':''}>Web UI</option><option value="host" ${host?'selected':''}>Claude Code / Codex / Penguin 宿主</option></select><div class="split" style="margin-top:20px"><div class="panel"><h2>规划模型</h2>${host?'<span class="badge green">继承宿主</span><p>由宿主账号和原生模型进行理解、规划与设计。无需在 TestPilot 填另一个规划 API。</p>':'<span class="badge">环境默认 · TP_PLANNER_*</span><label for="planner">模型名称（示例）</label><input id="planner" value="same-as-midscene"><p class="notice">初期与执行层相同，以后 env 可独立更换。</p>'}</div><div class="panel"><h2>执行模型 · Midscene</h2><span class="badge">环境默认 · MIDSCENE_*</span><label for="executor">模型名称（示例）</label><input id="executor" value="low-cost-vision-model"><p class="notice">负责页面感知、定位与动作；程序 oracle 独立判定结果。</p></div></div><h2 style="margin-top:28px">启动前准备</h2><table><tr><td>项目/环境</td><td>演示项目 / 本地 fixture</td></tr><tr><td>模型连接</td><td>原型未连接，不能宣称已验证</td></tr><tr><td>知识来源</td><td>需确认产品规则与材料版本</td></tr><tr><td>预算 / 审阅者</td><td>正式运行前配置，冻结到本次运行</td></tr></table></section><div class="stack"><section class="panel"><h2>安装到宿主</h2><p>在 TestPilot checkout 执行安装器，workspace 指向被测项目。当前每目录安装一个宿主。</p><a href="testpilot-ui-research-review-2026-09-09.html#install">Claude / Codex 实操指南 ↗</a></section><section class="panel"><h2>生效范围</h2><p>项目覆盖优先于 env；env 改动需重启。已注册运行保留冻结快照。</p></section></div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===tab?'page':'false'));$('#main').innerHTML=({structure,workflow,assets,domain,research,settings}[tab])();}
function navigate(next,params={}){tab=next;if(params.level)level=params.level;if(params.module)moduleId=params.module;if(params.story){storyId=params.story;moduleId='orders'}if(params.case){if(caseId!==params.case){draft='';savedDraft=''}caseId=params.case;storyId='quantity';moduleId='orders'}showEvidence=false;editing=false;const q=new URLSearchParams({tab,level,module:moduleId,story:storyId,case:caseId});location.hash=q.toString();render();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)return navigate(b.dataset.nav);if(b.dataset.level)return navigate('structure',{level:b.dataset.level});if(b.dataset.module)return navigate('structure',{level:'module',module:b.dataset.module});if(b.dataset.story)return navigate('structure',{level:'story',story:b.dataset.story});if(b.dataset.case)return navigate('structure',{level:'case',case:b.dataset.case});if(b.dataset.node){nodeFocus=b.dataset.node;render()}if(b.id==='edit-case'){editing=!editing;render()}if(b.id==='save-draft'){savedDraft=$('#draft').value;draft=savedDraft;render();ping('已保存原型内草稿。未写服务，未产生审核决定。')}if(b.id==='show-evidence'){showEvidence=!showEvidence;render()}if(b.id==='preview-run'){preview=true;render()}if(b.id==='skill-draft'){$('#skill-status').textContent=$('#skill-pick').value+' · v2 本地草稿已建立（演示），尚未验证或发布。';ping('原型草稿已创建，生产技能未改变。')}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='entry'){host=t.value==='host';render()}if(t.id==='mode'){mode=t.value;selection=mode==='full'?new Set(nodes.map(n=>n[0])):new Set([nodeFocus]);preview=false;render()}if(t.id==='reuse'){reuse=t.checked;preview=false;render()}if(t.dataset.check){if(mode==='only')selection=new Set(t.checked?[t.dataset.check]:[]);else if(t.checked)selection.add(t.dataset.check);else selection.delete(t.dataset.check);preview=false;render()}if(t.id==='skill-pick'){$('#skill-detail').textContent=t.value+' · v1 · 示例版本；输入输出、依赖与已绑定节点将在此管理。';$('#skill-status').textContent='生产运行保留旧技能版本；草稿需验证后发布。'}});
document.addEventListener('input',e=>{if(e.target.id==='draft')draft=e.target.value});
function restore(){const p=new URLSearchParams(location.hash.slice(1));tab=['structure','workflow','assets','domain','research','settings'].includes(p.get('tab'))?p.get('tab'):'structure';level=['project','module','story','case'].includes(p.get('level'))?p.get('level'):'project';moduleId=modules.some(m=>m.id===p.get('module'))?p.get('module'):'orders';storyId=Object.hasOwn(stories,p.get('story'))?p.get('story'):'quantity';caseId=Object.hasOwn(cases,p.get('case'))?p.get('case'):'truncate';render()}window.addEventListener('hashchange',restore);restore();
</script></body></html>
