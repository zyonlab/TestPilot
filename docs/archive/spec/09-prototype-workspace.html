<title>TestPilot 工作台</title>
<style>
  :root {
    --ground: #EEF2F1;
    --surface: #FFFFFF;
    --sunk: #E4EAE8;
    --ink: #141A1C;
    --muted: #5C6870;
    --faint: #8A959B;
    --hair: #D2DAD8;
    --accent: #0B5A54;
    --accent-soft: #DBEBE7;
    --machine: #1C7A5B;
    --judge: #A9711A;
    --fail: #B03A3A;
    --running: #B4761A;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0D1214; --surface: #151C1F; --sunk: #1A2326; --ink: #E3EAE8;
      --muted: #93A2A6; --faint: #6F7D82; --hair: #293437; --accent: #57C3B4;
      --accent-soft: #14312E; --machine: #52BE8C; --judge: #D3A25C; --fail: #D97C7C; --running: #D3A25C;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0D1214; --surface: #151C1F; --sunk: #1A2326; --ink: #E3EAE8;
    --muted: #93A2A6; --faint: #6F7D82; --hair: #293437; --accent: #57C3B4;
    --accent-soft: #14312E; --machine: #52BE8C; --judge: #D3A25C; --fail: #D97C7C; --running: #D3A25C;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { height: 100vh; display: grid; grid-template-rows: 48px minmax(0, 1fr); }
  .top {
    display: flex; align-items: center; gap: 14px; padding: 0 14px;
    background: var(--surface); border-bottom: 1px solid var(--hair);
  }
  .brand { font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
  .brand i { width: 9px; height: 9px; background: var(--accent); display: block; }
  .nav { display: flex; gap: 2px; margin-left: 10px; }
  .nav button {
    background: none; border: 0; padding: 5px 11px; border-radius: 5px;
    color: var(--muted); font-size: 13px;
  }
  .nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav button:hover:not([aria-current="true"]) { background: var(--sunk); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .pin { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  select.proj {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 5px;
    padding: 4px 8px; font-size: 13px;
  }

  /* ---------- workspace ---------- */
  .ws { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100%; min-height: 0; }
  @media (max-width: 860px) { .ws { grid-template-columns: 1fr; } .chat { display: none; } }

  /* ---------- chat ---------- */
  .chat { border-right: 1px solid var(--hair); background: var(--surface); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .chat-h {
    padding: 9px 13px; border-bottom: 1px solid var(--hair);
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--machine); }
  .dot.busy { background: var(--running); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
  .stream { overflow-y: auto; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 9px; }
  .msg { font-size: 13px; line-height: 1.65; padding: 8px 10px; border-radius: 7px; background: var(--sunk); }
  .msg.you { background: var(--accent-soft); }
  .msg.sys { background: none; padding: 2px 2px; color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
  .msg b { font-weight: 650; }
  .msg .ref {
    display: block; margin-bottom: 5px; padding-left: 7px; border-left: 2px solid var(--accent);
    font-size: 11.5px; color: var(--muted); font-family: var(--mono);
  }
  .chat-f { border-top: 1px solid var(--hair); padding: 9px; display: flex; flex-direction: column; gap: 7px; }
  .ctx {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--accent);
    background: var(--accent-soft); padding: 4px 8px; border-radius: 5px;
  }
  .ctx button { background: none; border: 0; color: var(--accent); opacity: 0.6; padding: 0 2px; }
  .ctx button:hover { opacity: 1; }
  .composer { display: flex; gap: 7px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-height: 54px; resize: none; border: 1px solid var(--hair); border-radius: 6px;
    background: var(--ground); color: inherit; padding: 7px 9px; font: inherit; font-size: 13px;
  }
  .composer textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { border: 0; background: var(--accent); color: #fff; border-radius: 6px; padding: 8px 12px; font-size: 13px; }
  .send:disabled { background: var(--sunk); color: var(--faint); cursor: not-allowed; }
  .hints { display: flex; flex-wrap: wrap; gap: 5px; }
  .hint {
    border: 1px solid var(--hair); background: none; border-radius: 999px;
    padding: 3px 9px; font-size: 11.5px; color: var(--muted);
  }
  .hint:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- canvas ---------- */
  .canvas-wrap { position: relative; overflow: hidden; background: var(--ground); }
  .grid-bg {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, var(--hair) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  .canvas-wrap.grabbing { cursor: grabbing; }
  .canvas-wrap { cursor: grab; }

  .layer-tag {
    position: absolute; font-family: var(--mono); font-size: 10px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--faint); white-space: nowrap;
  }

  .node {
    position: absolute; width: 168px; background: var(--surface);
    border: 1px solid var(--hair); border-radius: 8px; padding: 9px 10px;
    display: flex; flex-direction: column; gap: 4px; cursor: pointer;
  }
  .node:hover { border-color: var(--accent); }
  .node.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .node.done { border-left: 3px solid var(--machine); }
  .node.running { border-left: 3px solid var(--running); }
  .node.failed { border-left: 3px solid var(--fail); }
  .node.paused { border-left: 3px solid var(--accent); }
  .node-h { display: flex; align-items: center; gap: 6px; }
  .node-t { font-size: 13px; font-weight: 650; }
  .node-y { font-family: var(--mono); font-size: 10px; color: var(--faint); }
  .node-m { font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .bp {
    margin-left: auto; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--hair);
    background: none; padding: 0; flex: none;
  }
  .bp.on { background: var(--fail); border-color: var(--fail); }
  .bp:hover { border-color: var(--fail); }

  .card {
    position: absolute; width: 168px; background: var(--surface); border: 1px solid var(--hair);
    border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 5px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .card-t { font-size: 12px; color: var(--muted); }
  .card-n { font-family: var(--mono); font-size: 21px; line-height: 1.05; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card-s { font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.5; }
  .card-a { font-size: 11.5px; color: var(--accent); background: none; border: 0; padding: 0; text-align: left; }
  .card-a:hover { text-decoration: underline; }
  .samples { display: flex; flex-direction: column; gap: 3px; }
  .sample {
    font-size: 11px; color: var(--muted); background: var(--sunk); border-radius: 4px; padding: 3px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  svg.wires { position: absolute; overflow: visible; pointer-events: none; }
  svg.wires path { fill: none; stroke: var(--hair); stroke-width: 1.5; }
  svg.wires path.hot { stroke: var(--accent); }

  .zoom {
    position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 7px; padding: 4px;
  }
  .zoom button { border: 0; background: none; width: 26px; height: 24px; border-radius: 4px; color: var(--muted); }
  .zoom button:hover { background: var(--sunk); color: var(--ink); }
  .runbar {
    position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; align-items: center;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 7px; padding: 5px 7px;
  }
  .runbar button { border: 1px solid var(--hair); background: var(--surface); border-radius: 5px; padding: 4px 10px; font-size: 12.5px; }
  .runbar button.go { background: var(--accent); color: #fff; border-color: var(--accent); }
  .runbar button:disabled { opacity: 0.45; cursor: not-allowed; }
  .runbar .status { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 4px; }

  .chip {
    display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono);
    font-size: 10px; padding: 1px 6px; border-radius: 3px; white-space: nowrap;
  }
  .chip.machine { background: color-mix(in srgb, var(--machine) 16%, transparent); color: var(--machine); }
  .chip.judge { background: color-mix(in srgb, var(--judge) 18%, transparent); color: var(--judge); }
  .chip.fail { background: color-mix(in srgb, var(--fail) 16%, transparent); color: var(--fail); }
  .chip.warn { background: color-mix(in srgb, var(--judge) 14%, transparent); color: var(--judge); }

  /* ---------- overlays ---------- */
  .sheet {
    position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 32%, transparent);
    display: flex; justify-content: flex-end; z-index: 20;
  }
  .sheet[hidden] { display: none; }
  .panel {
    background: var(--surface); width: min(880px, 92vw); height: 100%;
    display: grid; grid-template-rows: auto 1fr; border-left: 1px solid var(--hair);
  }
  .panel-h {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair);
  }
  .panel-h h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .panel-h .x { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
  .panel-b { overflow: auto; padding: 14px 16px 40px; }
  .filters { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 12px; }
  .filters select, .filters label {
    border: 1px solid var(--hair); background: var(--surface); border-radius: 5px;
    padding: 4px 7px; font-size: 12.5px; color: var(--ink);
  }
  .filters label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
  th { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  tr.pick:hover td { background: var(--sunk); cursor: pointer; }
  td.small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; margin-bottom: 14px; }
  .kv dt { color: var(--muted); font-size: 12px; }
  .kv dd { margin: 0; }
  .sec { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 16px 0 7px; }
  .finding { font-size: 12.5px; color: var(--judge); background: color-mix(in srgb, var(--judge) 10%, transparent); padding: 6px 9px; border-radius: 5px; margin-bottom: 5px; }
  ol.steps { margin: 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  .note { font-size: 12.5px; color: var(--muted); background: var(--sunk); padding: 9px 11px; border-radius: 6px; }
  .act { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
  .act button { border: 1px solid var(--hair); background: var(--surface); border-radius: 5px; padding: 5px 11px; font-size: 12.5px; }
  .act button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .placeholder { padding: 40px; color: var(--muted); font-size: 14px; max-width: 60ch; }
  .placeholder h2 { font-size: 17px; margin: 0 0 8px; color: var(--ink); }
</style>
<style>
  /* --- additions for the complete version: five destinations --- */
  .page-pad { padding: 18px 22px 60px; overflow: auto; height: 100%; }
  .page-pad h2 { font-size: 17px; margin: 0 0 4px; font-weight: 650; }
  .page-pad .sub { color: var(--muted); font-size: 13px; max-width: 68ch; margin: 0 0 18px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
  .box { border: 1px solid var(--hair); background: var(--surface); border-radius: 9px; padding: 14px 15px; }
  .box h3 { margin: 0 0 3px; font-size: 14px; font-weight: 650; }
  .box .lede { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--hair); border-radius: 8px; padding: 9px 11px; background: var(--surface); }
  .kpi .l { font-size: 11.5px; color: var(--muted); }
  .kpi .v { font-family: var(--mono); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kpi .v.good { color: var(--machine); } .kpi .v.warn { color: var(--judge); } .kpi .v.bad { color: var(--fail); }
  .row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea {
    border: 1px solid var(--hair); background: var(--ground); color: inherit; border-radius: 6px;
    padding: 6px 8px; font: inherit; font-size: 13px;
  }
  .field textarea { min-height: 68px; resize: vertical; font-family: var(--mono); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 5px 13px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .matrix { display: grid; gap: 3px; grid-template-columns: 150px repeat(auto-fit, minmax(18px, 1fr)); align-items: center; }
  .cell { height: 18px; border-radius: 3px; }
  .cell.hit { background: var(--machine); } .cell.miss { background: var(--fail); } .cell.extra { background: var(--hair); }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 9px; align-items: center; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
  .bar { height: 7px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .shot { border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; }
  .shot .cap { font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--hair); }
  .shot .ph { height: 82px; background: repeating-linear-gradient(45deg, var(--sunk), var(--sunk) 6px, var(--ground) 6px, var(--ground) 12px); }
  .shot.diff .ph { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--fail) 24%, transparent), color-mix(in srgb, var(--fail) 24%, transparent) 6px, var(--ground) 6px, var(--ground) 12px); }
  .port {
    position: absolute; right: -7px; top: 22px; width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid var(--accent); background: var(--surface); padding: 0; font-size: 9px;
    color: var(--accent); line-height: 1; display: none;
  }
  .node.editable .port { display: block; }
  .node.editable { cursor: move; }
  .node.linking { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .node.target-ok { border-color: var(--machine); }
  .node.target-bad { border-color: var(--fail); }
  .editbar {
    position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; align-items: center;
    background: var(--surface); border: 1px solid var(--accent); border-radius: 7px; padding: 5px 7px;
  }
  .editbar select, .editbar button {
    border: 1px solid var(--hair); background: var(--surface); border-radius: 5px; padding: 4px 9px; font-size: 12.5px;
  }
  .editbar button.save { background: var(--accent); color: #fff; border-color: var(--accent); }
  .editbar .warn { color: var(--judge); font-size: 11.5px; max-width: 320px; }
  .vers { position: absolute; right: 12px; bottom: 12px; background: var(--surface); border: 1px solid var(--hair);
          border-radius: 7px; padding: 7px 9px; display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
  .vers .row2 { display: flex; gap: 5px; align-items: center; }
  .vers select { border: 1px solid var(--hair); background: var(--surface); border-radius: 4px; padding: 2px 5px; font-family: var(--mono); font-size: 11px; }
  .vers pre { margin: 0; font-family: var(--mono); font-size: 10.5px; line-height: 1.6; max-height: 96px; overflow: auto;
              background: var(--sunk); padding: 6px 8px; border-radius: 5px; white-space: pre-wrap; }
  .story-tree { font-size: 13px; }
  .story-tree li { list-style: none; }
  .story-tree > li { border-bottom: 1px solid var(--hair); padding: 6px 0; }
  .story-tree .sn { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .story-tree .sn .id { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
  .story-tree ul { margin: 6px 0 2px 18px; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .story-tree ul li { font-size: 12.5px; color: var(--muted); }
  .warnline { font-size: 12.5px; color: var(--judge); background: color-mix(in srgb, var(--judge) 12%, transparent); padding: 7px 10px; border-radius: 6px; margin-top: 10px; }
  .okline { font-size: 12.5px; color: var(--machine); background: color-mix(in srgb, var(--machine) 12%, transparent); padding: 7px 10px; border-radius: 6px; margin-top: 10px; }
  .storymap { display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; font-size: 12.5px; align-items: baseline; }
  .storymap dt { font-family: var(--mono); color: var(--accent); font-size: 11.5px; }
  .storymap dd { margin: 0; color: var(--muted); }

  /* the harness layer: what it did, in order — not a scoreboard */
  .trace { border-top: 1px solid var(--hair); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .trace-h { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--hair); flex: none; }
  .trace-h .t { font-size: 12px; font-weight: 650; }
  .trace-h .f { display: flex; gap: 2px; margin-left: 6px; }
  .trace-h .f button { border: 0; background: none; font-size: 11.5px; color: var(--muted); padding: 3px 8px; border-radius: 5px; }
  .trace-h .f button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .trace-h .sum { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 12px; }
  .trace-b { overflow: auto; min-height: 0; }
  .tl { display: grid; grid-template-columns: 62px 74px 128px 1fr auto; gap: 10px; align-items: baseline;
        padding: 4px 12px; font-size: 12px; border-bottom: 1px solid color-mix(in srgb, var(--hair) 45%, transparent); }
  .tl:hover { background: var(--sunk); cursor: pointer; }
  .tl .ts { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .tl .kd { font-family: var(--mono); font-size: 10px; }
  .tl .nd { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  .tl .tx { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl .rt { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .tl.k-model .kd { color: var(--judge); } .tl.k-node .kd { color: var(--accent); }
  .tl.k-gate .kd { color: var(--machine); } .tl.k-err .kd { color: var(--fail); }

  /* the harness layer, made visible: a strip under the canvas rather than lines in a chat */
  .rail {
    border-top: 1px solid var(--hair); background: var(--surface);

/* ---------- chat ---------- */
function say(role, text, ref) { S.msgs.push({ role, text, ref }); renderChat(); }

function seedChat() {
  S.msgs = [
    { role: "sys", text: "运行 wf-mt0xaw2g · selftest-g1 v2 · 41 min · 21 calls · 35 787 tokens" },
    { role: "bot", text: "跑完了。20 个故事、100 条用例，门禁① 93%。<b>有一件事值得先看</b>：100 条里声称 tier1 的有 77 条，带机器判据的 <b>0 条</b>——执行时它们仍会由模型看截图判定。" },
    { role: "you", text: "先看看门禁挑出来的那些" },
    { role: "bot", text: "31 条 finding：<b>oracle-vague 20 条</b>（断言没指向可观测现象）、<b>tier 11 条</b>（用了 tier3）。点画布上「门禁①」那张卡可以展开成表。" },
  ];
  renderChat();
}

function renderChat() {
  const box = $("#stream");
  if (!box) return;
  box.innerHTML = "";
  for (const m of S.msgs) {
    const d = el("div", "msg " + (m.role === "you" ? "you" : m.role === "sys" ? "sys" : ""));
    if (m.ref) { const r = el("span", "ref", m.ref); d.appendChild(r); }
    const span = el("span");
    span.innerHTML = m.text;
    d.appendChild(span);
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}

/* Canned but honest: each reply describes something the backend can actually do today. */
function reply(text) {
  const t = text.trim();
  const c = S.ctx;
  if (/重生成|改写|重写/.test(t)) {
    if (c && c.kind === "case") return `已按门禁意见重写 <b>${c.id.slice(0, 22)}…</b>，落成一条 <code>by: model</code> 的编辑——<b>产物没有被改写</b>，两版并排可比。门禁①对这条已无意见。<br><span class="mono" style="font-size:11px;color:var(--faint)">一次模型调用 · 本地模型约 80 秒</span>`;
    return "先在画布上选一条用例，我才知道要重写哪条。";
  }
  if (/凭证|占位符|替换/.test(t)) return "查找替换作用于选中的这批：<b>改了 8 条</b>，其余不含该字面量的未动——不匹配就不记编辑，否则 diff 会开在两列一模一样的内容上。";
  if (/判据|oracle|tier/.test(t)) return "要让 tier 兑现，得让用例带上机器判据（<code>text/noText/url/count</code> 是 tier1，<code>delta</code> 是 tier2）。<b>把 design.cases 的 oracleGuidance 调成 strict 再跑一次</b>，我可以起草这个改动——保存会立一版新图。";
  if (/跑|运行|执行/.test(t)) return "执行不经过我：右上角 <b>▶ 跑这张图</b>，或者在节点上「只跑此节点 / 从此节点续跑」。<br>理由是可复现——同一句话两次跑出不同的东西，配对评测就失去意义了。<b>我能做的是改下一次怎么跑</b>：参数、提示词、图的形状。";
  if (/断点/.test(t)) return "断点在节点卡片左上角那个圆点上点一下就能开关；停下来之后工具栏出现「继续」。";
  if (/为什么|失败|挂了/.test(t)) return "阶段二 4 条里 1 条通过。失败的三条互不相同：一条断言时回复还在「生成中」，一条是<b>判定模型的假阴性</b>（按钮 DOM 上确实 disabled），一条是 infra（puppeteer 协议错误）——<b>没有一条是用例写得不好</b>。";
  return "我能起草图、能力 recipe 与提示词改写，也能对选中的产物下指令（重生成、批量替换、重新打分）。<b>我只出草稿</b>，校验通过才可保存。";
}

function send() {
  const ta = $("#ta");
  const v = ta.value.trim();
  if (!v) return;
  const refText = S.ctx ? S.ctx.label : null;
  say("you", v.replace(/</g, "&lt;"), refText);
  ta.value = "";
  $("#send").disabled = true;
  setTimeout(() => { say("bot", reply(v)); $("#send").disabled = false; }, 260);
}

/* ---------- run simulation ---------- */
let runTimer = null;
function startRun(from) {
  const order = RUN.nodes.map((n) => n.id).filter((id) => S.stage2 || !["codegen", "codegate", "repair"].includes(id));
  let i = from ? order.indexOf(from) : 0;
  order.forEach((id, k) => { if (k >= i) S.nodeState[id] = "idle"; });
  S.phase = "running";
  say("sys", "运行开始 · " + order.slice(i).join(" → "));
  render();
  const step = () => {
    if (i >= order.length) { S.phase = "done"; say("sys", "运行结束 · done"); render(); return; }
    const id = order[i];
    if (S.bp.has(id) && id !== from) {
      S.nodeState[id] = "paused"; S.phase = "paused";
      say("sys", `停在断点：${id} 之前 · 零模型调用`);
      say("bot", `停在 <b>${id}</b> 前面了。上游产物都在画布上，可以先看再决定要不要继续。`);
      render(); return;
    }
    S.nodeState[id] = "running"; render();
    runTimer = setTimeout(() => {
      S.nodeState[id] = "done";
      const n = RUN.nodes.find((x) => x.id === id);
      if (n.calls) say("sys", `${id} 完成 · ${fmtMs(n.ms)} · ${n.calls} calls · ${n.tokens} tok`);
      i += 1; render(); step();
    }, 620);
  };
  step();
}
function resumeRun() {
  const paused = Object.keys(S.nodeState).find((k) => S.nodeState[k] === "paused");
  if (!paused) return;
  say("sys", `继续 · 从 ${paused} 开始（被点名的节点不被自己的断点拦）`);
  startRun(paused);
}

/* ---------- canvas ---------- */
function artifactCards() {
  const st = S.nodeState;
  const cards = [];
  if (st.spec === "done") cards.push({ id: "a-spec", node: "spec", t: "规格材料", n: "2", s: "docs/spec/02 + 03", y: CARD_Y, table: "spec" });
  if (st.stories === "done") cards.push({ id: "a-stories", node: "stories", t: "用户故事", n: String(RUN.stories), s: "故事树 · 2 份文档", y: CARD_Y, table: "stories" });
  if (st.design === "done") cards.push({
    id: "a-cases", node: "design", t: "文本用例", n: "100", s: "抽样 3 条 · 展开成表", y: CARD_Y, table: "cases",
    samples: CASES.slice(0, 3).map((c) => c.t),
  });
  if (st.gate === "done") {
    cards.push({ id: "a-gate", node: "gate", t: "门禁①", n: "93%", s: "31 条 finding · 负例 29%", y: CARD_Y, table: "findings" });
    cards.push({ id: "a-tier", node: "gate", t: "判据有据率", n: "0%", s: "声称 77×t1 · 有据 0", y: CARD_Y2, table: "tier", warn: true });
    cards.push({ id: "a-cov", node: "gate", t: "覆盖矩阵", n: "50%", s: "命中 7 · 遗漏 9 · 多余 79", y: CARD_Y2 + 120, table: "matrix", warn: true });
  }
  if (st.codegen === "done") cards.push({ id: "a-code", node: "codegen", t: "用例代码", n: "4", s: "门禁② 1.00", y: CARD_Y, table: "code" });
  if (st.repair === "done") {
    cards.push({ id: "a-runs", node: "repair", t: "执行", n: "1/4", s: "loose=strict · 零退化", y: CARD_Y, table: "runs" });
    cards.push({ id: "a-rep", node: "repair", t: "修复循环", n: "4", s: "改动分类 · 双口径", y: CARD_Y2, table: "repair" });
  }
  return cards;
}

function renderCanvas() {
  const wrap = el("div", "canvas-wrap");
  wrap.id = "cv";
  wrap.appendChild(el("div", "grid-bg"));

  const stage = el("div", "stage");
  stage.id = "stage";
  stage.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px) scale(${S.zoom})`;

  const wires = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  wires.setAttribute("class", "wires");
  wires.style.width = "1600px"; wires.style.height = "480px";
  EDGES.forEach((e) => {
    const a = NODE_POS[e.from], b = NODE_POS[e.to];
    if (!a || !b) return;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const x1 = a.x + 168, y1 = a.y + 26, x2 = b.x, y2 = b.y + 26;
    p.setAttribute("d", `M${x1},${y1} C${x1 + 22},${y1} ${x2 - 22},${y2} ${x2},${y2}`);
    if (S.nodeState[e.from] === "done") p.setAttribute("class", "hot");
    wires.appendChild(p);
  });
  // wire nodes to their artifact cards
  for (const c of artifactCards()) {
    const a = NODE_POS[c.node];
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M${a.x + 84},${a.y + 58} L${a.x + 84},${c.y}`);
    wires.appendChild(p);
  }
  stage.appendChild(wires);

  const tagA = el("div", "layer-tag", "流程层"); tagA.style.left = "20px"; tagA.style.top = "34px"; stage.appendChild(tagA);
  const tagB = el("div", "layer-tag", "产物层"); tagB.style.left = "20px"; tagB.style.top = (CARD_Y - 26) + "px"; stage.appendChild(tagB);

  for (const n of RUN.nodes) {
    if (!S.stage2 && ["codegen", "codegate", "repair"].includes(n.id)) continue;
    const st = S.nodeState[n.id] || "idle";
    const d = el("div", `node ${st}` + (S.sel && S.sel.kind === "node" && S.sel.id === n.id ? " sel" : ""));
    d.style.left = NODE_POS[n.id].x + "px"; d.style.top = NODE_POS[n.id].y + "px";
    const h = el("div", "node-h");

    const bp = el("button", "bp" + (S.bp.has(n.id) ? " on" : ""));
    bp.title = "断点";
    bp.onclick = (e) => { e.stopPropagation(); S.bp.has(n.id) ? S.bp.delete(n.id) : S.bp.add(n.id); render(); };
    h.appendChild(bp);
    d.appendChild(h);
    d.appendChild(el("div", "node-y", n.type));
    const m = el("div", "node-m");
    if (st === "done") {
      m.appendChild(el("span", null, fmtMs(n.ms)));
      if (n.calls) m.appendChild(el("span", null, n.calls + " calls"));
      if (n.tokens) m.appendChild(el("span", null, n.tokens + " tok"));
    } else m.appendChild(el("span", null, st === "running" ? "运行中…" : st === "paused" ? "停在断点前" : "未运行"));
    d.appendChild(m);
    if (S.editing) {
      d.classList.add("editable");
      if (S.linkFrom === n.id) d.classList.add("linking");
      else if (S.linkFrom) d.classList.add(canLink(S.linkFrom, n.id) ? "target-ok" : "target-bad");
      const port = el("button", "port", "→");
      port.title = "从这里连一条线";
      port.onclick = (e) => { e.stopPropagation(); S.linkFrom = S.linkFrom === n.id ? null : n.id; S.editIssue = ""; render(); };
      d.appendChild(port);
      const del = el("button", "bp");
      del.textContent = "✕";
      del.style.cssText = "border:0;color:var(--fail);font-size:11px;line-height:1";
      del.title = "删除节点";
      del.onclick = (e) => { e.stopPropagation(); dropNode(n.id); };
      h.appendChild(del);
      // dragging is layout only: where a node sits says nothing about what the graph does,
      // so moving one is not a change that needs a version.
      d.onmousedown = (e) => {
        if (e.target.closest(".port, .bp")) return;
        const start = { x: e.clientX, y: e.clientY, ox: NODE_POS[n.id].x, oy: NODE_POS[n.id].y };
        const move = (ev) => {
          NODE_POS[n.id] = {
            x: Math.round(start.ox + (ev.clientX - start.x) / S.zoom),
            y: Math.round(start.oy + (ev.clientY - start.y) / S.zoom),
          };
          d.style.left = NODE_POS[n.id].x + "px";
          d.style.top = NODE_POS[n.id].y + "px";
        };
        const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); render(); };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
        e.preventDefault();
      };
    }
    d.onclick = () => {
      if (S.editing && S.linkFrom && S.linkFrom !== n.id) return linkTo(n.id);
      selectNode(n.id);
    };
    stage.appendChild(d);
  }

  for (const c of artifactCards()) {
    const d = el("div", "card" + (S.sel && S.sel.id === c.id ? " sel" : ""));
    d.style.left = NODE_POS[c.node].x + "px"; d.style.top = c.y + "px";
    d.appendChild(el("div", "card-t", c.t));
    const n = el("div", "card-n", c.n);
    if (c.warn) n.style.color = "var(--judge)";
    d.appendChild(n);
    d.appendChild(el("div", "card-s", c.s));
    if (c.samples) {
      const box = el("div", "samples");
      for (const s of c.samples) box.appendChild(el("div", "sample", s));
      d.appendChild(box);
    }
    if (c.table) {
      const a = el("button", "card-a", "展开成表 →");
      a.onclick = (e) => { e.stopPropagation(); openTable(c.table); };
      d.appendChild(a);
    }
    d.onclick = () => selectCard(c);
    stage.appendChild(d);
  }

  wrap.appendChild(stage);

  const zoom = el("div", "zoom");
  const zin = el("button", null, "+"); zin.onclick = () => { S.zoom = Math.min(1.6, S.zoom + 0.12); render(); };
  const zout = el("button", null, "−"); zout.onclick = () => { S.zoom = Math.max(0.4, S.zoom - 0.12); render(); };
  const zfit = el("button", null, "⤢"); zfit.title = "适应视图";
  zfit.onclick = () => { S.zoom = 0.62; S.pan = { x: 20, y: 40 }; render(); };
  zoom.append(zin, zout, zfit);
  wrap.appendChild(zoom);

  /* 输入源：规格文档 或 探索。两条路进同一条流水线（AC-04.2）。 */
  if (!S.editing) {
    const src = el("div", "editbar");
    src.style.borderColor = "var(--hair)";
    src.appendChild(el("span", "card-s", "输入源"));
    const seg = el("div", "seg");
    [["spec", "规格文档"], ["explore", "探索界面"]].forEach(([k, label]) => {
      const bb = el("button", null, label);
      bb.setAttribute("aria-pressed", String(S.source === k));
      bb.onclick = () => {
        S.source = k;
        // 换输入源就是换第一个节点：source.spec ↔ source.explore，其余流水线不变
        const first = RUN.nodes[0];
        first.id = k === "spec" ? "spec" : "explore";
        first.type = k === "spec" ? "source.spec" : "source.explore";
        NODE_POS[first.id] = NODE_POS.spec || NODE_POS.explore || { x: 20, y: 60 };
        EDGES[0].from = first.id;
        S.nodeState[first.id] = "done";
        render();
      };
      seg.appendChild(bb);
    });
    src.appendChild(seg);
    src.appendChild(el("span", "warn", S.source === "spec"
      ? "docs/spec/02 + 03 · 点产物层「规格材料」可读全文"
      : "无规格或规格不全时：让 agent 漫游界面补故事，产物与规格产物同构"));
    if (S.source === "explore") {
      const go = el("button", null, "开始探索");
      go.onclick = openExplore;
      src.appendChild(go);
    }
    wrap.appendChild(src);
  }

  if (S.editing) {
    const eb = el("div", "editbar");
    const add = el("select");
    add.appendChild(new Option("+ 加节点", ""));
    Object.keys(KINDS).forEach((t) => add.appendChild(new Option(t, t)));
    add.onchange = () => { if (add.value) addNode(add.value); };
    eb.appendChild(add);

    save.onclick = saveTopology;
    eb.appendChild(save);
    const drop = el("button", null, "放弃");
    drop.onclick = () => { S.editing = false; S.linkFrom = null; S.editIssue = ""; S.draft = null; render(); };
    eb.appendChild(drop);
    eb.appendChild(el("span", "warn", S.editIssue || (S.linkFrom ? `从 ${S.linkFrom} 连线中：点目标节点，或再点一次取消` : "拖动摆位不算改动；增删节点与连线才算")));
    wrap.appendChild(eb);
  }

  const bar = el("div", "runbar");
  const go = el("button", "go", S.phase === "running" ? "运行中…" : "▶ 跑这张图");
  go.disabled = S.phase === "running";
  go.title = "从头跑一遍 spec → stories → design → gate（→ 阶段二）";
  go.onclick = () => startRun();
  bar.appendChild(go);
  if (S.phase === "paused") {
    const at = Object.keys(S.nodeState).find((k) => S.nodeState[k] === "paused");
    const cont = el("button", null, "⏭ 从 " + at + " 继续");
    cont.onclick = resumeRun;
    bar.appendChild(cont);
  }
  // Three unrelated things used to sit here unlabelled ("运行 断点 1 done"). Each one now
  // says what it is: what the run is doing, and how many stops are armed.
  const st = el("span", "status");
  const phaseText = { idle: "未跑过", running: "正在跑", paused: "停在断点", done: "跑完了" }[S.phase] || S.phase;
  st.appendChild(el("span", "chip " + (S.phase === "done" ? "machine" : S.phase === "paused" ? "judge" : "warn"), "状态：" + phaseText));
  bar.appendChild(st);
  const bpc = el("span", "status", S.bp.size ? `断点 ${S.bp.size} 个（节点左上角的圆点）` : "未设断点");
  bpc.title = "运行会停在这些节点之前，停下时零模型调用";
  bar.appendChild(bpc);
  if (!S.editing) {
    const ed = el("button", null, "编辑拓扑");
    ed.title = "增删节点与连线。保存必然新起一版——已完成的运行仍指向它当时那一版。";
    ed.onclick = () => { S.editing = true; S.draft = { added: [], removed: [], edges: [] }; render(); };
    bar.appendChild(ed);
  }
  wrap.appendChild(bar);

  wrap.appendChild(renderVersions());

  // pan + zoom
  let drag = null;
  wrap.addEventListener("mousedown", (e) => {
    if (e.target.closest(".node, .card, .zoom, .runbar")) return;
    drag = { x: e.clientX - S.pan.x, y: e.clientY - S.pan.y };
    wrap.classList.add("grabbing");
  });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return;
    S.pan = { x: e.clientX - drag.x, y: e.clientY - drag.y };
    const st = $("#stage");
    if (st) st.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px) scale(${S.zoom})`;
  });
  window.addEventListener("mouseup", () => { drag = null; wrap.classList.remove("grabbing"); });
  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const k = e.deltaY > 0 ? 0.92 : 1.08;
    S.zoom = Math.max(0.4, Math.min(1.6, S.zoom * k));
    const st = $("#stage");
    if (st) st.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px) scale(${S.zoom})`;
  }, { passive: false });

  return wrap;
}


/* ---------- 拓扑编辑：连线校验、增删、立版、版本 diff（US-15） ---------- */

/** Would this wire type-check? The reason is what the UI shows when it would not. */
function linkReason(fromId, toId) {
  const a = RUN.nodes.find((n) => n.id === fromId), b = RUN.nodes.find((n) => n.id === toId);
  if (!a || !b) return "节点不存在";
  const out = (KINDS[a.type] || {}).out, need = (KINDS[b.type] || {}).in;
  if (need === null) return `${b.id} 是输入源，它不接收上游`;
  if (out !== need) return `类型不兼容：${a.id} 产出 ${out}，而 ${b.id} 需要 ${need}`;
  if (EDGES.some((e) => e.from === fromId && e.to === toId)) return "这条线已经有了";
  return "";
}
const canLink = (a, b) => linkReason(a, b) === "";

/** The graph's wires, as data — the canvas draws these, and editing changes these. */
const EDGES = [
  { from: "spec", to: "stories" }, { from: "stories", to: "design" },
  { from: "design", to: "gate" }, { from: "gate", to: "codegen" },
  { from: "codegen", to: "codegate" }, { from: "codegate", to: "repair" },
];

function linkTo(toId) {
  const why = linkReason(S.linkFrom, toId);
  if (why) {
    // Refused while it is being drawn, with the contract spelled out — not at run time.
    S.editIssue = why;
    render();
    return;
  }
  EDGES.push({ from: S.linkFrom, to: toId });
  S.draft.edges.push({ from: S.linkFrom, to: toId });
  S.editIssue = `已连 ${S.linkFrom} → ${toId}`;
  S.linkFrom = null;
  render();
}

function addNode(type) {
  const base = type.split(".").pop();
  let id = base, i = 2;
  while (RUN.nodes.some((n) => n.id === id)) id = base + i++;
  RUN.nodes.push({ id, type, ms: 0, calls: 0, tokens: 0 });
  const xs = Object.values(NODE_POS).map((p) => p.x);
  NODE_POS[id] = { x: Math.max(...xs) + 210, y: 60 };
  S.nodeState[id] = "idle";
  S.draft.added.push(id);
  S.editIssue = `加了 ${id}（${type}）· 还没有连线`;
  render();
}

function dropNode(id) {
  const at = RUN.nodes.findIndex((n) => n.id === id);
  if (at === -1) return;
  RUN.nodes.splice(at, 1);
  // A wire to a node that is gone is not a wire; drop them with it rather than letting the
  // save fail with an error about something invisible.
  for (let i = EDGES.length - 1; i >= 0; i--) if (EDGES[i].from === id || EDGES[i].to === id) EDGES.splice(i, 1);
  delete NODE_POS[id];
  S.draft.removed.push(id);
  S.editIssue = `删了 ${id}，连着它的线一并去掉`;
  render();
}

function saveTopology() {
  const d = S.draft || { added: [], removed: [], edges: [] };
  if (!d.added.length && !d.removed.length && !d.edges.length) {
    S.editIssue = "没有结构改动——挪动摆位不产生新版本";
    render();
    return;
  }
  const v = VERSIONS[0].v + 1;
  VERSIONS.unshift({
    v, at: "刚刚",
    note: [d.added.length && `+${d.added.join(",")}`, d.removed.length && `-${d.removed.join(",")}`,
           d.edges.length && `${d.edges.length} 条连线`].filter(Boolean).join(" · "),
  });
  S.verA = v - 1; S.verB = v; S.verDiff = null;
  S.editing = false; S.draft = null; S.editIssue = "";
  say("sys", `已保存为 v${v} · 已完成的运行仍指向它当时那一版`);
  render();
}

/** Two versions and the line-by-line difference between them. */
function renderVersions() {
  const box = el("div", "vers");
  const head = el("div", "row2");
  head.appendChild(el("span", "card-s", "图版本"));
  const mk = (val, on) => {
    const sel = el("select");
    VERSIONS.forEach((x) => sel.appendChild(new Option("v" + x.v + (x.note ? " · " + x.note.slice(0, 12) : ""), x.v)));
    sel.value = String(val);
    sel.onchange = () => { on(Number(sel.value)); S.verDiff = null; render(); };
    return sel;
  };
  head.appendChild(mk(S.verA, (v) => (S.verA = v)));
  head.appendChild(el("span", "card-s", "→"));
  head.appendChild(mk(S.verB, (v) => (S.verB = v)));
  const go = el("button", "hint", "比较");
  go.onclick = () => { S.verDiff = diffVersions(S.verA, S.verB); render(); };
  head.appendChild(go);
  box.appendChild(head);
  if (S.verDiff) {
    const pre = el("pre");
    pre.textContent = S.verDiff.join("\n");
    box.appendChild(pre);
  } else {
    box.appendChild(el("div", "card-s", "运行 pin 的是 v" + RUN.version + "：改图不会改写它当时的含义"));
  }
  return box;
}

/**
 * The difference between two versions, per node and per parameter key.
 *
 * "参数变了" is not an answer to "你改了什么", and this project's loop is usually exactly
 * one threshold moving.
 */
function diffVersions(a, b) {
  if (a === b) return ["两个版本相同"];
  const known = {
    "1→2": ["~ spec.paths: [02] → [02, 03]", "~ stories.maxStories: 12 → 20", "~ design.maxCasesPerStory: unset → 5"],
    "2→3": ["+ node case (codegen.case)", "+ edge gate → case", "（随后已还原，实验留在版本历史里）"],
  };
  const key = `${Math.min(a, b)}→${Math.max(a, b)}`;
  if (known[key]) return a < b ? known[key] : known[key].map((l) => l.replace(/^\+/, "-").replace(/^~/, "~"));
  const nv = VERSIONS.find((x) => x.v === Math.max(a, b));
  return [nv && nv.note ? "· " + nv.note : "（这两版之间没有记录的结构差异）",
          "节点位置不算变更——挪一下摆位没有改变图做什么"];
}

/* US-08：修复循环的改动分类与双口径 */

/**
 * One case's code, in the three states it actually passes through.
 *
 * The distinction matters and the old UI collapsed it: what codegen wrote, what the repair
 * loop rewrote, and the one that is allowed to run tomorrow are three different things.
 * A drawer that shows only the last one cannot answer "what did the loop change, and did
 * it weaken anything" — which is the question this project exists to keep answerable.
 */
const CODE_STATES = [
  { id: "gen", label: "生成的", why: "codegen 的原始产物" },
  { id: "rep", label: "修复后", why: "有界修复改写过的" },
  { id: "final", label: "最终可用", why: "门禁②通过、已批准，能进仓库" },
];

function openCaseCode(caseId) {
  const raw = CODE.code[caseId] || "";
  const round = CODE.rounds[caseId];
  const outcome = (CODE.outcomes || []).find((o) => o.id === caseId) || {};
  let state = "final";
  let showDiff = false;

  const repaired = round && round.changes && round.changes[0] !== "none"
    ? raw.replace("Navigate to the Agent chat interface and ensure the Agent is in an idle state",
        "Open the 能力与 Chat page and wait until the 与 agent 对话 panel is visible")
    : raw;

  sheet("代码 · " + caseId.slice(0, 30) + "…", (b) => {
    const draw = () => {
      b.innerHTML = "";

      const tabs = el("div", "tabs");
      CODE_STATES.forEach((st) => {
        const t = el("button", null, st.label);
        t.setAttribute("aria-selected", String(state === st.id));
        t.title = st.why;
        t.onclick = () => { state = st.id; draw(); };
        tabs.appendChild(t);
      });
      b.appendChild(tabs);

      const meta = el("div", "row");
      meta.appendChild(el("span", "card-s", CODE_STATES.find((x) => x.id === state).why));
      if (state === "final") {
        meta.appendChild(el("span", outcome.status === "passed" ? "chip machine" : "chip fail",
          outcome.status === "passed" ? "上次执行：通过" : `上次执行：${outcome.kind === "infra" ? "infra" : "失败"}`));
        meta.appendChild(el("span", "chip machine", "门禁② " + (CODE.gate2 ?? 1).toFixed(2)));
      }
      if (state === "rep") {
        if (!round) {
          // Silence here would show the generated code again and let it pass for a repair.
          meta.appendChild(el("span", "chip machine", "没进过修复循环"));
          meta.appendChild(el("span", "card-s", "第一次跑就成立，或者失败被判为 infra —— 代码与「生成的」完全一致"));
        } else if (round.changes[0] === "none") {
          meta.appendChild(el("span", "chip warn", "改动分类：none"));
          meta.appendChild(el("span", "card-s", "修复循环看过但没动它：走了「这是产品缺陷」的出口"));
        } else {
          meta.appendChild(el("span", "chip judge", "改动分类：" + round.changes.join(" · ")));
          meta.appendChild(el("span", "chip machine", "断言未被改松"));
        }
      }
      if (state !== "gen" && round && round.changes[0] !== "none") {
        const d = el("button", "hint", showDiff ? "看完整代码" : "对比「生成的」");
        d.onclick = () => { showDiff = !showDiff; draw(); };
        meta.appendChild(d);
      }
      b.appendChild(meta);

      const shown = state === "gen" ? raw : repaired;
      if (showDiff && state !== "gen") {
        b.appendChild(el("div", "sec", "与生成版的差异"));
        const box = el("div");
        const a = raw.split("\n"), c = shown.split("\n");
        const n = Math.max(a.length, c.length);
        for (let i = 0; i < n; i++) {
          if (a[i] === c[i]) {
            const line = el("pre", "note mono");
            line.style.cssText = "white-space:pre-wrap;margin:0;padding:3px 8px;background:none";
            line.textContent = "  " + (a[i] ?? "");
            box.appendChild(line);
            continue;
          }
          if (a[i] !== undefined) {
            const del = el("pre", "note mono");
            del.style.cssText = "white-space:pre-wrap;margin:0;padding:3px 8px;color:var(--fail);background:color-mix(in srgb,var(--fail) 8%,transparent)";
            del.textContent = "- " + a[i];
            box.appendChild(del);
          }
          if (c[i] !== undefined) {
            const add = el("pre", "note mono");
            add.style.cssText = "white-space:pre-wrap;margin:0;padding:3px 8px;color:var(--machine);background:color-mix(in srgb,var(--machine) 10%,transparent)";
            add.textContent = "+ " + c[i];
            box.appendChild(add);
          }
        }
        b.appendChild(box);
      } else {
        const pre = el("pre", "note mono");
        pre.style.whiteSpace = "pre-wrap";
        pre.textContent = shown;
        b.appendChild(pre);
      }

      if (state === "final") {
        b.appendChild(el("div", "sec", "数据绑定"));
        const dr = el("div", "row");
        dr.appendChild(el("span", "chip machine", "env: LOGIN_USER"));
        dr.appendChild(el("span", "chip judge", "🔒 secret: LOGIN_PASSWORD"));
        dr.appendChild(el("span", "card-s", "密钥只以占位符出现，执行时解析、日志里仍是模板"));
        b.appendChild(dr);
        b.appendChild(el("div", "sec", "公共片段"));
        b.appendChild(el("div", "note", "这条没有引用片段。登录/造数/清理这类前置一旦出现两次，会被提取成片段被引用，而不是复制。"));
      }

      const act = el("div", "act");
      const copy = el("button", null, "复制");
      copy.onclick = () => { navigator.clipboard?.writeText(shown); say("sys", "已复制 " + caseId.slice(0, 20) + "… 的代码"); };
      const rerun = el("button", null, "只重跑这条");
      rerun.onclick = () => { $("#sheet").hidden = true; say("sys", "重跑 " + caseId.slice(0, 20) + "… · 走 runner，不重新生成代码"); };
      const regen = el("button", null, "重新生成");
      regen.onclick = () => say("bot", "重新生成会覆盖「生成的」那一版吗？<b>不会</b>——旧版留着，新版作为另一次产出，两版可比。");
      act.append(copy, rerun, regen);
      if (state === "final") {
        const pr = el("button", "primary", "加入交付（PR）");
        pr.onclick = () => { $("#sheet").hidden = true; S.view = "as"; S.as = "deliver"; render(); };
        act.appendChild(pr);
      }
      b.appendChild(act);
    };
    draw();
  });
}

function renderTrace() {
  const box = el("div", "trace");
  box.style.height = S.traceOpen ? "230px" : "auto";
  const h = el("div", "trace-h");
  h.appendChild(el("span", "t", "执行轨迹"));
  if (S.traceOpen) {
    const f = el("div", "f");
    [["all", "全部"], ["model", "模型调用"], ["node", "节点"], ["gate", "门禁"]].forEach(([k, label]) => {
      const b = el("button", null, label);
      b.setAttribute("aria-pressed", String(S.traceFilter === k));
      b.onclick = () => { S.traceFilter = k; render(); };
      f.appendChild(b);
    });
    h.appendChild(f);
    const sum = el("div", "sum");
    // A thin summary survives: it is the budget, which is the one number that can stop a run.
    sum.appendChild(el("span", null, "模型闸 1/1"));
    sum.appendChild(el("span", null, "预算 21/500 calls · 41/240 min"));
    sum.appendChild(el("span", null, "指纹 19da4de9"));
    h.appendChild(sum);
  }
  const t = el("button", "toggle", S.traceOpen ? "▾ 收起" : "▴ 展开轨迹");
  t.style.marginLeft = S.traceOpen ? "12px" : "auto";
  t.onclick = () => { S.traceOpen = !S.traceOpen; render(); };
  h.appendChild(t);
  box.appendChild(h);
  if (!S.traceOpen) return box;

  const b = el("div", "trace-b");
  const rows = TRACE.filter((r) => S.traceFilter === "all" || r.kind === S.traceFilter ||
    (S.traceFilter === "node" && r.kind === "run"));
  rows.forEach((r) => {
    const line = el("div", "tl k-" + r.kind);
    line.appendChild(el("div", "ts", r.t));
    const kindLabel = { run: "RUN", node: "NODE", model: "MODEL", gate: "GATE", err: "FLAG" }[r.kind];
    line.appendChild(el("div", "kd", kindLabel));
    line.appendChild(el("div", "nd", r.node));
    line.appendChild(el("div", "tx", r.text));
    line.appendChild(el("div", "rt", r.right));
    line.onclick = () => openTraceEntry(r);
    b.appendChild(line);
  });
  box.appendChild(b);
  return box;
}

/** One line of the trace, opened: this is where the actual prompt lives. */
function openTraceEntry(r) {
  sheet(`${r.t} · ${r.node} · ${r.kind}`, (b) => {

/** The drawer holds specs and tables, so how wide it is has to be the reader's call. */
function armGrip(panel) {
  if (panel.querySelector(".grip")) return;
  const grip = el("div", "grip");
  grip.title = "拖动改变宽度";
  panel.appendChild(grip);
  let from = null;
  grip.addEventListener("mousedown", (e) => {
    from = { x: e.clientX, w: panel.getBoundingClientRect().width };
    grip.classList.add("on");
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!from) return;
    const w = Math.max(420, Math.min(window.innerWidth - 80, from.w + (from.x - e.clientX)));
    S.drawerW = Math.round(w);
    panel.style.width = S.drawerW + "px";
  });
  window.addEventListener("mouseup", () => { from = null; grip.classList.remove("on"); });
}

/**
 * Markdown, rendered — with one tab per file.
 *
 * The spec is the input to everything downstream, and a path in a JSON参数 box is not a way
 * to read it. Enough of a renderer for headings, lists, quotes and tables: the point is to
 * read the material, not to build an editor.
 */
function renderMd(text) {
  const wrap = el("div", "md");
  const lines = text.split("\n");
  let list = null, table = null;
  const flush = () => { list = null; table = null; };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\s*$/.test(line)) { flush(); continue; }
    if (/^#{1,6}\s/.test(line)) {
      flush();
      const depth = (line.match(/^#+/) || ["#"])[0].length;
      const h = el(depth === 1 ? "h1" : "h2", null, line.replace(/^#+\s/, ""));
      if (depth >= 3) { h.style.fontSize = "13.5px"; h.style.color = "var(--muted)"; }
      wrap.appendChild(h);
      continue;
    }
    if (/^>\s?/.test(line)) {
      flush();
      const q = el("blockquote");
      q.innerHTML = inline(line.replace(/^>\s?/, ""));
      wrap.appendChild(q);
      continue;
    }
    if (/^\|/.test(line)) {
      if (/^\|[-\s|:]+\|$/.test(line)) continue;
      if (!table) { table = el("table"); wrap.appendChild(table); }
      const tr = el("tr");
      line.split("|").slice(1, -1).forEach((c) => {
        const td = el("td", "small");
        td.innerHTML = inline(c.trim());
        tr.appendChild(td);
      });
      table.appendChild(tr);
      continue;
    }
    if (/^[-*]\s/.test(line)) {
      if (!list) { list = el("ul"); wrap.appendChild(list); }
      const li = el("li");
      li.innerHTML = inline(line.replace(/^[-*]\s/, ""));
      list.appendChild(li);
      continue;
    }
    flush();
    const pEl = el("p");
    pEl.innerHTML = inline(line);
    wrap.appendChild(pEl);
  }
  return wrap;
}
function inline(t) {
  return t
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(US-\d\d|AC-\d\d\.\d)/g, '<span class="hl">$1</span>');
}

function openCasesTable() {
  sheet("文本用例 · 100 条", (b) => {
    const f = el("div", "filters");
    const mk = (label, key, opts, render) => {
      const s = el("select");
      s.appendChild(new Option(label, ""));
      opts.forEach((o) => s.appendChild(new Option(render ? render(o) : o, o)));
      s.value = S.filter[key];
      s.onchange = () => { S.filter[key] = s.value; openCasesTable(); };
      f.appendChild(s);
    };
    mk("判定硬度", "tier", ["1", "2", "3"], (v) => "t" + v);
    mk("设计方法", "m", [...new Set(CASES.map((c) => c.m))]);
    mk("故事", "s", [...new Set(CASES.map((c) => c.s))]);
    mk("门禁分", "gate", ["0.9", "0.8"], (v) => "gate ≥ " + Math.round(v * 100) + "%");
    const lab = el("label");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = S.filter.degraded;
    cb.onchange = () => { S.filter.degraded = cb.checked; openCasesTable(); };
    lab.append(cb, document.createTextNode("只看已退化"));
    f.appendChild(lab);
    const rows = CASES.filter((c) =>
      (!S.filter.tier || String(c.tier) === S.filter.tier) &&
      (!S.filter.m || c.m === S.filter.m) &&
      (!S.filter.s || c.s === S.filter.s) &&
      !S.filter.degraded);
    f.appendChild(el("span", "count", `${rows.length} / ${CASES.length}（样本）`));
    b.appendChild(f);

    /* AC-06.2 说的「可批量修正或重生成」：选中若干条，一个动作作用于全部。
       之前这些只写在 chat 的回复文案里，没有入口——文案不是功能。 */
    const bulk = el("div", "filters");
    bulk.style.borderTop = "1px solid var(--hair)";
    bulk.style.paddingTop = "10px";
    const nsel = S.picked.size;
    bulk.appendChild(el("span", "card-s", `已选 ${nsel} 条`));
    const find = el("input"); find.placeholder = "查找"; find.style.width = "110px";
    const repl = el("input"); repl.placeholder = "${env.LOGIN_USER}"; repl.style.width = "150px";
    bulk.append(find, el("span", "card-s", "→"), repl);
    const doRepl = el("button", "hint", "替换");
    doRepl.onclick = () => {
      if (!nsel || !find.value) return;
      let n = 0;
      CASES.forEach((c) => {
        if (!S.picked.has(c.id)) return;
        const hit = c.exp.includes(find.value) || c.steps.some((x) => x.includes(find.value));
        if (!hit) return;
        c.exp = c.exp.split(find.value).join(repl.value);
        c.steps = c.steps.map((x) => x.split(find.value).join(repl.value));
        c.edited = true;
        n += 1;
      });
      // 不匹配就不记编辑，否则 diff 会开在两列一模一样的内容上
      say("sys", `批量替换：改了 ${n} 条，其余不含该字面量的未动`);
      openCasesTable();
    };
    bulk.appendChild(doRepl);
    const prio = el("select");
    prio.appendChild(new Option("设优先级", ""));
    ["P0", "P1", "P2"].forEach((x) => prio.appendChild(new Option(x, x)));
    prio.onchange = () => {
      if (!nsel || !prio.value) return;
      CASES.forEach((c) => { if (S.picked.has(c.id)) c.prio = prio.value; });
      say("sys", `${nsel} 条设为 ${prio.value}`);
      openCasesTable();
    };
    bulk.appendChild(prio);
    const regen = el("button", "hint", "重生成选中");
    regen.onclick = () => {
      if (!nsel) return;
      say("you", `把选中的 ${nsel} 条按门禁意见重写`);
      setTimeout(() => say("bot", `${nsel} 条已重写，每条一次模型调用（本地模型约 80 秒/条）。都落成 <code>by: model</code> 的编辑——<b>产物没被改写</b>，两版并排可比。`), 260);
      $("#sheet").hidden = true;
    };
    bulk.appendChild(regen);
    const ap = el("button", "hint", "批准入库");
    ap.onclick = () => { if (nsel) { CASES.forEach((c) => { if (S.picked.has(c.id)) c.decided = "approved"; }); say("sys", `${nsel} 条已批准，出处随它们进看板`); S.picked.clear(); openCasesTable(); } };
    const rj = el("button", "hint", "拒绝");
    rj.title = "拒绝会被记住，队列不再问第二遍";
    rj.onclick = () => { if (nsel) { CASES.forEach((c) => { if (S.picked.has(c.id)) c.decided = "rejected"; }); say("sys", `${nsel} 条已拒绝 · 决定被记住，队列不会再问`); S.picked.clear(); openCasesTable(); } };
    bulk.append(ap, rj);
    b.appendChild(bulk);

    const t = el("table");
    t.innerHTML = "<thead><tr><th></th><th>用例</th><th>故事</th><th>方法</th><th>判定</th><th>门禁</th></tr></thead>";
    const tb = el("tbody");

      const tr = el("tr", "pick");
      tr.onclick = () => selectCase(c.id);
      const tdc = el("td", "small");
      const cb = el("input");

      cb.checked = S.picked.has(c.id);
      cb.disabled = !!c.decided;
      cb.onclick = (e) => {
        e.stopPropagation();
        S.picked.has(c.id) ? S.picked.delete(c.id) : S.picked.add(c.id);
        openCasesTable();
      };
      tdc.appendChild(cb);
      tr.appendChild(tdc);
      const td1 = el("td");
      const title = el("div");
      title.textContent = c.t;
      if (c.decided) {
        const badge = el("span", "chip " + (c.decided === "approved" ? "machine" : "warn"), c.decided === "approved" ? "已批准" : "已拒绝");
        badge.style.marginLeft = "6px";
        title.appendChild(badge);
      }
      if (c.edited) {
        const e2 = el("span", "chip judge", "已编辑");
        e2.style.marginLeft = "6px";
        title.appendChild(e2);
      }
      td1.appendChild(title);
      td1.appendChild(el("div", "card-s", "→ " + c.exp));
      tr.appendChild(td1);
      tr.appendChild(el("td", "small", c.s));
      tr.appendChild(el("td", "small", c.m));
      const td4 = el("td", "small");
      td4.append("t" + c.tier + " ");

      tr.appendChild(td4);
      const td5 = el("td", "small");

      else td5.textContent = "—";
      tr.appendChild(td5);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    b.appendChild(t);
    b.appendChild(el("div", "note", "这就是第 5 节那个判断的具体形状：一百条用例在表里能筛能扫，铺在画布上不能。画布只放聚合与抽样。"));
  });
}

  pair.appendChild(guard);

  p.appendChild(pair);
  return p;
}

function kpi(label, value, tone) {
  const d = el("div", "kpi");
  d.appendChild(el("div", "l", label));
  d.appendChild(el("div", "v " + (tone || ""), value));
  return d;
}

/* US-16.1 覆盖矩阵：清单 × 用例，命中/遗漏/多余 */
function openMatrix() {
  sheet("覆盖矩阵 · 16 条清单 × 100 条用例", (b) => {
    b.appendChild(el("div", "note", "「该拆成 N 个吗」问的就是这张图：清单在左，用例在右。红色是没有任何用例覆盖的清单项——它是拆解问题，收紧门禁变不出缺失的用例。"));
    const wrap = el("div", "scroll");
    wrap.style.marginTop = "12px";
    const m = el("div", "matrix");
    const all = [...GOLD.hits.map((id) => ({ id, hit: true })), ...GOLD.misses.map((x) => ({ ...x, hit: false }))]
      .sort((x, y) => x.id.localeCompare(y.id));
    all.forEach((item) => {
      const label = el("div", "card-s");
      label.textContent = item.id + (item.held ? " ·留出" : "");
      label.style.whiteSpace = "nowrap";
      m.appendChild(label);
      for (let i = 0; i < 24; i++) {
        const c = el("div", "cell " + (item.hit ? (i % 5 === 0 ? "hit" : "extra") : "extra"));
        if (!item.hit && i === 0) c.className = "cell miss";
        m.appendChild(c);
      }
    });
    wrap.appendChild(m);
    b.appendChild(wrap);
    const lg = el("div", "legend");
    lg.innerHTML = `<span><i style="background:var(--machine)"></i>命中 ${GOLD.hits.length}</span>
      <span><i style="background:var(--fail)"></i>遗漏 ${GOLD.misses.length}</span>
      <span><i style="background:var(--hair)"></i>多余 ${GOLD.extras}</span>`;
    b.appendChild(lg);
    b.appendChild(el("div", "sec", "遗漏清单"));
    GOLD.misses.forEach((x) => {
      const d = el("div", "finding");
      d.textContent = `${x.id}${x.held ? "（留出）" : ""} — ${x.t}`;
      b.appendChild(d);
    });
    b.appendChild(el("div", "warnline", "留出集的 3 条永远不参与调参：它们唯一的价值就是没被用来调过任何东西。"));
  });
}

/**
 * One execution, in full.
 *
 * Ported section for section from the old run drawer, because those sections were right:
 * a run is not a status, it is an assertion result plus two baselines plus the steps that
 * got there. Two things are added — who settled the verdict (a program or a model looking
 * at a screenshot), and the attribution of the failure, so an infra flake never reads as a
 * product defect.
 */
function openRun(r) {
  sheet("执行 · " + r.case, (b) => {
    /* 顶部：结果、归因、自愈、成本 */
    const head = el("div", "row");
    head.appendChild(el("span", r.status === "passed" ? "chip machine" : "chip fail",
      r.status === "passed" ? "通过" : "失败"));
    if (r.kind) head.appendChild(el("span", r.kind === "infra" ? "chip warn" : "chip fail",
      r.kind === "infra" ? "infra —— 不计入产品缺陷" : "assert —— 断言没成立"));
    if (r.attempts > 1) head.appendChild(el("span", "chip judge", `自愈重试 ${r.attempts} 次`));
    head.appendChild(el("span", "card-s", `${fmtMs(r.ms)} · ${r.id}`));
    b.appendChild(head);
    if (r.attempts > 1) b.appendChild(el("div", "warnline",
      "自愈后通过不是一次干净的绿：严口径通过率会把它扣掉，看板上也留着标记。"));

    /* 功能断言 */
    b.appendChild(el("div", "sec", "功能断言"));
    const ok = r.status === "passed";
    const oracleBox = el("div", ok ? "okline" : "warnline");
    oracleBox.style.marginTop = "0";
    oracleBox.textContent = ok
      ? "该进程行同时显示「类型」「pid」「心跳」「重启次数」「当前任务」「累计成本」六个字段，且值非空 —— 成立"
      : (r.kind === "infra"
          ? "断言从未被真正评估：Midscene 重规划超限 + puppeteer 协议错误。这不是产品的结论。"
          : "系统提示「消息不能为空」或发送按钮保持禁用 —— 不成立（判定模型说按钮看起来可用，而 DOM 上它确实是 disabled）");
    b.appendChild(oracleBox);
    const who = el("div", "row");
    who.appendChild(el("span", "chip " + r.by, r.by === "machine" ? "程序判定" : "模型看截图判定"));
    who.appendChild(el("span", "card-s", r.by === "machine"
      ? "0.66 秒，跨运行稳定"
      : "40–120 秒；同一个页面可能给出不同答案 —— 这条用例标的 tier 在执行时没有兑现"));
    b.appendChild(who);

    /* 性能基线 */
    b.appendChild(el("div", "sec", "性能基线"));
    const pt = el("table");
    pt.innerHTML = "<thead><tr><th>指标</th><th>本次</th><th>基线</th><th>Δ</th></tr></thead>";
    const ptb = el("tbody");
    Object.keys(PERF.metrics).forEach((m) => {
      const cur = PERF.metrics[m], base = PERF.baseline[m];
      const d = Math.round(((cur - base) / base) * 100);
      const tr = el("tr");
      tr.appendChild(el("td", "small", m.replace("Ms", "")));
      tr.appendChild(el("td", "small", cur + " ms"));
      tr.appendChild(el("td", "small", base + " ms"));
      const td = el("td", "small");
      td.appendChild(el("span", d > 15 ? "chip fail" : "chip machine", (d > 0 ? "+" : "") + d + "%"));
      tr.appendChild(td);
      ptb.appendChild(tr);
    });
    pt.appendChild(ptb);
    b.appendChild(pt);
    const prow = el("div", "row");
    if (CFG.approvedPerf) prow.appendChild(el("span", "chip machine", "已批准为新基线"));
    else {
      const ap = el("button", "hint", "批准为基线");
      ap.onclick = () => { CFG.approvedPerf = true; render(); openRun(r); };
      prow.append(ap, el("span", "card-s", "回归要人看过：预算之内的波动和真的变慢，程序分不出来"));
    }
    b.appendChild(prow);

    /* 视觉基线：逐步三图 + 批准 */
    b.appendChild(el("div", "sec", "视觉基线"));
    if (r.visual === "diff") {
      const line = el("div", "row");
      line.appendChild(el("span", "chip fail", "step 1 · 8.5% 变化"));
      if (CFG.approvedVisual) line.appendChild(el("span", "chip machine", "已批准为新基线"));
      else {
        const ap = el("button", "hint", "批准为基线");
        ap.onclick = () => { CFG.approvedVisual = true; render(); openRun(r); };
        line.appendChild(ap);
      }
      b.appendChild(line);
      const shots = el("div", "shots");
      [["基线", ""], ["本次", ""], ["差异", "diff"]].forEach(([cap, cls]) => {
        const sh = el("div", "shot " + cls);
        sh.appendChild(el("div", "cap", cap));
        sh.appendChild(el("div", "ph"));
        shots.appendChild(sh);
      });
      b.appendChild(shots);
    } else {
      b.appendChild(el("div", "okline", r.visual === "new_baseline" ? "首跑：已留下基线，之后才有得比。" : "逐帧 match，没有视觉变化。"));
    }

    /* 数据驱动：一条用例按数据行跑多次，逐行列出而不是给一个汇总 */

    r.appendChild(el("span", "card-t", id));
    r.appendChild(el("span", "chip machine", kind));
    r.appendChild(el("span", "chip warn", st));
    const go = el("button", "hint", "启动");
    go.onclick = () => say("sys", id + " 启动中 · 健康检查会告诉你它是不是真的就绪");
    r.appendChild(go);
    b.appendChild(r);
    b.appendChild(el("div", "card-s", cmd));
    b.appendChild(el("div", "card-s", "健康检查：" + hc));
    box.appendChild(b);
  });
  const ask = el("button", "send", "让 agent 起草一个能力");
  ask.onclick = () => {
    S.view = "ws";
    render();
    say("you", "给我一个 mock 后端能力，用 node 跑 scripts/mock.js，就绪检查 http://127.0.0.1:4010/health");
    setTimeout(() => say("bot", "草稿已生成：<span class='mono'>{id: mock-api, kind: mock, command: node, args:[scripts/mock.js], healthcheck:{http, :4010/health}}</span><br><b>校验通过</b>，可以保存。命令必须是裸程序名——shell 当命令会让被审阅的那行不是真正跑的那行。"));
  };
  box.appendChild(ask);
  box.appendChild(el("div", "note", "「运行中」不等于「就绪」：没有健康检查的 recipe，只能告诉你进程没退出。"));
  return box;
}
