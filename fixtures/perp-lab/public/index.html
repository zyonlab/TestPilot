<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Perp Demo</title>
<style>body{font-family:system-ui;margin:24px;max-width:560px}label{display:block;margin:10px 0 4px}input,select,button{font-size:16px;padding:6px 10px}button{margin-top:12px}.tab,.mode{margin:0 6px 0 0;background:#eee;border:1px solid #999}.tab.on,.mode[aria-pressed=true],#tpsl[aria-pressed=true]{background:#2a9d8f;color:#fff}#msg{margin-top:12px;color:#b00}#state{margin-top:16px;font-family:monospace;white-space:pre}[hidden]{display:none!important}fieldset{border:1px solid #ccc;margin-top:12px}</style></head>
<body>
<h1>BTC-USDC Perp</h1>
<div id="tabs"><button id="tab-market" class="tab on">Market</button><button id="tab-limit" class="tab">Limit</button><button id="tab-stop" class="tab">Stop Limit</button></div>
<div id="modes"><button id="mode-cross" class="mode" aria-pressed="true">Cross</button><button id="mode-isolated" class="mode" aria-pressed="false">Isolated</button></div>
<label>Price (USDC) <input id="price" type="text" inputmode="decimal" value="80000"></label>
<label id="trigger-row" hidden>Trigger Price (USDC) <input id="trigger" type="text" inputmode="decimal" placeholder="Trigger price"></label>
<label>Size (BTC) <input id="size" type="text" inputmode="decimal" placeholder="数量（BTC）"></label>
<label>Leverage <input id="lev" type="text" inputmode="numeric" value="20"> <button id="setlev">Set Leverage</button></label>
<label><input id="ro" type="checkbox"> Reduce Only</label>
<button id="tpsl" aria-pressed="false">TP/SL</button>
<fieldset id="tpsl-panel" hidden><legend>Take Profit / Stop Loss</legend>
<label>Take Profit Price (USDC) <input id="tp" type="text" inputmode="decimal" placeholder="Take profit"></label>
<label>Stop Loss Price (USDC) <input id="sl" type="text" inputmode="decimal" placeholder="Stop loss"></label>
</fieldset>
<button id="place">Place Order</button>
<button id="close">Close Position</button>
<button id="cancel">Cancel All</button>
<div id="msg" role="status"></div>
<div id="state"></div>
<script>
const $=(s)=>document.querySelector(s);
const DEFECT=window.__LAB_DEFECT||null;
let orderType='market';
const setTab=(t)=>{orderType=t;for(const k of ['market','limit','stop'])$('#tab-'+k).classList.toggle('on',k===t);$('#trigger-row').hidden=t!=='stop';};
$('#tab-market').onclick=()=>setTab('market');
$('#tab-limit').onclick=()=>setTab('limit');
$('#tab-stop').onclick=()=>setTab('stop');
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,body:await r.json()}));
async function refresh(){const s=await fetch('/api/clearinghouse').then(r=>r.json());$('#mode-cross').setAttribute('aria-pressed',String(s.marginMode==='cross'));$('#mode-isolated').setAttribute('aria-pressed',String(s.marginMode==='isolated'));$('#state').textContent='Position: '+(s.position?s.position.szi+' BTC @'+s.position.leverage+'x':'none')+'\nOpen orders: '+s.orders.length+'\nLeverage: '+s.leverage+'x\nMargin mode: '+s.marginMode+'\nBalance: '+s.balance+' USDC';}
$('#mode-cross').onclick=async()=>{const r=await post('/api/margin',{mode:'cross'});$('#msg').textContent=r.ok?'Margin mode: cross':r.body.error;refresh();};
$('#mode-isolated').onclick=async()=>{const r=await post('/api/margin',{mode:'isolated'});$('#msg').textContent=r.ok?'Margin mode: isolated':r.body.error;refresh();};
$('#tpsl').onclick=()=>{const on=$('#tpsl').getAttribute('aria-pressed')!=='true';$('#tpsl').setAttribute('aria-pressed',String(on));if(DEFECT!=='tpsl-panel')$('#tpsl-panel').hidden=!on;};
$('#place').onclick=async()=>{const body={type:orderType,size:$('#size').value,price:$('#price').value,reduceOnly:$('#ro').checked};if(orderType==='stop')body.triggerPx=$('#trigger').value;if($('#tpsl').getAttribute('aria-pressed')==='true'){body.tp=$('#tp').value;body.sl=$('#sl').value;}const r=await post('/api/order',body);$('#msg').textContent=r.ok?'Order submitted':r.body.error;refresh();};
$('#setlev').onclick=async()=>{const r=await post('/api/leverage',{value:Number($('#lev').value)});$('#msg').textContent=r.ok?'Leverage set to '+r.body.leverage+'x':r.body.error;refresh();};
$('#close').onclick=async()=>{await post('/api/close',{});$('#msg').textContent='Position closed';refresh();};
$('#cancel').onclick=async()=>{await post('/api/cancel',{});$('#msg').textContent='All orders cancelled';refresh();};
refresh();
</script></body></html>
