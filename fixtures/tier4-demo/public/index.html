<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Perp Demo</title>
<style>body{font-family:system-ui;margin:24px;max-width:520px}label{display:block;margin:10px 0 4px}input,select,button{font-size:16px;padding:6px 10px}button{margin-top:12px}.tab{margin:0 6px 0 0;background:#eee;border:1px solid #999}.tab.on{background:#2a9d8f;color:#fff}#msg{margin-top:12px;color:#b00}#state{margin-top:16px;font-family:monospace;white-space:pre}</style></head>
<body>
<h1>BTC-USDC Perp</h1>
<div id="tabs"><button id="tab-market" class="tab on">Market</button><button id="tab-limit" class="tab">Limit</button></div>
<label>Price (USDC) <input id="price" type="text" inputmode="decimal" value="80000"></label>
<label>Size (BTC) <input id="size" type="text" inputmode="decimal" placeholder="数量（BTC）"></label>
<label>Leverage <input id="lev" type="text" inputmode="numeric" value="20"> <button id="setlev">Set Leverage</button></label>
<button id="place">Place Order</button>
<button id="close">Close Position</button>
<button id="cancel">Cancel All</button>
<div id="msg" role="status"></div>
<div id="state"></div>
<script>
const $=(s)=>document.querySelector(s);
let orderType='market';
$('#tab-market').onclick=()=>{orderType='market';$('#tab-market').classList.add('on');$('#tab-limit').classList.remove('on');};
$('#tab-limit').onclick=()=>{orderType='limit';$('#tab-limit').classList.add('on');$('#tab-market').classList.remove('on');};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(async r=>({ok:r.ok,body:await r.json()}));
async function refresh(){const s=await fetch('/api/clearinghouse').then(r=>r.json());$('#state').textContent='Position: '+(s.position?s.position.szi+' BTC @'+s.position.leverage+'x':'none')+'\nOpen orders: '+s.orders.length+'\nLeverage: '+s.leverage+'x\nBalance: '+s.balance+' USDC';}
$('#place').onclick=async()=>{const r=await post('/api/order',{type:orderType,size:$('#size').value,price:$('#price').value});$('#msg').textContent=r.ok?'Order submitted':r.body.error;refresh();};
$('#setlev').onclick=async()=>{const r=await post('/api/leverage',{value:Number($('#lev').value)});$('#msg').textContent=r.ok?'Leverage set to '+r.body.leverage+'x':r.body.error;refresh();};
$('#close').onclick=async()=>{await post('/api/close',{});$('#msg').textContent='Position closed';refresh();};
$('#cancel').onclick=async()=>{await post('/api/cancel',{});$('#msg').textContent='All orders cancelled';refresh();};
refresh();
</script></body></html>
