# P0 门禁（07 T-17）：PR 上跑 demo 的 P0——回放臂，不打模型。
# 判据是 cases.json 里那份 kind:api，动作是固定选择器（ci/p0-oracles.mjs）。红 = 产品的接口状态不对。
name: p0
on:
  pull_request:
    paths: ["fixtures/tier4-demo/**"]
  workflow_dispatch:
jobs:
  p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx puppeteer browsers install chrome
        working-directory: packages/harness-testing
      - name: start demo
        run: node fixtures/tier4-demo/server.mjs --port 5390 & sleep 1
      - name: P0（回放臂，0 次模型调用）
        run: node fixtures/tier4-demo/ci/p0-oracles.mjs --base http://127.0.0.1:5390
        env:
          # 这一档不该有任何模型端点；留空是刻意的，脚本里也没有会用到它的路径。
          OPENAI_API_KEY: ""
