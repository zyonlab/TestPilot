# 借 commerce-agents 的分层：无 API key 的检查跑在每次 PR 上；真跑模型的评测由人触发。
#
# 三件事：
#   1. typecheck + 各包单测（含 hook 子进程测试）——门禁类行为不过模型，脚本化输入就能钉住；
#   2. check-drift——两臂提示词的规则逐条认领，漂移即红；
#   3. replay——对仓库里冻结的运行重打分，coverage 必须和 expected.json 逐位相同。
#      这是「CI 只跑 replay、不打 API」：score_run 是确定性的，录制的运行在 benchmark/*/replay/ 里。
name: ci
on:
  push:
    branches: [main, v3]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: unit tests (packages)
        run: pnpm -r --filter './packages/**' test
      - name: hook tests (子进程，喂 stdin 断 stdout)
        run: pnpm test:hooks
      - name: prompt drift (两臂提示词逐条认领)
        run: pnpm check:drift
      - name: replay frozen runs (确定性重打分，不打 API)
        run: node scripts/replay.mjs
