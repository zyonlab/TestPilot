# Workspace root.
#
# `server/` joined as a member the moment the gateway needed `@testpilot/harness-core`
# (phase-0 gateway wiring). It keeps its `testpilot-server` name and layout until the
# rename-to-apps/gateway step; its standalone lockfile is gone — the root one governs.
packages:
  - "packages/*"
  - "apps/*"
  - "server"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - puppeteer
